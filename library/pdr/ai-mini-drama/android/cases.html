<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mini Drama Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

es an export sheet without exporting and the result page is unchanged\nA done page closes back to the result page and the video is in the Gallery once\nThe spec draws neither page (PM 10/22: the export runs on the result page with a spinner, R-324): record what the build shows (Q-A6)","Priority":"P3","Spec Ref":"R-324, R-352, R-356","Notes":"Android ticket DRA262610P0219 (TC-343): the build opens an export sheet"},{"ID":"TC-517","Section":"Video","Precondition":"Full video finished, result page open","Action":"1. Tap 「Export Full Video」\n2. Tap ← at once and wait on the chat until the export ends\n3. Tap 「Export Full Video」 again\n4. Use system back (Android back gesture or button) to the chat and again to the AI Mini Drama landing page, and wait there","Expected Result":"← and system back both work during the export\nEach export continues in the background and 「Saved to Gallery.」 shows on the page the user is on (the chat, then the landing page)\nThe Gallery has both videos","Priority":"P2","Spec Ref":"R-323, R-306, R-352","Notes":"PM 10/22 export states (Figma 4418:2), newer than PM 10/20; RD to confirm background export (Q-A9). If RD keeps the export in the foreground, Back shows 「Stop exporting?」/「Your video won't be saved.」 (Keep exporting / Stop) instead"},{"ID":"TC-518","Section":"Video","Precondition":"1. Full video finished, result page open\n2. Appium confirmed on USB first","Action":"1. Tap 「Export Full Video」\n2. Turn Wi-Fi off before it finishes and read the result\n3. Turn Wi-Fi back on and tap 「Export Full Video」 again","Expected Result":"The first export ends with the toast 「Couldn't save your video. Try again.」\nThe spinner goes and ←, 「Full Edit」, 「Export Full Video」, the download icon, play and the thumbnails all work again\nThe second export saves (「Saved to Gallery.」)","Priority":"P2","Spec Ref":"R-325","Notes":"PM 10/22 export states (Figma 4418:2), newer than PM 10/20. Real network loss (REQ-020); restore Wi-Fi right after. If the export still succeeds offline (a local flatten), the row stays parked (fault-injection: no fault switch on Android 16.8) and is recorded Blocked"},{"ID":"TC-418","Section":"Video","Precondition":"Drama video edited in Full Edit (a free text, a free sticker and the free filter ST06 added)","Action":"1. Go back\n2. Tap 「Export Full Video」 › Produce and play the file","Expected Result":"Export Full Video includes the Full Edit changes, or says that it exports the original video","Priority":"P2","Spec Ref":"R-077, R-249, R-141","Notes":"DRA262610P0071 (ProposeNAB, AIFound, UX)"},{"ID":"TC-344","Section":"Chat behaviour","Precondition":"Chat with several messages","Action":"Send a message and watch while the reply generates","Expected Result":"The sent message moves to the top of the screen\nThe reply generates below without the view following it\n↓ appears when it runs past the screen and tapping it scrolls smoothly to the bottom","Priority":"P2","Spec Ref":"R-250","Notes":"DRA262610P0125 (Assigned, AIAgent); TC-344 starts at the bottom, this starts scrolled up. Design spec differs in part: PM §13.2 (R-250) scrolls the sent message to the top and the view does not follow the reply (↓ appears); spec wins for the reply — the ticket expects 「After sending, the chat scrolls down so the newest message and the response are visible」; the spec governs this row (REQ-043)"},{"ID":"TC-554","Section":"Chat behaviour","Precondition":"1. Chat with several messages\n2. A message just sent (pinned at the top) and its reply still generating\n3. Do not touch the screen","Action":"1. Wait until a skeleton in the reply turns into its result\n2. Wait for the next new message below it","Expected Result":"Step 1: the result replaces the skeleton in place and the chat does not scroll\nStep 2: the chat scrolls only until the start of the new message comes into view, not straight to the bottom","Priority":"P3","Spec Ref":"R-485","Notes":"PM 11/4 §13.2 ③ (board 5128:8, pm-1002-update). PM-only: no Design frame yet"},{"ID":"TC-501","Section":"Chat behaviour","Precondition":"New drama with a long outline","Action":"Tap Generate / Confirm on each step (characters, Create storyboard, Generate Video) and wait for the video to finish","Expected Result":"The chat never jumps back to the Story Outline\nThe user's request stays at the top with the reply below, and the chat stays at the newest message","Priority":"P2","Spec Ref":"R-250, R-089, R-141","Notes":"DRA262610P0260 (Assigned, AIFound)"},{"ID":"TC-345","Section":"Video","Precondition":"1. Storyboard finished\n2. Count its scenes","Action":"Read 「Full Video」 on the video settings card","Expected Result":"The length is 15 s × the number of scenes (e.g. 90 sec for 6 scenes, 120 sec for 8)","Priority":"P3","Spec Ref":"R-251","Notes":"Design frames show 90 sec and 120 sec as examples; answers Q-13; Android ticket DRA262610-0055 (NewCreated, AIFound, UX): Full Video offered 90 sec for a 6-scene drama and 60 sec for a 4-scene one; the spec rule (15 s × scenes) is that consistent rule"},{"ID":"TC-346","Section":"Characters","Precondition":"Account that already saw the 「Tap to choose a look for {name}」 hint in an earlier drama","Action":"Start a new drama and pick a look for the first character","Expected Result":"No hint appears","Priority":"P3","Spec Ref":"R-252","Notes":""},{"ID":"TC-347","Section":"Video","Precondition":"Video settings card shown","Action":"1. Tap Standard\n2. Tap Fast","Expected Result":"The subtitle changes to 「Seedance 2.0 • Balanced quality for everyday stories」, then 「Seedance 2.0 Mini • Quicker results, fewer credits」","Priority":"P3","Spec Ref":"R-253","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-348","Section":"Characters","Precondition":"Cast set","Action":"1. Ask in chat 「Can you change one of the characters to look older?」\n2. Tap a character chip (e.g. 「The Manager」)","Expected Result":"「Sure! Which character would you like to change?」 with 2–4 option chips\nTapping a chip sends it as a message and the chips disappear","Priority":"P2","Spec Ref":"R-254, R-446","Notes":"PM 10/16 newer than Design (REQ-026); DRA262610P0092 (TRCreated, SPEC); Design spec differs: PM 10/16 (R-254, TC-348) has Iris ask 「Sure! Which character would you like to change?」 with 2–4 chips when the request is unclear — spec wins — the ticket expects 「Iris shows the Character result board directly instead of asking which character to modify」; the spec governs this row (REQ-043)"},{"ID":"TC-391","Section":"Characters","Precondition":"Iris asked 「Which character would you like to change?」 with chips","Action":"Type the character's name and send it instead of tapping a chip","Expected Result":"Iris takes the typed answer as it would a chip and offers the 「Update characters」 card","Priority":"P3","Spec Ref":"R-301","Notes":""},{"ID":"TC-349","Section":"Characters","Precondition":"「Update characters • 1 character」 card shown (TC-045)","Action":"Tap Generate and wait","Expected Result":"The card disappears and Iris replies 「Working on it...」\nThen 「Here's your updated cast.」 with a new Story Outline & Characters card showing the new look, and 「Your characters' looks are updated! Ready to create the storyboard?」 with Create storyboard\nCredit Details shows the card price charged once (the outline text is updated as well)","Priority":"P1","Spec Ref":"R-254, R-301","Notes":"PM 10/16 newer than Design (REQ-026); DRA262610P0088 (TRCreated, untagged); seen: 「Working on it...」 for minutes, the card alongside it, then the toast 「Generation paused because credit information timed out」; Design spec differs: MX charging boards draw 「Consume credits?」/「Credits will be consumed for this task.」 before creating characters, while Design shows the price on the card with no separate confirmation (R-100, TC-115) — Design wins — the ticket expects 「No 「Consume credits?」 card appears; the character (text-to-image) generation starts directly」; the spec governs this row (REQ-043); Android ticket DRA262610-0053 (TRCreated, AIFound): after asking to regenerate a character and answering 「Yes」, Iris repeated 「Ready to create your characters?」 without starting; Android ticket DRA262610P0187 (Assigned, AIFound): after a chat character change a storyboard card with no scene images appears although no storyboard was generated"},{"ID":"TC-453","Section":"Characters","Precondition":"1. Template chat with preset characters (e.g. 「The Art of Falling」), storyboard not started\n2. Credit pill read","Action":"1. Send 「Make Julian Cross a man in his 50s with gray hair.」\n2. Tap Generate on the priced card and wait for the turn to end","Expected Result":"The preset character is regenerated with the new look\nIf it fails, an error shows and the credits are refunded (Credit Details)","Priority":"P1","Spec Ref":"R-254, R-141","Notes":"DRA262610P0186 (NeedCodeReview, AIFound): 1 credit charged, image unchanged, no result or error; same symptom as iOS ticket DRI261896P0019 (was TC-206)"},{"ID":"TC-350","Section":"Characters","Precondition":"Cast set","Action":"Ask in chat to change two characters' looks","Expected Result":"The card reads 「Update characters • 2 characters」 and its price is twice one character generation","Priority":"P2","Spec Ref":"R-254","Notes":"PM 10/16 newer than Design (REQ-026). Credit numbers are binding"},{"ID":"TC-429","Section":"Characters","Precondition":"Every cast slot already has a look (fully mapped cast), storyboard not started","Action":"Ask Iris in chat to regenerate the characters and wait for the reply","Expected Result":"Iris offers the priced character-generation card (「Update characters」 with ◆price and Generate)\nNo 「(No reply)」 and no unrelated 「Create storyboard」 offer","Priority":"P2","Spec Ref":"R-254, R-141","Notes":"DRA262610P0132 (Assigned, AIAgent); RD: chat character generation added (PR 2969)"},{"ID":"TC-351","Section":"Characters","Precondition":"Character update generating (「Working on it...」)","Action":"Tap Back","Expected Result":"「Stop and lose your credits?」/「This is still generating. If you leave now, it'll stop and the credits you've spent won't be refunded.」 with Leave anyway / Keep Generating","Priority":"P2","Spec Ref":"R-254","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-352","Section":"Characters","Precondition":"Storyboard already generated","Action":"1. Ask in chat to change a character's look\n2. Tap Generate on the card","Expected Result":"Same flow\nIt ends with 「Your characters' looks are updated! Ready to create the storyboard?」 and a priced Create storyboard card (a new storyboard is charged again)","Priority":"P2","Spec Ref":"R-254","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-353","Section":"Characters","Precondition":"Character update for two characters, one will fail (fault switch (iOS Pink; none on Android 16.8) › Trip image moderation; record the switch)","Action":"Tap Generate and wait","Expected Result":"The successful character is updated\nThe failed one shows 「!」 and its credits are refunded, as in §13.10 (TC-042)","Priority":"P2","Spec Ref":"R-254","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-579","Section":"Characters","Precondition":"1. Chat with a cast and its Story Outline & Characters card\n2. Credit balance noted","Action":"1. Ask in chat 「Make The Manager look exactly like \u003ca well-known actor>」\n2. Tap Generate on the 「Update characters」 card and wait\n3. Tap 「Close」 and record what the chat shows\n4. Open Credit Details","Expected Result":"Step 2: 「This image can't be used」/「It looks like a real public figure. Send us feedback and our support team will check your credits.」 with 「Close」 and a blue 「Send Feedback」\nStep 2: no new look is shown\nStep 3: recorded (Q-A23)\nStep 4: the update's charge stays, with no automatic refund","Priority":"P2","Spec Ref":"R-495, R-496","Notes":"PM 11/5 §13.26 names changing a character in chat; what Close does here is not stated (Q-A23). If Iris declines or rewrites the request before the card, record the reply and describe the person's look instead of the name. Every try spends the card price (allowed, REQ-073). PM-only: no Design frame yet"},{"ID":"TC-354","Section":"Make your character","Precondition":"Character description over 1,000 characters (TC-051), required fields set","Action":"Delete text until it is under 1,000 characters","Expected Result":"The counter is no longer red, the limit message disappears and Generate becomes available","Priority":"P2","Spec Ref":"R-255","Notes":"Recovery as in PM §13.11; the Design frame shows only the over-limit state"},{"ID":"TC-355","Section":"Storyboard Preview","Precondition":"Storyboard finished but its preview failed (as in TC-078)","Action":"1. Look under the Storyboard Preview card\n2. Tap 「Create video anyways」","Expected Result":"A 「Create video anyways」 button sits below the failed preview card and its Retry ◆1\nTapping it goes on to the video without a preview (record what opens, e.g. 「Choose your video settings」)","Priority":"P2","Spec Ref":"R-256","Notes":"PM E4 frame; where the button leads is not drawn. The failure copy is checked in TC-078"}],"previous":{},"requirements":"# AI Mini Drama — requirements (android)\nSpec: AI Mini Drama - Design Spec.pdf, PDRM MX.pdf, AI Mini Drama - PM Spec 20261021.pdf (spec set specs/2026-10-21-2; board notes in specs/2026-10-21-2/extracted/board-notes.md, flow arrows in specs/2026-10-21-2/extracted/arrows.json)\nSource tags: [PM:\u003cboard>] / [DS:\u003cboard>] / [MX:\u003cboard>] = board id in specs/2026-10-21-2/extracted/boards/ (boards up to R-103 were read from the identical 2026-10-16 copies); [Req: REQ-…] = library/pdr/ai-mini-drama/requests.md; [Build: TR…] = RD Note on that Testing Request. Newest dated frame wins when frames disagree; Design > MX > PM.\nAndroid (2026-10-27, REQ-042): built from the iOS analysis of the same spec set (draft ios/20261022-145212); the Android differences the spec states are marked 「Android:」 and the Android rules are under \"Added 2026-10-27 — Android\".\n\n## Entry and landing\n- R-001 [PM:pm-main-flow] The Launcher shows an \"AI Mini Drama\" shortcut (small shortcuts, 4th) that opens AI Mini Drama.\n- R-002 [PM:pm-0930-updates] The Launcher hero banner \"AI Mini Drama with Seedance 2.0 >\" opens AI Mini Drama.\n- R-003 [DS:ds-home-custom-chat] The landing page shows \"Hi, I'm your AI Drama Assistant\", \"Describe your idea and watch it come to life as a short drama.\", a \"Create Your Drama\" button, \"Start from a template\" with \"More\", and a template grid; the header has back, credit pill and History.\n- R-004 [PM:pm-main-flow] \"More\" is hidden when there are fewer than 6 templates.\n- R-005 [PM:pm-top-mockups][DS:ds-mx-link] The credit pill shows the current credit balance.\n\n## Templates\n- R-006 [DS:ds-template-detail] \"More\" opens the all-categories page: categories with icon and name (Office Romance, Fantasy World, Urban Romance, Family & Life, Animated Stories), each a row of template covers with names.\n- R-007 [DS:ds-template-detail] Tapping a template opens its detail page: the template video plays automatically with sound, and a \"Make my version\" button is shown.\n- R-008 [DS:ds-template-detail] Tapping the playing template video pauses it (pause & volume off state).\n- R-009 [PM:pm-main-flow] \"Make my version\" starts a chat for that template and asks the format question before generating the outline.\n- R-010 [DS:ds-template-detail] Template names are spelled correctly (e.g. \"Six Things You Didn't Know\"). — Open question Q-1.\n\n## Idea input (composer)\n- R-011 [PM:pm-main-flow] \"Create Your Drama\" opens an empty chat with the input placeholder \"Enter your idea to create drama\" and a mic button.\n- R-012 [PM:pm-main-flow][DS:ds-home-custom-chat] Before typing, the composer shows \"Surprise me\" and two inspiration chips from CMS.\n- R-013 [PM:pm-main-flow] Tapping an inspiration chip puts its text into the input.\n- R-014 [PM:pm-main-flow] \"Surprise me\" puts a random inspiration (from a pool of 10) into the input; tapping it again appends to the existing text instead of replacing it.\n- R-015 [PM:pm-update-3] The idea input accepts at most 1,000 characters: at the limit the counter shows red \"1000/1000\", further typing is ignored, pasted text beyond the limit is cut, and \"You've reached the 1,000-character limit.\" is shown; deleting below 1,000 removes the red counter and the message. (Older DS frame: toast \"You've reached the maximum length\" — Q-2.)\n- R-016 [DS:ds-home-custom-chat] After the keyboard closes, a long input collapses to at most 3 lines.\n- R-017 [PM:pm-top-mockups] Once the chat has content, a \"More ideas +\" chip shows above the input.\n\n## Format card\n- R-018 [PM:pm-0930-updates] After the first idea is sent the assistant asks \"What format would you like for your video?\" with 1. Video language (English, Spanish, French, German, Japanese, Korean, Chinese) and 2. Captions (\"Yes, include captions\" / \"No captions\"), single choice per group, and a Continue/Generate button; no aspect-ratio question.\n- R-019 [PM:pm-1002-update] After the button the card is replaced by a user bubble \"1. Video language: \u003cx> / 2. Captions: \u003cYes|No>\".\n\n## Story outline\n- R-020 [PM:pm-0930-updates] While the outline is generated the chat shows status text (\"I'll create a story outline - give me a moment...\" / \"Writing your story...\").\n- R-021 [PM:pm-main-flow] The outline result is a \"Story Outline & Characters Result\" card: Story Outline text plus \"Possible Characters:\" with a description per character and a character slot row.\n- R-022 [PM:pm-update-4] Back / New Chat / History before the outline exists shows \"Leave this chat? / Your story outline isn't ready yet, so this chat won't be saved.\" with Leave anyway / Stay.\n- R-023 [PM:pm-update-4] Stay keeps the user in the chat and the outline keeps generating.\n- R-024 [PM:pm-update-4] Leave anyway stops generation; the chat is not saved and does not appear in History.\n- R-025 [PM:pm-update-4] Leaving after the outline exists saves the chat to History without a dialog; reopening it returns to the latest step.\n- R-026 [DS:ds-extra][PM:pm-0930-updates] Outline 5xxx failure shows the assistant message \"Something went wrong on my end. Let's try that again.\" with Try again, which resends the original idea and format.\n- R-027 [DS:ds-extra][PM:pm-0930-updates] Outline 4xxx failure shows \"I couldn't write a story from this idea. It may not meet our terms of service. Try describing it a different way.\" with no button; the next idea reuses the chosen format without showing the format card again.\n- R-028 [PM:pm-update-5][DS:ds-extra] Sending an idea or tapping an action button while offline shows \"You're offline. Check your connection and try again.\" — nothing is sent and nothing is charged; the card stays (Try again for a sent idea).\n\n## Characters (choose)\n- R-029 [PM:pm-main-flow] Tapping a character slot opens \"Change Characters\" with the cast tabs, \"Character Library\" (Create my character tile, library cards with \"My character\" tags) and a filter.\n- R-030 [PM:pm-1002-update] After a character is set, a hint \"Tap to choose a look for {name}\" points to the next unset slot (right first, then the leftmost); it disappears when any slot is tapped or after 5 s, and never shows once all are set.\n- R-031 [PM:pm-main-flow] The filter offers My characters only, Gender, Ethnicity and Age; applied filters show as removable chips.\n- R-032 [PM:pm-main-flow] Leaving the picker with unsaved picks asks \"Discard character changes? / The characters you picked here won't be saved if you leave.\" Discard / Keep Editing.\n- R-033 [PM:pm-main-flow] Confirming with unset characters shows \"{n} characters aren't set yet / They need a look before you can continue.\" (singular \"1 character isn't set yet / It needs a look…\") with \"Generate with AI ◆6×n\" and \"Choose myself\". — Changed 2026-11-06 (REQ-103): 「Generate with AI」 / 「Generate all」 costs ◆4 per character (◆4×n): its image at 3 credits (Text to image, form 22632766997) plus its voice sample at 1 (TTS, form 22833510933); ◆6 is the PM / Design mock.\n- R-034 [PM:pm-main-flow] \"Generate with AI\" shows \"Generating...\" then \"Your character is all set!\" / \"{n} characters are all set!\" with Confirm.\n- R-035 [PM:pm-update-3] When some characters fail, successful ones are applied, failed slots show \"!\" and are refunded, and \"Couldn't create some images / {n} characters couldn't be created. Your credits have been refunded. Tap a character to try again.\" is shown.\n- R-036 [PM:pm-error-handling] A single character failure shows \"Couldn't create image / We couldn't create this character. Your credits have been refunded. Try again.\" with Got it, which returns to Change Characters.\n- R-037 [PM:pm-top-mockups] With every character set, the assistant says \"The characters look great! Ready to create the storyboard?\" with a Create storyboard card (price + Generate).\n- R-038 [PM:pm-update-7] When the user changes the story or a character in chat, Iris re-issues the \"Story Outline & Characters\" card; a character change adds \"Got it! I've updated the story. I can't redraw characters yet - tap the switch icon on a character to change its look.\", blue text \"Character looks aren't updated automatically. Tap the switch icon to change a character's look.\" and \"Switch any looks you'd like, then create the storyboard.\" — Changed 2026-10-22 (REQ-026): a clear request shows the priced Update characters card instead (see R-254).\n- R-039 [PM:pm-update-7] Older outline cards stay but lose their switch icons; only the newest Create storyboard card is shown. — Changed 2026-10-22 (REQ-026): older cards keep their old images (PM 10/20 §13.2 ③).\n\n## Make your character\n- R-040 [PM:pm-main-flow] \"Create my character\" opens \"Make your character\": \"Create front, side, and back views of your character for consistent results.\", description field with counter 0/1000 and Clear, Gender* (Female/Male/Others), Ethnicity*, Age* (0–100), \"Upload 1 reference photo\", Generate ◆7. — Changed 2026-10-29 (REQ-059): Generate ◆6 (the charging sheet's original price per character image, with or without a reference photo). — Changed 2026-11-06 (REQ-103): Generate ◆4: the character image at 3 credits (Text to image, form 22632766997, with or without a reference photo) plus its voice sample at 1 (TTS, form 22833510933, 1 credit per 1000 characters); the charging sheet's ◆6 no longer applies.\n- R-041 [PM:pm-main-flow] Either a description or a reference photo is enough to generate.\n- R-042 [PM:pm-main-flow] Gender, Ethnicity and Age are required; Generate stays disabled until they are set.\n- R-043 [PM:pm-update-3] The description accepts at most 1,000 characters with the same red counter and \"You've reached the 1,000-character limit.\" behaviour as R-015. — Changed 2026-10-22 (REQ-028): over-limit text is kept and Generate disabled (see R-255).\n- R-044 [PM:pm-main-flow] A reference photo with several people warns \"More than one person detected / For the best result, use a photo with just one person.\" with Generate anyway / Use another photo (not blocking).\n- R-045 [PM:pm-main-flow] A reference photo with no person warns \"No person detected / Results may not turn out well. Want to try anyway?\".\n- R-046 [PM:pm-main-flow] A celebrity photo is blocked: \"This photo can't be used / It looks like a real public figure. Please try another photo.\"\n- R-047 [PM:pm-main-flow] 10/13: X with any input asks \"Discard this character? / What you've entered won't be saved.\" Discard / Keep editing; X with nothing entered closes directly.\n- R-048 [PM:pm-main-flow] A generated character is saved to the library (\"My character\") whether the user confirms or closes with X. — Replaced 2026-10-22 (REQ-032): PM 10/21 §13.23 (R-248, R-293), only Save to library saves; the annotation trace found the old text still here. NOT TESTABLE: replaced\n- R-049 [PM:pm-main-flow] A user character card's menu offers Delete (\"Delete this character? / This character will be permanently deleted and can't be recovered.\" Cancel / Delete) and Report; CyberLink stock characters have no Delete.\n\n## Storyboard\n- R-050 [PM:pm-main-flow] Create storyboard → \"Thinking...\" while priced, then generation; price = images (2 credits each) + TTS for the animatic. — Changed 2026-10-29 (REQ-059): 6 credits per scene image (charging sheet) plus TTS. — Changed 2026-11-06 (REQ-103): 3 credits per image, Location and scene images alike (Text to image, form 22632766997), plus the Storyboard Preview narration as Text to Speech at 1 credit per 1000 characters (form 22833510933; its action id: Q-A25); e.g. 6 scenes with 6 Locations = 12 × 3 + 1 = ◆37 (Android 16.8.0.2611041, 2026-11-05).\n- R-051 [PM:pm-1002-update] Leaving while the storyboard (or a character) is generating asks \"Stop and lose your credits? / This is still generating. If you leave now, it'll stop and the credits you've spent won't be refunded.\" Leave anyway / Keep Generating. Leaving during \"Thinking...\" (pricing) shows no dialog. — Changed 2026-10-27: for the storyboard the 「Stop and lose your credits?」 dialog is void (PM 10/22 §13.24): stage ① asks 「Leave while we're preparing?」 (R-318), stage ② shows a toast (R-321); characters keep this dialog.\n- R-052 [PM:pm-0930-updates] After leaving a storyboard generation (or the app being killed), reopening from History stops at the storyboard offer; Generate re-prices and charges again. — NOT TESTABLE: replaced 2026-10-27 by R-319 (PM 10/22 §13.24: an interrupted stage ① restarts by itself, charged once).\n- R-053 [DS:ds-storyboard] A finished storyboard shows \"Here's your storyboard\", a Storyboard Result card (scene cards with 9:16 thumbnails, View more >) and a Storyboard Preview card.\n- R-054 [DS:ds-storyboard] View more / a scene card opens the scene detail: X, \"Scene N\", ‹ › to move between scenes, main image, Location row, title and full script.\n- R-055 [PM:pm-update-6] The Location row sits under the main image (thumbnail 32×57, label \"Location\"); it cannot be tapped, enlarged or regenerated alone.\n- R-056 [PM:pm-update-6][DS:ds-storyboard] A 4xx scene-image failure shows \"Couldn't create image ⓘ / Your credits have been refunded. Try editing the description for a different result.\" with Edit; ⓘ opens \"Couldn't generate this image / Your credits have been refunded. This description may not meet our terms of service, such as violence, NSFW content, or content involving minors. Edit it below and try again.\" with Got it and a terms-of-service link.\n- R-057 [PM:pm-update-6] A 5xx scene-image failure shows \"Couldn't create image / Your credits have been refunded. The service is busy - try again later.\" with no ⓘ.\n- R-058 [PM:pm-update-5] Failed scene thumbnails in the Storyboard Result show only the ⟳ icon (no \"Regenerate\" text).\n- R-059 [DS:ds-storyboard] Edit opens the description editor (counter x/1000, Done) and Regenerate Image ◆6; when the location and the scene both failed it notes \"The location and scene image will both be regenerated (2 images).\" and charges ◆12. — Changed 2026-11-06 (REQ-103): Regenerate Image costs 3 credits per image (form 22632766997): ◆3 for the scene image, ◆6 when the Location is regenerated too; ◆6 / ◆12 are the Design mock.\n- R-060 [PM:pm-1002-update] While a scene image regenerates the image area shows a skeleton; the scene keeps its old content until done.\n- R-061 [PM:pm-update-3] Asking Iris in chat to change storyboard images first returns an \"Update storyboard images\" action card (price, Generate); 2 credits per image. — Changed 2026-10-29 (REQ-059): 6 credits per image (the sheet's price for first generation and regenerate alike). — Changed 2026-11-06 (REQ-103): 3 credits per image redrawn (form 22632766997), plus 1 credit of Text to Speech when the e PM 10/16 charged character change in chat (Update characters card → \"Here's your updated cast.\").\n- Q-17 Decided 2026-10-22 (user): the PM 10/20 §13.2 ③ rule applies — new results come as a new message and earlier cards are not updated.\n- Q-18 PM main flow note 「day 1 只有 US & JP」 beside the template grid: are templates limited to the US and JP stores on day 1? Affects R-289 and the template rows (REQ-032).\n- Q-19 「More ideas +」 above the composer: no Design frame, arrow or PM note says what a tap shows (more inspiration chips, a filled input, a new suggestion message?). TC-019 records what appears (R-338, REQ-039).\n- Q-A20 (PM 11/4 §13.2 ② vs 10/22 frame 4422:2) Tapping Generate now sends the card's Answer as a pinned user message, but the 10/22 note on 4422:2 still says the video settings card turns into the 「Advancing the mini drama production.」 skeleton in place (its mockup draws a 「Generate Video / Model … / Length …」 bubble). Does Generate Video also send a user message? Assumption: the card turns into the skeleton in place with no user message, as before. (R-279, R-333; TC-405)\n- Q-A21 (RD to confirm; PM 11/3 board 4982:27069) Can v1 tell moderation (4xxx) failures from server-busy (5xxx) ones? If not, the Fix card uses the generic 「Some scenes couldn't be generated. Edit the description or try again.」. Assumption: the cause-specific copy; the generic copy is accepted if RD says v1 cannot split them. (R-080, R-487, R-488; TC-091, TC-559, TC-560, TC-499)\n- Q-A22 (Design 11/5, two new frames named 「Template」 5756:33097 / 5756:33322) The all-categories page is drawn with 3 covers per row (100 × 165) and with 4 per row (92 wide, placeholder headings), with no note saying which one ships. Assumption: either layout passes; the rows check the categories, icons and covers, not the count per row. (R-006, R-186; TC-006, TC-328)\n- Q-A23 (PM 11/5 §13.26, board 5318:2605) The celebrity block applies to Finish your characters and to changing a character in chat, -id=3142-70055] Failed scene description editor open → Tap the collapse icon → Returns to the regeneration offer with the edited text.\n- R-126 [DS: flow arrow 3142-70056 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=3142-70056] Regeneration offer for a failed scene → Tap 「Regenerate Image」 → The scene shows a skeleton and regenerates; credits are charged once.\n- R-127 [DS: flow arrow 2778-129154 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2778-129154] Template drama with a finished storyboard → Generate the full video and wait → 「Here's your drama.」 shows the completed video with its Edit action.\n- R-128 [DS: flow arrow 2820-115460 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-115460] Finished video in the chat → Tap Play on the video → The scene-video player opens and plays.\n- R-129 [DS: flow arrow 4006-73627 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4006-73627] Scene video regenerating → Leave the scene editor and return to the chat → The existing video stays and the chat shows the scene-update status.\n- R-130 [DS: flow arrow 4006-73628 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4006-73628] Scene video regenerating, user in the chat → Wait for regeneration to finish → The chat replaces the old video with the refreshed one.\n- R-131 [DS: flow arrow 2820-116878 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-116878] Video with a failed scene clip → Tap Edit on the failed clip → The scene-video description editor opens.\n- R-132 [DS: flow arrow 2820-118509 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-118509] Failed scene-video editor open with edited text → Tap the collapse icon → Returns to the regeneration offer with the edited text.\n- R-133 [DS: flow arrow 2820-118510 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-118510] Failed scene-video editor open with edited text → Tap 「Done」 → Returns to the regeneration offer with the edited text.\n- R-134 [DS: flow arrow 2820-116880 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-116880] Regeneration offer for a failed clip → Submit the regeneration → Clip generation starts for that scene.\n- R-135 [DS:ds-video] Video result with failed scenes → Tap 「Fix scenes」 → The failed scene-video recovery view opens.\n- R-136 [DS: flow arrow 4078-177645 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4078-177645] Caption retry in progress (「Adding captions…」) → Wait for it to succeed → The captioned video replaces it and 「Captions couldn't be added」 disappears.\n- R-137 [DS: flow arrow 2831-134024 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2831-134024] A regeneration offer with a balance below its price → Tap the credit action → The top-up panel opens.\n- R-138 [Rule 2: Stop notice] Stopping any running stage tells the user what stops and whether spent credits are lost, before or as it stops. — Changed 2026-10-29 (PM Figma 10/22 §13.24; REQ-052): the storyboard, the video, a storyboard update in chat and a video regeneration have no Stop in the chat (R-315); this rule holds for the jobs that keep one (outline, characters, chat revision; Q-A7). — Changed 2026-11-05 (REQ-094): PM 11/4 §13.24 addition (4422:2, comment #246): replies that cost nothing (Iris's normal replies, outline generation, storyboard pricing) stop with ■ and keep what was shown, with no charge (R-486); this notice rule holds for the charged jobs that keep a Stop.\n- R-139 [Rule 2: leave and return] Leaving AI Mini Drama and returning at any stage shows the same task in a recognizable, usable state; nothing saved is lost without notice.\n- R-140 [Rule 2: wait thresholds (user, 2026-10-15)] A wait with no useful action other than leaving lasts at most 5 s without a waiting animation and at most 10 s with one.\n- R-141 [Rule 3: regression list; Req: REQ-012, REQ-043] Android: every open or resolved-not-closed AI Mini Drama Android eBug (eCL pull 2026-10-27, tickets/) is rechecked each run; iOS tickets are not (REQ-043), and a ticket the spec contradicts is kept in the Notes of the row that checks the spec. Each is rechecked each run; its Expect Result is the expected behavior unless the Design spec differs.\n- R-142 [MX ① Free chat times, PDRM MX.pdf version A] Each tier has a remote-configured daily chat allowance (Free 10, Pro 30, Pro+ 100); opening a template, sending a typed message and tapping a task button each use one chat; the send after the allowance shows that tier's limit dialog. Android: Free 10 and Pro 100 (MX names no 30-chat tier for Android; Q-A2).\n- R-143 [MX ① Free chat times, PDRM MX.pdf version A] At the limit: closing the dialog keeps the chat and the unsent text; every further send shows the dialog again; opening a template enters the chat first, then shows the dialog.\n- R-144 [MX ① Free chat times, PDRM MX.pdf version A] Subscribing from the limit dialog returns to the original chat with a Continue message; unused free chats are dropped and only the new tier's allowance applies.\n- R-145 [MX ① Free chat times, PDRM MX.pdf version A] The chat count is kept on the device; deleting and reinstalling the app restores the free chats.\n- R-146 [MX ② Charging flow, PDRM MX.pdf version A] When credits are short, a Paid user's card offers Buy Credit (Credit Panel opens on the 2000-credit pack) and a Free user's card offers Upgrade Now (subscription page); after buying, the charge is confirmed again; a card shown while short switches to the enough-credits copy when the user returns with enough credits.\n- R-147 [MX ② First-time credit discount, PDRM MX.pdf version A] Only a Free user who subscribes during an AI Mini Drama session gets the credit discount, on that session's action ids, once per lifetime; a new session, a resubscription and any regenerate after one discounted drama are charged at full price; Paid users never get it. — 2026-10-29 (REQ-059): the discount price is held until the user says the promotion applies; every row expects the original price. — Changed 2026-11-06 (REQ-103): the full (original) price is the Credit System forms' price (R-040, R-050, R-069); the forms name no discount price or discount action id, so the discount stays held.\n- R-148 [Rule 6: complete template catalog (user, 2026-10-15 and 2026-10-19)] Every template in the frozen roster opens, shows its preview and Make my version, and completes its own journey to a playable final video.\n- R-149 [Rule 7: text quality] Every product-authored text on every page and state is free of spelling, grammar and punctuation errors in ENU, CHT and JPN. Android: the app language is set through the phone's system language (Settings › System › Languages; Android 12 has no per-app language).\n- R-150 [Rule 7: generated text] Generated storyboard text uses the requested language, has no empty fields, unintended repetition or garbled characters, and English output uses English quote marks.\n- R-151 [Rule 8: colleague G01 custom media] The custom-character reference preview shows the selected photo, allowing for an explicit crop.\n- R-152 [Rule 8: colleague O01 required fields] Each required character field omitted on its own blocks Generate; the feedback shown is recorded per field.\n- R-153 [Rule 8: keyboard and layout] Entered text never overlaps adjacent controls, and editing can be finished and the task continued with the keyboard open or closed.\n- R-154 [Rule 8: data-driven facets] Filter values match the attributes present in the character collection, including Southeast Asian and Mixed, and an empty result is shown clearly.\n- R-155 [Rule 8: output reuse] A character created and saved in one drama can be found and applied in a later drama.\n\n## Added 2026-10-21 — coverage passes and standing inputs\nSkill sections \"Coverage passes\", \"Standing inputs\" and \"Value check\" (user approved 2026-10-21, REQ-018).\n\n### Job states\n- R-156 [PM:pm-update-6] When only the main scene image failed, Edit/Retry regenerates only the main image, reuses the Location image and charges one image.\n- R-157 [PM:pm-update-3 J5] A chat image update that partly fails keeps the successful images; failed ones are refunded and marked 「!」 with 「1 image couldn't be updated. Your credits have been refunded. Tap Edit to try again, or tell me what to change.」 and Edit.\n- R-158 [PM:pm-update-3 J4] Leaving while a chat image update is generating shows 「Stop and lose your credits?」 (short task, no refund). — Changed 2026-10-27: PM 10/22 §13.24 names the chat storyboard update among the two-stage jobs: stage ① asks 「Leave while we're preparing?」 (R-318), stage ② shows a toast (R-321).\n- R-159 [DS:ds-storyboard 1012 update] When the whole storyboard fails: 「Something went wrong on my end.」 and 「ⓘ Storyboard couldn't be created. Try creating your storyboard again.」 with Try again.\n- R-160 [PM:pm-1002-update §13.8] A failed video regeneration keeps the old version and uses the chat partial-failure copy.\n- R-161 [PM:pm-1002-update §13.8] 「Your video has been updated.」 disappears after the video is played or the chat is left.\n- R-162 [PM:pm-update-5 §13.13] If the caption retry fails again, the error and Try again return; the video still has no captions.\n- R-163 [PM:pm-error-handling] A storyboard STT failure shows 「ⓘ Storyboard preview unavailable. Try again to generate the preview.」 with Retry.\n- R-164 [PM:pm-update-5 §5 (10/6)] Tapping an action card button with no network shows the toast 「You're offline. Check your connection and try again.」; nothing is sent or charged and the card stays.\n- R-165 [PM:pm-0930-updates §5] If the network drops while a generation runs, it resumes by itself after the network returns; the format card is not shown again. — Changed 2026-10-22 (REQ-032): PM 10/6 (pm-update-5) is newer than §5 of 09/30: the chat shows Try again instead of resuming by itself.\n- R-166 [PM:pm-0930-updates §3.2] Leaving while the storyboard price is calculated (「Thinking…」) shows no dialog.\n- R-167 [PM:pm-0930-updates] On the first 「Yes, create video」 the pre-prompt offers Notify me (then the system notification permission dialog: Android 13 and later) and Not now (never shown again).\n- R-168 [PM:pm-update-5 #4 (10/8)] The in-app toast and the push come once, only when the whole video is done; a partial or total failure, or a 6xxx auto-retry in progress, sends none.\n- R-169 [PM:pm-0930-updates §6.2] The task-completed toast offers Close (keeps the current page) and View (opens History).\n- R-170 [PM:pm-0930-updates §6.3] In the background a finished video sends one push 「Your drama is ready」/「\"{Drama title}\" is done. Tap to watch it.」; tapping it opens that chat at the video card.\n- R-171 [PM:pm-update-4 Bug 0016 §6.4] After a rename, the History card, the toast and the push use the new name.\n- R-172 [PM:pm-1002-update §13.1] The 「Tap to choose a look for {name}」 hint disappears when any slot is tapped and is not shown once every character is set.\n\n### Persistence\n- R-173 [PM:pm-1002-update §13.2] Returning from Full Edit keeps the chat position the user left. — Changed 2026-10-22 (REQ-032): PM 10/20 §13.2 ① — the chat opens at the bottom (newest message).\n- R-177 [PM:pm-update-4 Bug 0014] The History name is the drama title and follows title changes; a user Rename wins over later title changes.\n- R-178 [DS:ds-recent-task] The History thumbnail is the first storyboard frame once a storyboard exists; before that, the default thumbnail.\n- R-179 [DS:ds-video] After the full video, 「Ready for the next episode?」 offers 「Create Next Episode」, which starts the next episode of this drama.\n- R-180 [Req: REQ-011] After the user stops a generation, the story can be continued from the last saved stage in the same chat.\n\n### Fields\n- R-174 [PM:pm-update-3 §13.11; DS:ds-storyboard, ds-video (967/1000)] The 1,000-character limit applies to every description input, including the scene image and scene video descriptions: red 「1000/1000」, extra input ignored, pasted text cut, 「You've reached the 1,000-character limit.」; deleting below 1,000 clears both.\n- R-175 [PM:pm-error-handling; DS:ds-video] The scene-video description is plain editable text in sections 「Cinematic Style」, 「Scene」, 「Motion」, 「Camera」 (headings kept, one paragraph each) with the regenerate button priced by the model used.\n- R-176 [PM:pm-main-flow] A character takes one reference photo; choosing another replaces it.\n\n### MX\n- R-181 [MX:mx-b-mid (version A)] A user's first AI Mini Drama use grants feature free-use credits once (1,000, TBD in MX), spendable only on its character, storyboard and video generation; own credits are charged after they run out.\n- R-182 [MX:mx-b-mid (version A)] During first-time free use the generation model is fixed (images ChatGPT-2, video Seedance 2.0 1080p, TBD) and cannot be chosen.\n\n### Requests\n- R-183 [Req: REQ-001] Normal button sequences during a chat reply never crash or restart the app.\n- R-184 [Req: REQ-003] Selecting a built-in character template leaves the other template thumbnails steady.\n- R-185 [Req: REQ-007] The History info bubble points at the ⓘ button and stays fully on screen.\n- R-186 [Req: REQ-008; DS:ds-template-detail] Each template category header shows its own icon as in Design.\n\n### Build checks\n- R-187 [Build: TR261006-0055 RD Note (189463); Req: REQ-021] Asking to regenerate a fully set cast shows a priced Create characters offer that completes. — NOT TESTABLE: iOS build note (REQ-021 is iOS only; the Android TR's RD note replaces it, standing input 3)\n- R-188 [Build: TR261006-0055 RD Note (189463); Req: REQ-021] A caption failure no longer marks scene details or blocks scene-video playback. — NOT TESTABLE: iOS build note (REQ-021 is iOS only; the Android TR's RD note replaces it, stand 10-29 (PM Figma 10/22 §13.24, frame 4422:2; REQ-052, iOS parity): stage ② only; system back in stage ① asks 「Leave while we're preparing?」 (R-318).\n- R-309 [Req: REQ-022] The Android problem report (PowerDirector 16.8.0, Redmi Note 8 Pro, Android 11) is rechecked as regression leads through the rows listed under \"Request ledger coverage\"; each lead is judged against the spec, not the report.\n- R-311 [PM:pm-main-flow (video settings status); DS:ds-video] While the video generates the chat shows 「I'll create a video - give me a moment...」 and an in-progress state until 「Here's your drama.」 with the video card replaces it. Missed by the iOS analysis (coverage pass 2, the video job's start/loading cell; pass sharpened 2026-10-27). Changed 2026-10-27: PM 10/22 §13.24 adds the stage cards (R-316, R-320).\n- R-312 [Build: TR261021-0082 RD Note (16.8.0.2610212)] AI Mini Drama after the 2610171 tag: character setup, stop/retry, outline and chat, History and clip previews; create, reopen, continue and delete dramas. Walked by: TC-033, TC-334, TC-063, TC-023, TC-104, TC-404, TC-143.\n- R-313 [Build: TR261021-0082 RD Note (16.8.0.2610212)] The French and Japanese AI Mini Drama UI are fully translated (Japanese: TC-277).\n- R-314 [Build: TR261021-0082 RD Note (16.8.0.2610212)] Seedance 2.5 is supported (Best). Walked by: TC-079.\n\n### Open questions (Android)\n- Q-A1 Android back on the Make your character sheet while it generates: the spec names Android back only for the\n  generated result (PM 10/21 §13.23: like X). Does it act like X / Cancel there (「Stop and lose your credits?」)?\n- Q-A2 Android tiers: MX version A gives the 100-chat dialog to 「Pro+ (and Android Premium)」 and names no 30-chat tier\n  for Android. Is there a Pro (30) tier on Android? (Rows follow the tiers the app's debug tier switch offers.)\n\n## Added 2026-10-27 (2) — PM 10/22 boards found in Figma (REQ-046)\nReading the spec, step 8 (Figma frames newer than the PDF) found two PM boards dated 10/22 that the PM PDF of this set\n(20261021) lacks: 「10/22 update：Storyboard／Video 分兩段，有 Generate 的都不提供暫停」 (§13.24, node 4422:2) and 「10/22\nupdate：Export Full Video 匯出中各元件狀態」 (node 4418:2). Newer than PM 10/21, so they govern (pass 7); RD still has to\nconfirm the charge moment, the automatic restart of stage ① and background completion (PM Open questions #20).\n- R-315 [PM:figma 10/22 §13.24 4422:2; Req: REQ-046] After a Generate (Create storyboard, Generate Video, a storyboard update in chat, a video regeneration) the chat has no pause or stop: the input bar shows no ■ stop, only the mic. — Changed 2026-11-05 (REQ-094): PM 11/4 addition on the same frame: the no-■ rule is for charged jobs only; uncharged replies may pause (R-486).\n- R-316 [PM:figma 10/22 §13.24 4422:2] Video stage ①: after 「I'll create a video - give me a moment...」 the video settings card turns in place into the skeleton card 「Advancing the mini drama production.」; nothing is charged yet.\n- R-317 [PM:figma 10/22 §13.24 4422:2] Storyboard stage ①: after 「I'll create a storyboard - give me a moment...」 the skeleton card 「Preparing your scenes…」 shows; nothing is charged yet.\n- R-318 [PM:figma 10/22 §13.24 4422:2] In stage ① every exit (←, the credit pill, New chat, History, system back) asks 「Leave while we're preparing?」 with the video body 「Your video will start soon. If you leave now, we'll have to prepare it again when you come back.」 or the storyboard body 「Your storyboard will start soon. If you leave now, we'll have to prepare it again when you come back.」 and 「Leave anyway」 (red) / 「Stay」.\n- R-319 [PM:figma 10/22 §13.24 4422:2] After Leave anyway, a swiped-away app or backgrounding in stage ①, returning to the chat restarts stage ① by itself: no second Generate tap and no extra charge.\n- R-320 [PM:figma 10/22 §13.24 4422:2] Stage ② starts when the job is sent out and is charged only then; its card reads 「Making your video…」 / 「Creating your storyboard…」.\n- R-321 [PM:figma 10/22 §13.24 4422: ntrols of PowerDirector's media picker are pressed; system back closes a preview opened from it.\n- R-348 [DS: control K-1ff415 / K-af4631 Storyboard · preview] The full-screen Storyboard Preview player has X, ⏸ (pauses the slideshow; ▶ resumes it), a scrubber and the time 「00:40/01:30」; dragging the scrubber jumps to that point. On Android, system back closes the player like X.\n- R-349 [DS: control K-a28dca Storyboard · AI Mini Drama_storyboard] The main scene image in the scene detail has no tap action in the Design (no arrow, no enlarged frame); like the Location thumbnail (R-055), a tap leaves the scene detail as it is.\n- R-350 [DS: control K-1ed4be Recent Task · Recent Task; 1016_Chat navigation · ④ History → Recent Task] 「New Chat」 at the bottom right of Recent Task (History) opens a new empty chat.\n- R-351 [DS: control K-30a28e main flow · composer (every chat stage)] The mic in the composer (R-011) starts voice input, a dictation into the input; stopping it without speaking adds no text; on first use Android asks for microphone access.\n\nNot in scope (control trace n/a): the Launcher's other controls on 「Launcher_2026_08」 (menu, 「Try Pro+ 7 days for free」, notifications, 「New Project」, 「Video Edit by Chat」, 「Video Enhance」, 「Image to Video」, 「Character Motion Swap」, 「Cinematic Reel Creator」, 「Text to Video」, 「Auto Edit」, 「Auto Captions」, 「Photo Enhance」 and the 「What's Trending」 covers) open other PowerDirector features; the Design draws the Launcher only as AI Mini Drama's entry, which R-001, R-002, R-190 and R-191 test.\n\n### Open questions (2026-10-28)\n- Q-A4 The Design draws Android frames only for the AI Mini Drama home page and Template Detail (Google Pixel 2), so the\n  inventory gave Android 21 control groups against 146 for iOS. Should the iOS phone frames count for Android too? —\n  Answered 2026-10-28 (REQ-050): yes. `scripts/inventory.ts` counts an iPhone frame for Android unless\n  `inventory-overrides.json` keeps the screen to iOS (`ios_only_screens`: none needed, no screen of this set is\n  Apple-only); `control-trace.json` now traces all 146 groups with Android rows.\n\n## Added 2026-10-28 (2) — Android system Back on every screen (REQ-051)\nCoverage pass 8, 「Android system Back」: system Back is an exit of every page, sheet, dialog, popup, picker, editor and\nfull-screen viewer the feature opens, not only of the chat. The spec states it for the chat (R-306 – R-308, R-318, R-321;\nExit × stage), the generated character (R-248) and the export (R-323); everywhere else system Back does what the screen's\nown way out does (R-352 – R-355), and where the spec gives none the row records what it does (R-356).\n\n- R-352 [Req: REQ-051; DS:figma 1016_Chat navigation 4858:34930; PM:figma 10/22 export 4418:2] On Android, system Back on an AI Mini Drama page or full-screen viewer does what the page's own back control (← / ‹ / X) does: the landing page returns to the Launcher; the All-categories page and Template detail return to the page they were opened from (the template video stops); the scene detail, the Storyboard Preview player, the video result page, the Fix scenes view and Full Edit close back to the chat or result page; History, My Credits and the pages opened from them go back one page; the feedback, purchase and subscription pages close without sending, buying or subscribing. The chat itself follows R-306 – R-308, R-318 and R-321 (Exit × stage).\n- R-353 [Req: REQ-051; PM:pm-update-11 §13.23 (Android back on the character result)] On Android, system Back on a sheet, picker or editor does what its X / Cancel / ‹ / collapse does: where X asks first (Choose Character with an unsaved pick, Make your character with input or generating, Finish your characters generating, the generated character, a scene image regenerating) it opens the same dialog; otherwise it closes the sheet (Choose Character, the Filter panel, Finish your characters, the empty Make your character, Select Media, Crop, the enlarged character preview, the credit panel) without applying anything, and a full-screen description editor closes like its collapse icon, keeping the text. A layer opened inside a sheet (album list, photo preview, picker options, camera, report flow, menu) closes alone.\n- R-354 [Req: REQ-051] On Android, while the keyboard or the Age keypad is open, the first system Back closes only the keyboard or keypad: the text stays and the screen stays open (chat composer, character description, full-screen editors, scene and scene-video descriptions, Rename).\n- R-355 [Req: REQ-051] On Android, system Back on a dialog, menu or popup closes it like its non-destructive answer, never the destructive one: 「Leave this chat?」 and 「Leave while we're preparing?」 → Stay; 「Stop and lose your credits?」 → Keep Generating; 「Leave without finishing?」 → Keep choosing; 「Discard this character?」 → Keep editing / Keep; delete dialogs → Cancel; failure and ⓘ dialogs → Got it; the timeout dialog → Close; the chat limit dialogs → X / Continue Tomorrow; Manage mode → Cancel; the ⋮ / ⋯ menus close without choosing. The spec states no Back rule for dialogs (Q-A5).\n- R-356 [Req: REQ-051] Where the spec draws no close control and no Back rule (the History ⓘ bubble, the Finish your characters ⓘ tip, a typed but unconfirmed Age, the notification pre-prompt, the export sheet and done page the Android build shows), the row records what system Back does; it must not lose saved work or start a charge, a purchase or a permission request (Q-A6).\n\n### System back\nOne line per screen (`inventory.json` screens and panels, plus the pages the PM spec names). Rows = the rows that press\nsystem Back there; n/a with the reason.\n\n| Screen | Own way out (spec) | System back must | Rows |\n|---|---|---|---|\n| Launcher (PowerDirector Home) | — | — | n/a (PowerDirector's Launcher, only the entry to the feature (R-001); not an AI Mini Drama screen) |\n| AI Mini Drama landing page | header ← (R-003) | like ←: back to the Launc rd/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2 (11/4 addition, comment #246); Req: REQ-094] AI replies that cost nothing — Iris's normal replies, the outline generation, the storyboard pricing (「Thinking...」) — show ■ and can be stopped: the reply stops, what was already shown stays, nothing is charged. Charged jobs cannot be paused (R-315).\n- R-487 [PM:figma 11/3 Fix these issues card 4982:27069 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4982-27069; DS:figma video 2820:113981 (moderation body); Req: REQ-094] The Fix card's body names the cause: moderation only 「Their descriptions may not meet our terms of service, such as violence, NSFW content, or content involving minors.」; server busy only 「Our servers were busy. Try generating them again.」; both kinds, two lines with their own counts 「{a} scenes may not meet our terms of service, such as violence, NSFW content, or content involving minors. Edit their descriptions.」 / 「{b} scenes failed because our servers were busy. Try them again.」; a count of 1 uses scene / its description / it. RD to confirm v1 can tell 4xxx from 5xxx (Q-A21).\n- R-488 [PM:figma 11/3 Fix these issues card 4982:27069 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4982-27069; Req: REQ-094] In the Fix card 「terms of service」 is underlined and opens the terms page (as the 4xxx dialog); after 「Fix scenes」 the scene list marks each failure's cause (moderation → edit the description, server busy → Retry).\n- R-489 [PM:figma 10/29 Regenerate Clip one at a time 4784:70878 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4784-70878 §13.25; Req: REQ-094] Only one clip regenerates at a time: while one runs, every other scene's 「Regenerate Clip」 (scene edit page, Fix Scene › Edit) shows at 40 % opacity but stays tappable; a tap shows the toast 「Another clip is regenerating. Try again when it's done.」, sends noth
