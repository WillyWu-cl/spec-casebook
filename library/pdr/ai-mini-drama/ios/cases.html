d by the new Location and scene images side by side; the 「Couldn't create image」 card and 「Edit」 are gone and the title and full script stay.\n- R-307 [DS: flow arrow 4877-33081 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33081] Leave dialog opened by History, 「Leave anyway」 → Recent Task: the chat closes and Recent Task (the History list) opens.\n- R-308 [DS: flow arrow 4877-33083 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33083] Leave dialog opened by New chat, 「Leave anyway」 → new empty chat: the chat closes and a new empty chat opens (「Hi, I'm your AI Drama Assistant」, 「Surprise me」, idea suggestions, empty composer).\n- R-309 [DS: flow arrow 4877-33087 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33087] Leave dialog opened by Back, 「Leave anyway」 → AI Mini Drama home page: the chat closes and the AI Mini Drama home page opens (「Hi, I'm your AI Drama Assistant」, 「Create Your Drama」, 「Start from a template」).\n\n### Flow arrows walked by existing rows\n- R-310 [DS: flow arrow 4299-132149 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4299-132149] Failed scene detail, ⓘ on the 「Couldn't create image」 card → 4xx dialog: ⓘ opens 「Couldn't generate this image」 with the refund and terms-of-service text and 「Got it」 (5xx cards have no ⓘ, R-057). Walked by: TC-067.\n- R-311 [DS: flow arrow 4299-168955 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4299-168955] Failed scene detail, 「Edit」 on the error card → description editor: the full description becomes editable with the keyboard up, a x/1000 counter, a trash icon and 「Done」. Walked by: TC-070.\n- R-312 [DS: flow arrow 4877-33073 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33073] Chat, Back → leave dialog: while the outline generates, Back opens 「Leave this chat?」 with 「Leave anyway」 / 「Stay」 (PM 10/21 stage rules, R-261 – R-264). Walked by: TC-025.\n- R-313 [DS: flow arrow 4877-33075 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33075] Chat, credit pill → leave dialog: while the outline generates, the credit pill opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-357.\n- R-314 [DS: flow arrow 4877-33077 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33077] Chat, New chat → leave dialog: while the outline generates, New chat opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-357.\n- R-315 [DS: flow arrow 4877-33079 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33079] Chat, History → leave dialog: while the outline generates, History opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-026.\n- R-316 [DS: flow arrow 4877-33085 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33085] Leave dialog opened by the credit pill, 「Leave anyway」 → My Credits: the chat closes and My Credits opens. Walked by: TC-358.\n- R-317 [DS: flow arrow 4877-33089 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33089] Leave dialog, 「Stay」 → chat: the dialog closes and the chat stays at the same stage; the outline still arrives. Walked by: TC-027, TC-357.\n\n### Controls (REQ-039)\nControls of the Figma inventory that no existing rule described; each is pressed by the row named in `control-trace.json`.\n- R-318 [DS: control K-20ac46 main flow · Storyboard & Preview / Chat (any stage)] 「More ideas +」: the chip above the composer offers more story ideas when tapped (the Design draws the chip on every chat stage but no result frame; Q-19).\n- R-319 [DS: control K-55f3b5 / K-940021 / K-cf0dd5 Template Detail · AI Mini Drama] Template video ▶ and volume icon: ▶ over the paused template video resumes playback (Default_playing & volume on); the volume icon at the video's bottom right switches the sound off and on and shows the current state (ic_volume / ic_volume_off).\n- R-320 [DS: control K-71866f MX · AI Mini Drama_characters] 「Continue Tomorrow」: closes the 「Today's AI Chats Are Used Up」 dialog and returns to the chat without sending the message (the dialog's only action; MX ① version A: closing the limit dialog returns to the chat).\n- R-321 [DS: control K-938d8f / K-b32fbc / K-d1e307 1016_Chat navigation · Credit page_free] My Credits (the credit-pill exit's landing page, R-316): 「Buy More」 opens the credit purchase page; 「Claim」 claims the complimentary daily credits (「Claim once every 24 hours」) and adds them to the balance; 「Subscribe Now」 on the 「Join the Pro+」 card opens the Pro+ subscription page.\n- R-322 [DS: control K-ab333a / C-8157ce Choose Character · credit; MX · storyboard / AI Mini Drama_template] 「Top up your credits」: tapping a credit pack (50 … 2000) selects it for 「Buy Credit」, one pack at a time; 「Terms of Use」 and 「Privacy Policy」 under the button open those pages.\n- R-323 [DS: control K-6b314e / K-d301d1 / K-68cdee / K-cbd30c Choose Character · Character Library (Age keypad)] The Age keypad has an input bar (placeholder 「1-100」) and a ✓ that closes the keypad and fills Age with the typed number; tapping a filled Age field (e.g. 「24」) reopens the keypad to change it.\n- R-324 [DS: control K-3276bb / C-8cec01 Choose Character · Character Library (filtered)] With filters applied the filter icon shows a check mark (ic_filter_check) and still opens the Filter panel; each applied-filter chip (「Female ×」, 「Asian ×」, 「Age: 0-28 ×」) removes that filter when its × is tapped (R-031).\n- R-325 [DS: control K-32eae1 / K-ea3e9d / K-5554e3 / K-910afd Choose Character · Character Library (enlarged preview)] The enlarged character preview has ⓧ at its top right, which closes it back to the library, and ⋯, which opens 「Download」 (saves the character image to the device), 「Report」 (opens the report flow) and, for the user's own character, 「Delete」 (R-049).\n- R-326 [DS: control K-f2a9d2 Choose Character · AI Mini Drama_template; 1005_Chat · Chat_charge failed] The ⟳ switch icon on a character in the Characters Result card opens Change Characters on that character (R-038: 「tap the switch icon on a character to change its look」).\n- R-327 [DS: control C-88ef55 / K-327b3e / K-37e272 / K-aa0c0b / C-14cbaa Choose Character · Add Media] Select Media (reference photo): 「Photo」 is the media type; 「Recents ▾」 opens the album list; the source tabs (getty images | iStock, GIPHY, …) switch to that stock source; the enlarge icon on a photo opens a full-size preview; the sliders icon beside 「Photo」 opens the picker's options; the camera icon opens the camera. The Design draws these controls with no result frame or arrow.\n- R-328 [DS: control K-1ff415 / K-af4631 Storyboard · preview] The full-screen Storyboard Preview player has X, ⏸ (pauses the slideshow; ▶ resumes it), a scrubber and the time 「00:40/01:30」; dragging the scrubber jumps to that point.\n- R-329 [DS: control K-a28dca Storyboard · AI Mini Drama_storyboard] The main scene image in the scene detail has no tap action in the Design (no arrow, no enlarged frame); like the Location thumbnail (R-055), a tap leaves the scene detail as it is.\n- R-330 [DS: control K-1ed4be Recent Task · Recent Task; 1016_Chat navigation · ④ History → Recent Task] 「New Chat」 at the bottom right of Recent Task (History) opens a new empty chat.\n- R-331 [DS: control K-30a28e main flow · composer (every chat stage)] The mic in the composer (R-011) starts voice input, a dictation into the input (DRI261895P0002); stopping it without speaking adds no text.\n\nNot in scope (control trace n/a): the Launcher's other controls on 「Launcher_2026_08」 (menu, 「Try Pro+ 7 days for free」, notifications, 「New Project」, 「Video Edit by Chat」, 「Video Enhance」, 「Image to Video」, 「Character Motion Swap」, 「Cinematic Reel Creator」, 「Text to Video」, 「Auto Edit」, 「Auto Captions」, 「Photo Enhance」 and the 「What's Trending」 covers) open other PowerDirector features; the Design draws the Launcher only as AI Mini Drama's entry, which R-001, R-002, R-190 and R-191 test.\n\n## Added 2026-10-29 — PM Figma 10/22 frames (REQ-052)\nTwo PM Figma frames dated 10/22 (PM file 44RyrcOcWi2MvhGci9bO5F, page 「🆕 Spec with jau proposal」; board-notes 「PM — Figma\nonly, newer than the PM PDF」) are newer than the PM PDF of this set (10/21) and the Design frames, so they win where they\ndiffer (AGENTS.md: newer wins). Changed above: R-051, R-052 (replaced), R-071, R-158, R-249, R-262, R-264. Open: Q-20 – Q-23.\n- R-332 [PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] After Generate on 「Create storyboard」, on 「Generate Video」, on a storyboard update in chat or on a video regeneration, the chat offers no pause or stop: the input shows no ■ stop button, only the mic (the frame notes the current build has the ■ and must drop it). — Changed 2026-11-05 (REQ-094): PM 11/4 addition on the same frame: the no-■ rule is for charged jobs only; uncharged replies may pause (R-486).\n- R-333 [PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] Video phase ①: after 「Generate Video」 the video settings card turns into a skeleton card in place titled 「Advancing the mini drama production.」 while Iris writes the prompt, and nothing is charged yet. Phase ②: the card reads 「Making your video...」 and the video price is charged at that point.\n- R-334 [PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] Storyboard phase ①: after Generate on 「Create storyboard」 the card turns into a skeleton titled 「Preparing your scenes...」, and nothing is charged yet. Phase ②: the card reads 「Creating your storyboard...」 and the storyboard price is charged at that point.\n- R-335 [PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] After 「Leave anyway」 in phase ①, or the app being swiped away or sent to the background in phase ①, returning to the chat restarts phase ① by itself: no second Generate, and the job is charged only once. Applies to the storyboard and the video.\n- R-336 [PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] In phase ②, swiping the app away does not stop the job: the storyboard or the video finishes and is in the chat and History on return.\n- R-337 [PM:figma 10/22 Export Full Video while exporting 4418:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4418-2; Req: REQ-052] While Export Full Video runs, Back stays enabled: leaving the result page lets the export finish in the background, and when it is done the toast 「Saved to Photos.」 shows on whatever page the user is on.\n- R-338 [PM:figma 10/22 Export Full Video while exporting 4418:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4418-2; Req: REQ-052] While Export Full Video runs, the scene thumbnails stay tappable: a tap switches the preview to that scene only and does not affect the export.\n- R-339 [PM:figma 10/22 Export Full Video while exporting 4418:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4418-2; Req: REQ-052] When the export fails, the toast reads 「Couldn't save your video. Try again.」, the spinner goes, every control (Back, Full Edit, Export Full Video, download, play, thumbnails) is restored, and Export Full Video can be pressed again.\n- R-340 [PM:figma 10/22 Export Full Video while exporting 4418:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4418-2; Req: REQ-052] On iOS the first export asks for photo library access; when access is denied the controls are res function md(src){

}

const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];

function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
