.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
.tablewrap{overflow-x:auto}

td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}

.note{font-size:.8rem;color:var(--muted)}

details.qs>summary{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
.qrows{font-size:.8rem;color:var(--muted)} .qrows a{font-family:var(--mono);color:var(--edit);margin-right:6px}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}

a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
</style>

-press and swipe the processing card","Expected Result":"No cancel, stop or delete action is offered for a processing task (v1)","Priority":"P2","Spec Ref":"R-091","Notes":""},{"ID":"TC-118","Section":"Generating and cancel","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine); PowerDirector has never asked for the notification permission; no Video Enhance task created yet on this install","Action":"Tap 「Enhance」 and wait for the upload to finish","Expected Result":"After the upload the dialog 「Turn on notifications」 / 「We'll let you know when it's done.」 appears with 「Turn On」 and 「Later」","Priority":"P2","Spec Ref":"R-093","Notes":"PM-only: no Design frame yet (PM 397:1151). iOS: needs a fresh install (permission never asked), which the QA iPhone cannot do: record Blocked --as test-data."},{"ID":"TC-119","Section":"Generating and cancel","Precondition":"The 「Turn on notifications」 dialog showing (TC-118)","Action":"Tap 「Turn On」","Expected Result":"The iOS permission dialog for notifications appears; after answering it the app stays on the Generating / Recent task screen","Priority":"P3","Spec Ref":"R-094","Notes":"PM D1 [建議] (Gap 6 landing): blocked with TC-118 on iOS."},{"ID":"TC-120","Section":"Generating and cancel","Precondition":"The 「Turn on notifications」 dialog showing (TC-118 setup)","Action":"1. Tap 「Later」\n2. Start a second task and wait for its upload","Expected Result":"Step 1 closes the dialog; step 2 shows no notification prompt","Priority":"P3","Spec Ref":"R-095","Notes":"PM D1 [建議]; blocked with TC-118 on iOS."},{"ID":"TC-121","Section":"Generating and cancel","Precondition":"One task processing in Recent task; enough credits for another","Action":"1. Go back to the panel\n2. Pick another video and tap 「Enhance」","Expected Result":"The second task uploads and Recent task shows two processing cards","Priority":"P3","Spec Ref":"R-092","Notes":"Q-12: the limit is pending (PM proposes 3, 「You can run up to 3 enhancements at a time.」)."},{"ID":"TC-130","Section":"Background task and notifications","Precondition":"A task processing; the user on the Launcher (app in front)","Action":"Wait on the Launcher until the task completes","Expected Result":"A banner shows 「Good news! Your AI Video Enhance task has been completed. Tap here to view your results.」 with 「Close」 and 「View」","Priority":"P1","Spec Ref":"R-100","Notes":""},{"ID":"TC-131","Section":"Background task and notifications","Precondition":"The completion banner showing (TC-130)","Action":"Tap 「View」 on the banner at once","Expected Result":"The Result of that task opens and its video plays (not a black 00:00/00:00 player)","Priority":"P1","Spec Ref":"R-101","Notes":"KP-059 risk (other features): the banner's View was offered before the result downloaded; tap it at once."},{"ID":"TC-132","Section":"Background task and notifications","Precondition":"Another task completes while on the Launcher (banner showing)","Action":"1. Tap 「Close」 on the banner\n2. Open Recent task from the panel","Expected Result":"Step 1 dismisses the banner and nothing opens; in step 2 that task's card is completed with 「View」","Priority":"P2","Spec Ref":"R-102","Notes":""},{"ID":"TC-133","Section":"Background task and notifications","Precondition":"Notifications allowed for PowerDirector; a task processing","Action":"1. Press Home (swipe up)\n2. Wait for the notification\n3. Tap it","Expected Result":"A system notification 「Your video is ready. Tap to view.」 arrives; tapping it opens PowerDirector on that task's Result","Priority":"P2","Spec Ref":"R-103","Notes":"PM-only: no Design frame yet (PM §9 copy, D1 [建議]); Q-16."},{"ID":"TC-134","Section":"Background task and notifications","Precondition":"At least one completed Video Enhance task","Action":"1. Open 「AI Magic」 › 「My Artwork」\n2. Open 「Template」 › 「My Artwork」","Expected Result":"Both list the enhanced video","Priority":"P2","Spec Ref":"R-104","Notes":"PM §4.3 / D2 [建議]: the Design does not draw it yet (PM-only)."},{"ID":"TC-140","Section":"Recent task","Precondition":"Panel open","Action":"Tap the Recent task icon at the top right of the panel","Expected Result":"Recent task opens: title 「AI Video Enhance」, ‹, ⌂, the notice 「Tasks are stored on the cloud for 1 Year. Please download any you want to keep in local storage.」 with 「Manage」, and the task cards","Priority":"P2","Spec Ref":"R-110, R-113","Notes":""},{"ID":"TC-141","Section":"Recent task","Precondition":"Recent task open from the panel, a task processing","Action":"Tap ‹ on Recent task","Expected Result":"The panel is shown again","Priority":"P2","Spec Ref":"R-114","Notes":""},{"ID":"TC-142","Section":"Recent task","Precondition":"Recent task open","Action":"Tap ⌂ on Recent task","Expected Result":"The Launcher opens","Priority":"P2","Spec Ref":"R-115","Notes":""},{"ID":"TC-143","Section":"Recent task","Precondition":"Recent task open with a processing card","Action":"1. Wait on Recent task until the task completes\n2. Tap 「View」 on its card\n3. Tap ‹ on the Result\n4. Tap the completed card's thumbnail","Expected Result":"Step 1 turns the card completed (thumbnail, date, name, 「View」) without leaving the page; step 2 opens the Result; step 3 returns to Recent task; step 4 opens the same Result","Priority":"P1","Spec Ref":"R-112","Notes":"Step 4: PM D2 「Completed (tap → Result)」; the Design draws only 「View」 (Q-22)."},{"ID":"TC-144","Section":"Recent task","Precondition":"Recent task open with a completed task","Action":"Tap 「Manage」","Expected Result":"A page to manage the stored tasks opens (select, download or delete them)","Priority":"P3","Spec Ref":"R-116","Notes":"Q-8: the spec does not say what Manage opens; record what it does."},{"ID":"TC-150","Section":"Result","Precondition":"A completed task's Result open (TC-143)","Action":"1. Tap play\n2. Drag the progress slider","Expected Result":"The page shows ‹, 「Original」 / 「Result」 with 「Result」 selected, the video with the time (「mm:ss/mm:ss」) and 「Save Result」, 「Add to Timeline」, 「Enhance More」; play and the slider move through the result","Priority":"P1","Spec Ref":"R-120","Notes":"PM 「Edit More」 is older (D3 [衝突]: 「Enhance More」)."},{"ID":"TC-151","Section":"Result","Precondition":"Result open","Action":"1. Tap 「Original」\n2. Tap 「Result」","Expected Result":"「Original」 shows the source video, 「Result」 the enhanced one (visibly sharper or cleaner)","Priority":"P2","Spec Ref":"R-121","Notes":""},{"ID":"TC-152","Section":"Result","Precondition":"Result of the TC-110 task open (01:30 1080p 30 fps source; Standard, Natural, 30fps, 1080p)","Action":"1. Tap 「Save Result」\n2. In Photos, swipe up on the saved video to show its info","Expected Result":"The toast 「Saved to your device」 appears within 10 s; the enhanced video is in Photos, 01:30 long, 1920 × 1080 and 30 fps (the values chosen on the panel)","Priority":"P1","Spec Ref":"R-122, R-194","Notes":"Toast copy is PM D3 [建議]. Covers the default values of the setting-value rows TC-219–TC-224 (analysis pass 10)."},{"ID":"TC-219","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 1080p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Tap 「Professional」\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"The CTA price and the per-second line change from the Standard price when 「Professional」 is tapped; after the upload the balance is the noted balance minus that price; 「Result」 shows more detail than 「Original」 (「Maximum detail」); the saved video is 00:05, 1920 × 1080 and 30 fps","Priority":"P1","Spec Ref":"R-194, R-195, R-065, R-060, R-089","Notes":"Setting value Mode=Professional used end to end (analysis pass 10). Q-4: the Professional rate is not in the spec, so only the charge = the shown price is asserted. Needs the 00:05 fixture video and one full generation."},{"ID":"TC-220","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 1080p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Tap 「Sharp」\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"The CTA price does not change when 「Sharp」 is tapped (style does not set the price) and the balance drops by exactly that price; 「Result」 looks sharper and clearer than 「Original」 (「Moderate enhancement for a sharp, clear image」); the saved video is 00:05, 1920 × 1080 and 30 fps","Priority":"P2","Spec Ref":"R-194, R-195, R-062, R-060, R-089","Notes":"Setting value Enhancement style=Sharp used end to end (analysis pass 10); compare with the Natural result of TC-152. Needs the 00:05 fixture video and one full generation."},{"ID":"TC-221","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 1080p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Tap 「60fps」\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"The balance drops by exactly the CTA price shown when 「Enhance」 was tapped; the saved video is 00:05, 1920 × 1080 and 60 fps","Priority":"P2","Spec Ref":"R-194, R-060, R-089","Notes":"Setting value fps=60fps used end to end (analysis pass 10). Q-3: whether the output fps changes the price is open; only the charge = the shown price is asserted. If the chip is disabled (Q-6), record it Blocked --as question. Needs the 00:05 fixture video and one full generation."},{"ID":"TC-222","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 1080p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Tap 「120fps」\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"The balance drops by exactly the CTA price shown when 「Enhance」 was tapped; the saved video is 00:05, 1920 × 1080 and 120 fps","Priority":"P2","Spec Ref":"R-194, R-060, R-089","Notes":"Setting value fps=120fps used end to end (analysis pass 10). Q-3 and Q-6 as in TC-221. Needs the 00:05 fixture video and one full generation."},{"ID":"TC-223","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 720p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Check that 「720p」 is selected (tap it if not)\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"「720p」 is selected; the balance drops by exactly the CTA price shown when 「Enhance」 was tapped; the saved video is 00:05, 1280 × 720 and 30 fps","Priority":"P2","Spec Ref":"R-194, R-044, R-060, R-089","Notes":"Setting value Resolution=720p used end to end (analysis pass 10), from a 720p source so the value is allowed whatever Q-6 decides. Needs the 00:05 720p fixture video and one full generation."},{"ID":"TC-224","Section":"Result","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine) with enough credits; a 00:05 1080p 30 fps landscape video in the album (made for the test); note the balance","Action":"1. Open the panel with the 00:05 video (whole video selected)\n2. Tap 「4K」\n3. Note the CTA price and the 「Charge X credits per second」 line\n4. Tap 「Enhance ◆ \u003ccredits>」\n5. Wait in Recent task until the task completes\n6. Tap 「View」 on its card\n7. Tap 「Original」\n8. Tap 「Result」\n9. Tap 「Save Result」\n10. In Photos, swipe up on the saved video to show its info","Expected Result":"The CTA price and the per-second line change from the 1080p price when 「4K」 is tapped; the balance drops by exactly that price; the saved video is 00:05, 3840 × 2160 and 30 fps","Priority":"P2","Spec Ref":"R-194, R-065, R-060, R-089","Notes":"Setting value Resolution=4K used end to end (analysis pass 10). Q-4: the 4K rate is not in the spec. If 4K is disabled (Q-6), record it Blocked --as question. Needs the 00:05 fixture video and one full generation."},{"ID":"TC-153","Section":"Result","Precondition":"Result of a task started from Add Media open","Action":"Tap 「Add to Timeline」","Expected Result":"A new project opens with the enhanced video on its timeline; no existing project is changed and the source video in the album is unchanged","Priority":"P1","Spec Ref":"R-123, R-126","Notes":""},{"ID":"TC-154","Section":"Result","Precondition":"Result open","Action":"Tap 「Enhance More」","Expected Result":"Add Media opens for the next video","Priority":"P2","Spec Ref":"R-124","Notes":""},{"ID":"TC-155","Section":"Result","Precondition":"Result open from a Recent task card","Action":"Tap ‹ on the Result page","Expected Result":"Recent task is shown again","Priority":"P3","Spec Ref":"R-125","Notes":"Q-9: no arrow; the previous page is the assumption."},{"ID":"TC-160","Section":"Timeline entry","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine); a project with a 05:00 clip; panel opened on it from the clip toolbar","Action":"Tap 「Professional」","Expected Result":"The toast 「Professional supports clips up to 2:30. Shorten your selection to switch.」 appears and the Mode stays Standard","Priority":"P2","Spec Ref":"R-057","Notes":"Q-10: draft B1-1 ⑦ disables the chip with 「Professional mode supports clips up to 2m 30s. Split the clip to use it.」; check on device and decide with the user."},{"ID":"TC-161","Section":"Timeline entry","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine); a project with a 10:00 clip","Action":"1. Tap the clip\n2. Tap 「AI Video Enhance」 in the clip toolbar","Expected Result":"The panel does not open; the toast 「Split clips longer than 8 minutes first」 appears","Priority":"P3","Spec Ref":"R-058","Notes":"PM D4 [建議] / B1-1 ⑦ (Q-10): PM-only."},{"ID":"TC-162","Section":"Timeline entry","Precondition":"Tier Pro+ (Launcher › Pink › ☰ › [0] IAP › status = Pro+, checked in Mine); a project with a 00:30 clip; panel opened on it from the clip toolbar","Action":"1. Tap 「Enhance ◆ \u003ccredits>」\n2. Stay in the editor until the task completes","Expected Result":"The upload dialog and the Recent task flow are those of the main flow; when the task completes the clip on the timeline is replaced by the result (same position) and 「Applied Video Enhance」 is shown","Priority":"P2","Spec Ref":"R-131, R-130","Notes":"PM-only: no Design frame yet (pm-timeline 397:1888; form of the notice TBD, D4 proposes a 3 s toast 「Video Enhance applied」). Q-11: the Design note says results never replace the original clip."},{"ID":"TC-163","Section":"Timeline entry","Precondition":"Panel opened from the clip toolbar, nothing running","Action":"Tap ‹ in the panel's top bar","Expected Result":"The editor is back with the project and the clip unchanged","Priority":"P2","Spec Ref":"R-133","Notes":""},{"ID":"TC-164","Section":"Timeline entry","Precondition":"A Timeline task processing (TC-162 setup)","Action":"1. Delete the clip from the timeline\n2. Wait until the task completes","Expected Result":"Nothing is pasted into the project; the result is in Recent task","Priority":"P3","Spec Ref":"R-132","Notes":"PM D4 [建議] (Gap 10)."},{"ID":"TC-165","Section":"Timeline entry","Precondition":"Result of a task started from the Timeline open","Action":"Tap 「Add to Timeline」","Expected Result":"The original project opens (no new project is made)","Priority":"P3","Spec Ref":"R-134","Notes":"PM D4 [建議]; conflicts with the Design 「Add to Timeline → 開新 timeline」 (Q-11)."},{"ID":"TC-170","Section":"Failure and refund","Precondition":"A Video Enhance task that failed on the server","Action":"Open Recent task","Expected Result":"The failed task's card shows an 「Error」 thumbnail and 「View Details」 (no Retry)","Priority":"P1","Spec Ref":"R-140","Notes":"Parked: needs a failure fixture (no fault switch for Video Enhance is known; ask RD)."},{"ID":"TC-171","Section":"Failure and refund","Precondition":"A failed card in Recent task (TC-170)","Action":"1. Tap 「View Details」\n2. Tap 「OK」","Expected Result":"Step 1 shows 「An Error Has Occurred」 / 「Credits have been refunded.」 / 「The server may be busy. Please try again later or use a different video.」 with 「OK」; step 2 closes it and Recent task stays","Priority":"P1","Spec Ref":"R-141, R-191","Notes":"Parked with TC-170. Walks the Design arrow 3393-18071 (Recent 「View Details」 → the dialog)."},{"ID":"TC-173","Section":"Failure and refund","Precondition":"Balance noted before a task that failed (TC-170)","Action":"Open the credit pill or the Credit page after the failure","Expected Result":"The balance is back to the noted value (the charge was refunded automatically); the ledger shows the refund; nothing offers Retry","Priority":"P1","Spec Ref":"R-142","Notes":"KP-007: a missing or wrong refund is its own defect. Parked with TC-170."},{"ID":"TC-174","Section":"Failure and refund","Precondition":"Notifications allowed; a task processing that will fail; app in the background","Action":"Wait for the notification","Expected Result":"A notification 「Video Enhance didn't finish. Your credits have been refunded.」 arrives","Priority":"P3","Spec Ref":"R-143","Notes":"PM D1 [建議] (Gap 8, Q-16). Parked with TC-170."}],"previous":{},"requirements":"# AI Video Enhance — requirements (ios)\nSpec: Figma only (spec set 2026-11-03, no PDF). Design HceGLJVaxnKsv7gXSXzKWh section 3293:13053 「AI Video Enhance_26.09_v2」\n(boards ds-main-flow 3293:13054, ds-routing 3293:14560, ds-entry-points 3293:14642, ds-alt-exception 3293:15052,\nds-ai-video-enhance 3300:32003, ds-cancel 3396:20438); PM mppB4GYkuVMVvHrdBeSAAU page 309:643 (pm-main-flow,\npm-access-credit, pm-timeline, pm-failure-refund, pm-gaps, pm-defaults) and draft section 405:1108 (pm-draft-logic,\npm-draft-notes) [Req: REQ-001, REQ-002]. Page 0:1 (Denoise / Lighting cloud solution) is superseded (REQ-002).\n\nSource rules used here: the Design outranks the PM; where the two disagree the newer dated item wins (analysis pass 7).\nThe Design carries 「1005_Update」 / 「1005_preview」 labels (10/05), newer than every PM item (9/24, 9/29, 1002), so\nthe Design decides every conflict it draws. PM-only rules become rows with Notes 「PM-only: no Design frame yet」;\nPM [建議] items are proposals (rows at P3, a difference is a PM question, not a defect), [待確認] items are pending\n(Open questions), [衝突] items are settled by the Design where it draws them.\n\nDraft 20261104-100851 reruns the analysis on the same spec set under analysis.md passes 10 (a setting's values are\nvariants: each value used in a generation and checked in the saved file) and 11 (twin and look-alike controls), with\nthe new Design arrow 3393-18071 [Req: REQ-004]. Changed: R-020, R-031, R-033, R-035, R-054; new: R-191 – R-195,\nQ-21, Q-22.\n\n## Entry points\n- R-001 [DS:ds-main-flow Launcher_2026_08; DS:ds-routing 「Launcher / AI Magic → Demo page」] The Launcher big shortcut 「AI Video Enhance」 opens the Demo page (until 「Don’t show again」 was confirmed, R-009).\n- R-002 [DS:ds-entry-points Launcher_AI Magic; DS:ds-routing] The AI Magic tab's 「AI Enhance」 section has an 「AI Video Enhance」 card that opens the Demo page (same rule as R-001).\n- R-003 [DS:ds-entry-points Timeline_default; DS:ds-routing 「直接帶入選取的 clip / Timeline 入口，無 Demo page」; PM:pm-timeline §4.1] In the editor, the clip toolbar tool 「AI Video Enhance」 opens the panel directly with the selected clip: no Demo page and no Add Media. (PM calls the tool 「Enhance」; the Design wins.)\n- R-004 [DS:ds-main-flow 「1005_Update wording: AI Video Enhance」] The feature is named 「AI Video Enhance」 on the Launcher shortcut, the Demo page and the panel title (PM's 「Video Enhance」 is older).\n- R-005 [DS:ds-entry-points Timeline_default] The clip toolbar's 「AI Video Enhance」 tool carries a 「Pro+」 badge.\n\n## Demo page\n- R-006 [DS:ds-main-flow Demo page_Straight video] The Demo page shows a back ‹, the title 「AI Video Enhance」, a sample video, a description, a 「Don’t show again」 checkbox and the button 「Try It Now」.\n- R-007 [DS:ds-main-flow; PM:pm-draft-logic A1 [衝突]] The Demo description describes Video Enhance; the Design text 「AI reframe your video for any aspect ratio, then fine-tune the crop in real time.」 is AI Reframe's copy (Q-1).\n- R-008 [DS:ds-main-flow arrow 3294-24050] 「Try It Now」 opens Add Media.\n- R-009 [DS:ds-routing 「勾 Don't show again 後不再出現」; PM:pm-draft-logic A1 [Design]] After 「Don’t show again」 is ticked and 「Try It Now」 tapped, later entries from the Launcher and AI Magic skip the Demo page and open Add Media.\n- R-010 [PM:pm-draft-logic A1 [建議]] Ticking 「Don’t show again」 and leaving with back (without 「Try It Now」) does not save it: the Demo page appears on the next entry.\n- R-011 [PM:pm-draft-logic A1 [建議]] Back on the Demo page returns to the entry page (Launcher or AI Magic) without opening Add Media.\n\n## Add Media\n- R-012 [DS:ds-main-flow Add Media; PM:pm-draft-logic A2 [Design]] Add Media (title 「Add Media」) shows only the 「Video」 tab and takes one video (v1 single pick).\n- R-013 [DS:ds-main-flow arrow 3293-13715; PM:pm-draft-logic A2 [建議]] Tapping a video thumbnail opens the panel with that video (no Next button).\n- R-014 [DS:ds-main-flow Add Media ‹] The back ‹ on Add Media returns to the page Add Media was opened from (Q-9).\n- R-015 [PM:pm-draft-logic A2 / E1 [建議]] A video the feature cannot take (over 4K, under 1 s, not MP4 / MOV) is greyed in Add Media and tapping it shows the toast 「This video isn't supported. Try one up to 4K.」 (Q-13).\n- R-016 [PM:pm-draft-logic A2 [建議]] With no videos on the device Add Media shows the empty state 「No videos yet」.\n\n## Panel layout and first-run bubble\n- R-020 [DS:ds-main-flow VE · 01 / VE · 02] The panel shows: top bar back ‹, title 「AI Video Enhance」, a credit pill with the balance (「0」 on Free, 「35」 after the purchase) and a Recent task icon; the Preview with play, the time 「00:00/\u003cvideo length>」 and a full-screen icon; 「Selected Length ⓘ」 with the selected length; the thumbnail strip with a left ‹ and a right › trim handle and the playhead (R-192); 「Mode ⓘ」 Standard / Professional; 「Enhancement style ⓘ」 Natural / Sharp; 「fps」 30fps / 60fps / 120fps; 「Resolution」 720p / 1080p / 4K; the CTA; the line 「Charge X credits per second」 under it.\n- R-021 [DS:ds-main-flow 「1005_preview 右下加上影片的來源資訊」] The Preview's lower right shows the source video's frame rate and resolution (「60fps · 1080p」 for a 60 fps 1080p video).\n- R-022 [DS:ds-main-flow 「第一次進入此功能跳出 bubble」; PM:pm-draft-logic B2 [Design]] On the first entry to the panel the bubble 「Max 8 minutes. Drag to choose which part.」 appears by itself at Selected Length; it closes after 3 s or on any tap. (PM's first-run card §10.1 is replaced by this bubble; PM B2's proposed copy loses to the Design copy.)\n- R-023 [PM:pm-main-flow §10.1; PM:pm-draft-logic B2] The automatic bubble appears only on the first entry, never again.\n- R-024 [PM:pm-draft-logic B2 [Design]] The ⓘ next to 「Selected Length」 opens the same bubble again.\n- R-025 [DS:ds-ai-video-enhance Settings › Mode] The ⓘ next to 「Mode」 shows the bubble 「Standard: Great quality · up to 8 min」 / 「Professional: Maximum detail · up to 2:30」 (PM 1002 「Standard: Great quality, quick results」 and PM 9/29 「Standard: up to 8 minutes. Professional: up to 2m 30s.」 are older).\n- R-026 [DS:ds-ai-video-enhance Settings › Enhancement style; PM:pm-defaults] The ⓘ next to 「Enhancement style」 shows the bubble 「Natural: Lighter enhancement with fewer artifacts, for a more realistic look」 / 「Sharp: Moderate enhancement for a sharp, clear image」.\n- R-027 [DS:ds-main-flow VE · 02] The Preview's play button plays the video from the selection and the full-screen icon opens a full-screen preview.\n- R-028 [DS:ds-main-flow arrow 3293-13716] The panel's back ‹ returns to Add Media (from the Timeline entry: R-133).\n\n## Trim and selected length\n- R-030 [DS:ds-ai-video-enhance Default / Length; PM:pm-main-flow 9/29 ①; PM:pm-draft-logic B1 [9/29 定案]] The default selection starts at 00:00 and is min(video length, Mode limit) long: a 12:30 video selects 「08:00」, a 01:30 video the whole 「01:30」. Selected Length shows mm:ss (Design; PM's 「5m 00s / 8m max」 and 「18s」 / 「1m 30s」 forms are older).\n- R-031 [PM:pm-draft-logic B1 [Design]; DS:ds-ai-video-enhance Length] Either side handle can be dragged: the left ‹ handle moves the start and the right › handle the end; each changes the selected length and the Preview shows the frame at the dragged end. (Two controls, one row each: analysis pass 11.)\n- R-032 [PM:pm-draft-logic B1 [Design]] Dragging the middle of the selection moves the whole range at the same length and the Preview shows its first frame.\n- R-033 [PM:pm-main-flow 9/29 UI; PM:pm-draft-logic UI 規格] At the Mode limit the dragged handle (left or right) stops, the phone gives a light haptic and a bubble says 「Up to 8 minutes in Standard mode」 (Standard) or 「Up to 2m 30s in Professional mode」 (Professional).\n- R-192 [DS:ds-main-flow VE · 01 strip 「00:00」; DS:ds-ai-video-enhance Default / Length (bubbles 「00:00」, 「02:30」, 「01:00」, 「00:14」)] The strip carries a playhead: a line across the strip with a time bubble above it (「00:00」 on entry) and a ◀▶ drag knob (round/ic_btn_drag) under the strip. The bubble shows the same time as the Preview's 「mm:ss/\u003cvideo length>」 (「00:14」 with 「00:14/01:30」, 「01:00」 with 「01:00/12:30」). The knob is the playhead's, not a trim handle (role read from the board images, analysis pass 11).\n- R-193 [DS:ds-ai-video-enhance Length; DS:ds-main-flow VE · 01 knob round/ic_btn_drag] Dragging the playhead knob moves the playhead: the Preview shows the frame under it and the bubble and the Preview time follow; the trim handles, Selected Length and the price do not change (how far it may go: Q-21).\n- R-034 [PM:pm-main-flow 9/29 ⑥; PM:pm-draft-logic B1-1 ⑥] The thumbnail strip's scale depends only on the video length: a video ≤ 8:00 fills the strip's width; a longer one scrolls sideways with 8:00 = one strip width; switching Mode does not re-lay the strip.\n- R-035 [PM:pm-draft-logic B1 [建議]] The shortest selection is 1 s, whichever handle is dragged toward the other.\n\n## Default settings\n- R-040 [DS:ds-ai-video-enhance 預設值規則; PM:pm-defaults 1002] On entering the feature Mode is 「Standard」, a fixed value that does not follow the source video.\n- R-041 [DS:ds-ai-video-enhance 預設值規則; PM:pm-defaults 1002] Enhancement style is 「Natural」, fixed (deliberately not the API default hd).\n- R-042 [DS:ds-ai-video-enhance 預設值規則 「進入功能時自動帶入」] The defaults are set on every entry: a Mode or style changed on one visit is back to Standard / Natural on the next (PM §4.3 「記住上次」 and PM B3's proposal to remember are older than the Design and the 1002 rule).\n- R-043 [DS:ds-ai-video-enhance 預設值規則 + 對照表] fps defaults to the smallest option not below the source fps, the highest when the source is above it: source 1–30 → 「30fps」, 31–60 → 「60fps」, 61 and above → 「120fps」. (PM 1002 「nearest, tie lower」 and PM B3 1–45 / 46–90 / 91+ are older.)\n- R-044 [DS:ds-ai-video-enhance 預設值規則 + 對照表] Resolution defaults to the smallest option not below the source resolution, the highest when above it: 0–720p → 「720p」, 721–1080p → 「1080p」, 1081p and above → 「4K」 (Q-5: which side of a portrait video counts).\n- R-045 [PM:pm-main-flow §5.2] Resolution offers 720p, 1080p and 4K only; there is no 2K option in v1.\n\n## Settings chips\n- R-046 [DS:ds-ai-video-enhance Chips 狀態] Each chip group (Mode, Enhancement style, fps, Resolution) has exactly one selected chip; tapping an unselected, enabled chip selects it and unselects the previous one.\n- R-047 [DS:ds-ai-video-enhance Chips 狀態 「disable：當前 Mode 不支援此設定，不可點選」] A chip the current Mode does not support is drawn disabled and cannot be selected (which combinations: Q-6).\n\n## Mode length limit\n- R-050 [DS:ds-ai-video-enhance Settings › Mode; PM:pm-draft-logic B1 [9/29 定案]] The selection limit is 8:00 in Standard and 2:30 in Professional.\n- R-051 [PM:pm-main-flow 9/29 ②; PM:pm-draft-logic B1-1 ①] With a selection ≤ 2:30, Standard and Professional switch freely; the selection does not change, only the credit price updates.\n- R-052 [DS:ds-ai-video-enhance Mode 長度上限 「點 Professional → 跳 toast 說明上限，不切換」; PM:pm-main-flow 9/29 ③] With a selection over 2:30 in Standard, the Professional chip looks normal (not disabled); tapping it shows the toast 「Professional supports clips up to 2:30. Shorten your selection to switch.」 for about 3 s, Mode stays Standard and the selection is not changed. (PM 9/29 ③'s toast wording and draft B1-1 ②'s auto-shortening 「…Your selection was shortened.」 lose to the Design.)\n- R-053 [DS:ds-ai-video-enhance Mode 長度上限 「縮短到 02:20 → 再點 Professional → 切換成功」] After the selection is shortened to 2:30 or less, tapping Professional switches the Mode.\n- R-054 [PM:pm-main-flow 9/29 ⑤] In Professional either handle stops at 2:30 (R-033).\n- R-055 [PM:pm-main-flow 9/29 ⑤; PM:pm-draft-logic B1-1 ③] Switching from Professional back to Standard keeps the selection and raises the limit to 8:00; the user can drag it longer. (Draft B1-1 ④ 「restore the earlier selection」 belongs to the auto-shortening the Design rejected.)\n- R-056 [PM:pm-main-flow 9/29 limit rule] The selection is rounded up to whole seconds before it is compared with the limit: 2:30.4 counts as 151 s, over 2:30.\n- R-057 [PM:pm-main-flow 9/29 ⑦] On a clip from the Timeline the same rules apply: a selection over 2:30 and a tap on Professional shows the same toast. (Draft B1-1 ⑦ disables the chip with 「Professional mode supports clips up to 2m 30s. Split the clip to use it.」; the Design rule 「Professional 外觀正常，可點」 decides, Q-10.)\n- R-058 [PM:pm-draft-logic B1-1 ⑦ + D4 [建議]] A Timeline clip longer than 8:00 does not open the panel; a toast 「Split clips longer than 8 minutes first」 explains it (Q-10).\n\n## Credit price\n- R-060 [DS:ds-routing 「價格 = 選取秒數 × 每秒費率」; PM:pm-main-flow §6.1] The price is the selected seconds rounded up to whole seconds × the per-second rate of the Mode, Resolution and fps; the CTA shows the total (「Enhance ◆ \u003ccredits>」).\n- R-061 [DS:ds-routing 「長度改變，價格跟著改變」] Changing the selected length updates the CTA price at once.\n- R-062 [PM:pm-main-flow §6.1] Enhancement style does not change the price.\n- R-063 [PM:pm-main-flow §5 / §6.4 example] A 3.96 s selection in 1080p Standard at 30 fps costs 4 s × 2 credits = 8 credits (credit numbers are binding; other rates: Q-4).\n- R-064 [DS:ds-main-flow 「Charge X credits per second」; PM:pm-draft-logic C1 [衝突]] Under the CTA the line 「Charge X credits per second」 shows the per-second rate of the current settings (the Design shows both the total and the rate).\n- R-065 [PM:pm-main-flow §6.1; PM:pm-draft-logic B4 [衝突]] Mode and Resolution change the price; the fps that prices it is the source fps (Q-3).\n- R-066 [PM:pm-main-flow §6.3] Billing uses the SKU genvideo_1_sec_byteplus_{mode}_{style}_{resolution}_{fps} (e.g. std_hd_1080p_30fps) — NOT TESTABLE: server-side billing id, not shown in the app.\n\n## Eligibility and purchase\n- R-070 [DS:ds-main-flow VE · 01 「Free user 需要訂閱才能使用」; PM:pm-access-credit §7 / 9/24] The feature is Pro+ only: for a Free or Pro (not Pro+) user the CTA reads 「Unlock Pro+ to Enhance」 (PM's 「Upgrade to Pro+」 is older) and tapping it opens the IAP page; a Pro+ user gets 「Enhance ◆ \u003ccredits>」.\n- R-071 [PM:pm-draft-logic C2 [建議]] For a Pro user the IAP page opens on the Pro+ tab.\n- R-072 [DS:ds-main-flow IAP_US] The IAP page shows the Pro / Pro+ tabs, the plans 「Yearly」 (「Best Value」, 「65% OFF」) and 「Monthly」, 「Continue」, 「Tap to compare」 and the footer 「Terms of Service」 「Privacy Policy」 「Restore purchase」. The trial line 「Receive 35 credits during free trial」 conflicts with PM §7 「no free trial in v1」 (Q-7).\n- R-073 [PM:pm-draft-logic C2 [建議]] Closing the IAP page or the Credit page without buying returns to the panel unchanged (selection and settings kept).\n- R-074 [DS:ds-main-flow arrows 3293-13677, 3293-13678] 「Continue」 opens the store purchase sheet (the App Store on iOS); after the purchase the app shows 「You're all set」 / 「Your purchase was successful.」 with 「OK」.\n- R-075 [DS:ds-main-flow arrow 3293-13679; DS:ds-alt-exception 「購買成功 → 回 AI Video Enhance（餘額已更新、選取狀態保留）」; PM:pm-draft-logic C2] After a purchase the app returns to the panel with the balance updated and the selection and settings kept; nothing is sent until the user taps the CTA again (PM C2 [建議]).\n- R-076 [DS:ds-alt-exception Insufficient Credits; DS:ds-routing 「餘額不足 → Credit Page」; PM:pm-access-credit §8.1] A Pro+ user whose balance is below the price is taken by 「Enhance」 to the Credit page (「My Credits」, 「Buy More」, 「Expiring within 7 days: 0 credits」, 「Complimentary daily credits」 「Claim once every 24 hours」 「Claim」, the 「PowerDirector Pro+」 card); the video is not uploaded and nothing is charged.\n- R-077 [DS:ds-alt-exception 購買成功 → 回 AI Video Enhance] After buying credits with 「Buy More」 the app returns to the panel with the new balance and the selection kept.\n- R-078 [DS:ds-alt-exception Credit page_paid] 「Claim」 on the Credit page claims the daily credits; back on the panel the credit pill shows the new balance (balance-updated rule of R-075 / R-077).\n- R-079 [PM:pm-draft-logic C2 ① Pro+ → ② network → ③ balance; C3 [建議]] With no network, 「Enhance」 sends nothing and charges nothing; the toast 「Upload failed. Check your connection and try again.」 appears and the panel stays.\n- R-080 [DS:ds-routing 「餘額足夠 → 直接生成」; PM:pm-main-flow §2.2] With enough credits 「Enhance」 starts at once, with no extra confirmation.\n- R-081 [PM:pm-draft-logic C2 [建議]] The server checks the balance again when the task is sent (a balance spent on another device leads to the Credit page) — NOT TESTABLE: needs two devices racing on one account; the visible result is R-076.\n\n## Generating and cancel\n- R-085 [DS:ds-main-flow VE · 03 Generating; DS:ds-cancel] After 「Enhance」 a processing dialog covers the panel: a progress ring (「25%」), 「Video uploading...」, 「Please keep the app open」 and 「Cancel」.\n- R-086 [DS:ds-cancel arrow 3393-18476; DS:ds-routing 「取消確認」] 「Cancel」 opens the dialog 「Sure You Want to Leave?」 / 「Your video is still uploading. Leaving this page will cancel the process, and the credits will not be restored.」 with 「Leave」 and 「Keep Uploading」.\n- R-087 [DS:ds-cancel] 「Keep Uploading」 closes the dialog and the upload goes on.\n- R-088 [DS:ds-cancel arrow 3393-18607; DS:ds-routing 「Leave → 回設定面板 / Leave → credit 不退還 / 使用者主動取消則不退還」] 「Leave」 cancels the process and returns to the panel; the credits are not restored (PM §8 「Cancel while uploading charges nothing, creates no task」 and PM C4's 「Leave = keep running」 lose to the Design, Q-2).\n- R-089 [DS:ds-main-flow arrow 3293-13681; PM:pm-main-flow §8 「成功上傳＝commit 點・扣 credit」] When the upload finishes the task moves to Recent task as processing and the balance drops by the CTA price.\n- R-090 [PM:pm-draft-logic C3 [建議]] Closing or backgrounding the app while uploading counts as a cancel and charges nothing (Q-18).\n- R-091 [PM:pm-main-flow §4.3 「v1 無 cancel，使用者可離開 App」; PM:pm-draft-logic C4 [建議]] After the upload the generation runs on the server in the background: the user may leave the app and it still finishes; a processing task cannot be cancelled in v1.\n- R-092 [PM:pm-draft-logic C4 [待確認]] More than one task can run at once (the limit is pending; PM proposes 3 with 「You can run up to 3 enhancements at a time.」, Q-12).\n- R-093 [PM:pm-main-flow §4.2 step 6 / §9 / §10.4, arrow 397-1241] When the first background task is created after a successful upload, the dialog 「Turn on notifications」 / 「We'll let you know when it's done.」 with 「Turn On」 and 「Later」 appears. PM-only: no Design frame yet.\n- R-094 [PM:pm-draft-logic D1 [建議]] The prompt is shown only when the system notification permission was never asked; 「Turn On」 opens the system permission dialog (or Settings when it was denied); afterwards the user stays on the Generating screen.\n- R-095 [PM:pm-draft-logic D1 [建議]] After 「Later」 the app does not ask again.\n\n## Background task and notifications\n- R-100 [DS:ds-alt-exception 生成完成跳通知; PM:pm-draft-logic D1 [Design]] When a task completes while the user is elsewhere in the app, an in-app banner shows 「Good news! Your AI Video Enhance task has been completed. Tap here to view your results.」 with 「Close」 and 「View」 (PM's push copy is the background case, R-103).\n- R-101 [DS:ds-alt-exception arrow 3293-15875; PM:pm-main-flow arrow 377-452] The banner's 「View」 opens the Result of that task.\n- R-102 [DS:ds-alt-exception Launcher_2026_08 「Close」] The banner's 「Close」 dismisses it; the task stays completed in Recent.\n- R-103 [PM:pm-main-flow §9 「文案為 spec 原文」; PM:pm-draft-logic D1 [建議]] With the app in the background a system notification 「Your video is ready. Tap to view.」 arrives; tapping it opens the Result. PM-only: no Design frame yet.\n- R-104 [PM:pm-main-flow §4.3; PM:pm-draft-logic D2 [建議]] The result also appears in AI Magic › My Artwork and in Template › My Artwork.\n\n## Recent task\n- R-110 [DS:ds-main-flow Recent · processing / Recent · 完成; PM:pm-draft-logic D2 [Design]] Recent task (title 「AI Video Enhance」, back ‹, ⌂) shows the notice 「Tasks are stored on the cloud for 1 Year. Please download any you want to keep in local storage.」 with 「Manage」 and one card per task.\n- R-111 [DS:ds-main-flow Recent · processing] A processing card shows the thumbnail, date and name (「2026/10/21」 「AI Video Enhance 1021」 as drawn), 「processing...」, the time left (「4 minutes left...」) and a progress bar.\n- R-112 [DS:ds-main-flow arrows 3293-13680, 3293-13683] When the task is done its card turns completed with 「View」; 「View」 opens the Result.\n- R-113 [DS:ds-main-flow Recent icon on VE · 02; PM:pm-draft-logic D2 [待確認]] The Recent task icon in the panel's top bar opens Recent task.\n- R-114 [DS:ds-main-flow arrow 3293-13718; PM:pm-main-flow arrow 383-2678] Back ‹ on Recent task returns to the panel.\n- R-115 [DS:ds-alt-exception arrow 3293-15874] ⌂ on Recent task opens the Launcher.\n- R-116 [DS:ds-main-flow 「Manage」] 「Manage」 opens the management of the stored tasks (Q-8).\n- R-117 [DS:ds-main-flow 「Tasks are stored on the cloud for 1 Year」] Tasks are kept on the cloud for one year — NOT TESTABLE: needs a year.\n\n## Result\n- R-120 [DS:ds-main-flow result; DS:ds-alt-exception result] The Result page shows back ‹, the tabs 「Original」 / 「Result」 (Result selected), the video with play, a progress slider and the time (「04:48/08:00」), and the buttons 「Save Result」, 「Add to Timeline」 and 「Enhance More」 (PM 「Edit More」 is older; PM D3 [衝突] settles it).\n- R-121 [DS:ds-main-flow result] 「Original」 shows the source video and 「Result」 the enhanced one.\n- R-122 [DS:ds-routing 「Save Result → 存到手機」; PM:pm-draft-logic D3 [建議]] 「Save Result」 saves the video to the phone, with the toast 「Saved to your device」 (「Couldn't save. Try again.」 on failure).\n- R-123 [DS:ds-routing 「Add to Timeline → 開新 timeline」 + 「Add to Timeline 是開一條新的 timeline，不取代原 clip」] 「Add to Timeline」 opens a new project with the result on its timeline; it does not replace a clip in an existing project.\n- R-124 [DS:ds-main-flow arrow 3293-13720; DS:ds-routing 「Edit More → 回 Media Room」] 「Enhance More」 opens Add Media for the next video.\n- R-125 [DS:ds-main-flow result ‹] Back ‹ on the Result page returns to the page it was opened from (Q-9).\n- R-126 [DS:ds-routing 「所有 Enhance 功能皆耗 credit，一律雲端生成後另存新片」] The result is a new video: the source video in the album is kept unchanged.\n- R-194 [DS:ds-routing 設定面板 「Trim + Mode / Enhancement style / fps / Resolution」 and 「一律雲端生成後另存新片」; PM:pm-main-flow §6.3 SKU {mode}_{style}_{resolution}_{fps}; Rule: analysis pass 10, a setting's values are variants (2026-11-04); Req: REQ-004] The task is made with the values chosen on the panel when 「Enhance」 is tapped: the saved result has the chosen Resolution (720p = 1280 × 720, 1080p = 1920 × 1080, 4K = 3840 × 2160 for a landscape source), the chosen fps (30 / 60 / 120) and the selected length, and the charge is the CTA price those values set (R-060, R-062, R-065, R-089). Each value of Mode, Enhancement style, fps and Resolution is used in one generation (`### Variants`).\n- R-195 [DS:ds-ai-video-enhance Settings › Mode and Enhancement style bubbles; Req: REQ-004] The Mode and style values show in the result as their bubbles say: Professional 「Maximum detail」 (more detail than Standard's 「Great quality」); Sharp 「Moderate enhancement for a sharp, clear image」 (sharper than Natural's 「Lighter enhancement with fewer artifacts, for a more realistic look」).\n\n## Timeline entry\n- R-130 [PM:pm-timeline arrow 397-1887; DS:ds-entry-points] From the Timeline, the tool opens the panel with the selected clip; after 「Enhance」 the flow is the main one (upload, Recent task, notice).\n- R-131 [PM:pm-timeline arrow 397-1921 「Applied Video Enhance」; PM:pm-draft-logic D4 [建議] 「Video Enhance applied」 3 s] After a Timeline task succeeds, the result replaces the original clip on the timeline and the app shows 「Applied Video Enhance」. PM-only: no Design frame yet (Design v2 does not draw the paste-back; Q-11).\n- R-132 [PM:pm-draft-logic D4 [建議]] If the clip was deleted or the project closed during generation, nothing is pasted back and the result stays in Recent task.\n- R-133 [DS:ds-routing Timeline entry] Back ‹ on a panel opened from the Timeline returns to the editor with the project unchanged.\n- R-134 [PM:pm-draft-logic D4 [建議]] On a Result opened for a Timeline task, 「Add to Timeline」 returns to the original project.\n\n## Failure and refund\n- R-140 [DS:ds-alt-exception Generation Failed; DS:ds-routing 失敗卡片; PM:pm-failure-refund] A failed task's card shows an 「Error」 thumbnail and 「View Details」.\n- R-141 [DS:ds-alt-exception Recent dialog; PM:pm-failure-refund arrow 377-1127] 「View Details」 opens the dialog 「An Error Has Occurred」 / 「Credits have been refunded.」 / 「The server may be busy. Please try again later or use a different video.」 with 「OK」; 「OK」 closes it.\n- R-142 [DS:ds-routing 「生成失敗系統自動退還 credit」; PM:pm-failure-refund §8.6; KB: KP-007] A failed generation refunds its credits automatically (the balance is back to what it was before the task); there is no Retry.\n- R-143 [PM:pm-draft-logic D1 [建議]] A failure in the background sends the notification 「Video Enhance didn't finish. Your credits have been refunded.」 (Q-16).\n\n## Open questions\n- Q-1 Demo page description: the Design draws AI Reframe's text 「AI reframe your video for any aspect ratio, then fine-tune the crop in real time.」; PM A1 [衝突] proposes 「Make blurry, noisy or dark videos look sharp and clear.」. Assumption: the description must not be AI Reframe's; the PM proposal is the expected text until the Design changes. R-007 (TC-011).\n- Q-2 Cancel during upload: Design 「Leaving this page will cancel the process, and the credits will not be restored.」 vs PM §8 (Cancel before the upload reaches the server charges nothing and creates no task) and PM C4 (Leave = keep running in the background). Assumption: the Design (newer, outranks): Leave cancels, back to the panel, credits not restored. R-088 (TC-113).\n- Q-3 Which fps prices a task: PM main page says the source fps, PM B4 [衝突] proposes the output fps now that fps is a choice. Assumption: source fps (the changed fps chip does not change the price); check on device. The fps value rows assert only that the charge equals the price shown. R-065 (TC-087, TC-221, TC-222).\n- Q-4 Per-second rate table: only 1080p Standard 30 fps = 2 credits/s is stated. Assumption: other combinations are checked only for the price changing with Mode / Resolution and the charge equalling the price shown; ask PM for the table. R-063, R-065 (TC-083, TC-219, TC-224).\n- Q-5 Resolution of a portrait video: which side decides (PM B3 proposes the short side, 1080×1920 = 1080p). Assumption: short side. R-044 (TC-059).\n- Q-6 Disabled chips: which fps / Resolution combinations each Mode supports (BytePlus table [待確認]); the Design says a disabled chip cannot be tapped, PM B5 says a tap shows a toast. Assumption: a tap on a disabled chip changes nothing and shows no toast; a setting-value row whose chip is disabled on the build is recorded Blocked as a question. R-047 (TC-064, TC-221, TC-222, TC-224).\n- Q-7 Pro+ trial: the IAP page offers 「Try Pro+ 7 days for free」 and 「Receive 35 credits during free trial」 while PM §7 says no free trial in v1 (PM C2 [衝突]). Assumption: no row asserts the trial; the IAP page is checked as the Design draws it. R-072 (TC-093).\n- Q-8 「Manage」 on Recent task: the spec does not say what it opens. Assumption: a page to manage (download / delete) stored tasks. R-116 (TC-144).\n- Q-9 Back from Add Media and from the Result page: the spec draws ‹ but no arrow. Assumption: the previous page. R-014, R-125 (TC-021, TC-155).\n- Q-10 Timeline clip limits: PM 9/29 ⑦ (same trim rules, toast) vs draft B1-1 ⑦ / D4 (whole clip locked, Professional chip disabled for 2:30–8:00 clips, clip > 8:00 does not open). Assumption: the Design rule 「Professional 外觀正常，可點」 and ⑦ (toast) for 2:30–8:00; clip > 8:00 does not open (both PM drafts). R-057, R-058 (TC-160, TC-161).\n- Q-11 Timeline result: PM pastes the result back over the clip (「Applied Video Enhance」, form TBD), the Design routing note says every Enhance result is saved as a new video and 「不取代原 clip」. Assumption: PM paste-back for the Timeline entry (the Design note is about Add to Timeline); check on device. R-131 (TC-162).\n- Q-12 Concurrent tasks [待確認] (PM proposes up to 3). Assumption: a second task can start while one is processing. R-092 (TC-121).\n- Q-13 Supported sources [待確認]: length ≥ 1 s, MP4 / MOV (H.264 / HEVC), ≤ 4K; whether a 4K source can be used (draft notes, Gap 1). Assumption: PM E1 proposal. R-015 (TC-022).\n- Q-14 Disclosure: whether the existing GenAI consent dialog (covering the ByteDance cloud) is shown before the first upload (PM Open question 3, Legal). No row asserts it; a consent dialog on first use is recorded, not filed.\n- Q-15 The panel's credit pill: the spec does not say what tapping it opens. Its control is n/a until PM answers.\n- Q-16 Notifications: failure push (PM Gap 8, D1 [建議]) and the push copy for success are PM-only; the Design draws only the in-app banner. Assumption: Design copy in the app, PM copy for the system notification. R-100, R-103, R-143.\n- Q-17 Recent task entry and processing style [待確認] (Gap 7): the Design draws a Recent icon on the panel and 「4 minutes left...」; assumption: as drawn. R-111, R-113.\n- Q-18 Backgrounding or closing the app during the upload: PM C3 [建議] (cancel, no charge) vs the Design rule that a user cancel is not refunded. Assumption: PM C3 (the Design does not draw backgrounding); check on device. R-090 (TC-115).\n- Q-19 Selected Length format and the limit display: PM 9/29 「5m 00s / 8m max」 and B1 「18s」 vs the Design 「08:00」. Assumption: the Design (mm:ss, no 「/ max」). R-030.\n- Q-21 Playhead: the Design draws a playhead on the strip (a line, a time bubble and a ◀▶ knob) but no note says how far it may be dragged (only inside the selection, or the whole video) or whether play starts from it. Assumption: dragging it scrubs the Preview inside the selection and changes neither the selection nor the price. R-192, R-193 (TC-215).\n- Q-22 Completed task card: PM D2 says a completed card opens the Result when tapped (「Completed (tap → Result)」); the Design draws only the 「View」 button. Assumption: tapping the card's thumbnail opens the same Result as 「View」. R-112 (TC-143).\n\n## Added 2026-11-04 — coverage passes and standing inputs\n\n### Job states\nRows = jobs, columns = states (coverage pass 2).\n\n| Job | Start / loading | Success | Failure (copy and refund) | Retry | Second failure | Partial success | Stop (notice and credits) | Leave and return | Longest wait | Done notice |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Upload (foreground) | TC-110 | TC-114 | TC-100 | n/a (spec: no retry; the user taps Enhance again) | n/a (no retry) | n/a (one clip per task) | TC-111, TC-113 | TC-115 | TC-110 | n/a (the task moves to Recent, TC-114) |\n| Enhancement (background) | TC-114 | TC-143 | TC-170, TC-171, TC-173 | n/a (no Retry, §8.6; TC-173 checks none) | n/a (no Retry) | n/a (one clip per task) | n/a (v1 has no cancel; TC-117 checks none) | TC-116 | TC-114 | TC-130, TC-133 |\n| Save Result | TC-152 | TC-152 | n/a (no fixture makes saving fail; PM [建議] copy only) | n/a (spec silent) | n/a (spec silent) | n/a (one file) | n/a (spec silent) | n/a (spec silent) | TC-152 | TC-152 |\n\n### Error classes\nThe spec names no error classes; one column for any failure.\n\n| Job | Unclassified failure (the spec names no error classes) |\n|---|---|\n| Upload (foreground) | TC-100 |\n| Enhancement (background) | TC-170, TC-171, TC-173 |\n\n### Exit × stage\nWays out × stages (coverage pass 8).\n\n| Stage | Panel back ‹ | Recent task icon | Leave the app (Home) | Dialog Cancel / Leave |\n|---|---|---|---|---|\n| Panel, idle | TC-038 | TC-140 | n/a (spec silent; nothing is running) | n/a (no dialog) |\n| Panel from the Timeline | TC-163 | TC-140 | n/a (spec silent) | n/a (no dialog) |\n| Uploading (processing dialog) | n/a (the dialog covers the panel; its Cancel is the exit) | n/a (covered by the dialog) | TC-115 | TC-111, TC-112, TC-113 |\n| Background generation | TC-141 | TC-140 | TC-116 | n/a (v1 has no cancel, TC-117) |\n\n### Hidden clauses\nClauses the screen does not show and how a tester observes them (pass 9).\n\n| Requirement | Hidden clause | Observed through | Rows |\n|---|---|---|---|\n| R-076 | the video is not uploaded and nothing is charged | the credit pill and the Credit page balance before / after; Recent task has no new card | TC-096 |\n| R-079 | nothing is sent or charged offline | the balance before / after; Recent task has no new card | TC-100 |\n| R-089 | credits are taken when the upload reaches the server | the balance before Enhance, during the upload and after the card appears | TC-114 |\n| R-087 | the upload goes on after Keep Uploading | the processing dialog progress and the card in Recent task | TC-112 |\n| R-088 | Leave cancels the process and does not restore credi   const qm=(D.questions||[]).filter(q=>q.rows.includes(r.cur.ID)).map(q=>{const st=qState(q.id);
    return `<a class="qmark ${st}" href="#q-${esc(q.id)}" data-q="${esc(q.id)}" title="${esc(st==='open'?'This row assumes an answer to an open question: read it or answer it':st==='done'?'Answered and applied':'Answered, waiting for the agent')}">${esc(q.id)}${st==='open'?' ?':' ✓'}</a>`}).join(' ');
  return `${esc(r.cur.ID)}<div>${badges}</div>${qm?`<div>${qm}</div>`:''}${spec}${r.cur['Change Reason']?`<div class="reason">${esc(r.cur['Change Reason'])}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="Describe new cases in your own words; they become rows in the next draft">+ Add case</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>New case notes</b><span>Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.</span><button class="add" data-del="${esc(n.id)}">Remove</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">Keep</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">Delete</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">No cases match these filters.</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label+' copied.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' copied.')}catch(_){toast('Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),'Final CSV');if(liveNotes().length)setTimeout(()=>toast('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast('Save failed: '+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();openQuestion(m.dataset.q)});
header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
</body>
