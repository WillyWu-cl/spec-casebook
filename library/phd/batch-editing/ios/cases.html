<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Editing Test Cases · iOS</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
details.qs>summary{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}
details.qs>summary::-webkit-details-marker{display:none}
details.qs>summary::before{content:"▸";display:inline-block;width:.8em;margin-right:-6px;transition:transform .15s}
details.qs[open]>summary::before{transform:rotate(90deg)}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
.qrows{font-size:.8rem;color:var(--muted)} .qrows a{font-family:var(--mono);color:var(--edit);margin-right:6px}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary>Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary>Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th>ID</th><th>Precondition</th><th>Action</th><th>Expected Result</th><th>Priority</th><th>Spec Ref</th><th>Notes</th><th id="decHead">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec">Copy decisions</button>
    <button class="btn primary" id="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>

:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); one edit made (Crop & Rotate › 「Squre」 › ✓)","Action":"1. Tap Replace photo › 「Discard」\n2. Tap 「Next」","Expected Result":"The Batch Edit Room opens with the same 5 photos and none of the earlier edits","Priority":"P1","Spec Ref":"R-131, R-124","Notes":""},{"ID":"TC-117","Section":"Leaving Batch Edit","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); one edit made (Crop & Rotate › 「Squre」 › ✓)","Action":"1. Tap Replace photo\n2. Tap 「Keep Editing」","Expected Result":"The Batch Edit Room keeps every edit","Priority":"P2","Spec Ref":"R-126","Notes":""},{"ID":"TC-118","Section":"Light and dark mode","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); the phone in Light appearance","Action":"Open the picker, the Batch Edit Room, each room, the dialog and the Batch Save page","Expected Result":"Every screen shows the light design","Priority":"P3","Spec Ref":"R-132","Notes":"Q-14"},{"ID":"TC-119","Section":"Light and dark mode","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); the phone in Dark appearance","Action":"Open the picker, the Batch Edit Room, each room, the dialog and the Batch Save page","Expected Result":"Every screen shows the dark design","Priority":"P3","Spec Ref":"R-132","Notes":"Q-14"},{"ID":"TC-120","Section":"Tracking","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); the app's analytics events visible (log pull or RD event viewer)","Action":"1. Open Launcher › 「Edit」\n2. Tap 「Batch」\n3. Tap 3 photos in order\n4. Tap 「Next」","Expected Result":"The new batch-enter event is sent once (name in Xxx_Yyy_Zzz form, parameters snake_case)","Priority":"P3","Spec Ref":"R-133, R-137","Notes":"Name to be set; parked until an event log is available. PM-only: no Design frame yet (Design 261104)"},{"ID":"TC-121","Section":"Tracking","Precondition":"iPhone, PhotoDirector signed in, Pro tier (Launcher › Pink › ☰ › [0] IAP › Status = Pro); at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); 「AI Enhance」 open; analytics events visible","Action":"Enhance the batch","Expected Result":"GenAI_Feature_Generate is sent 5 times, each with from = BatchEdit and batch_size = 5","Priority":"P3","Spec Ref":"R-134, R-137","Notes":"Parked until an event log is available. PM-only: no Design frame yet (Design 261104)"},{"ID":"TC-122","Section":"Tracking","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); one edit made (Crop & Rotate › 「Squre」 › ✓); analytics events visible","Action":"Save the batch","Expected Result":"Photo_Result_Save is sent for the batch save","Priority":"P3","Spec Ref":"R-135","Notes":"Parked until an event log is available. PM-only: no Design frame yet (Design 261104)"},{"ID":"TC-123","Section":"Tracking","Precondition":"iPhone, PhotoDirector signed in, Free tier; at least 21 photos in the gallery, of different sizes and ratios (e.g. 2:3, 4:5, 1:1, 16:9); Batch Edit Room open with 5 photos (Launcher › Edit › Batch › 5 photos › Next); one edit made (Crop & Rotate › 「Squre」 › ✓); saved; analytics events visible","Action":"Tap 「Edit Next Batch」","Expected Result":"The new Edit Next Batch click event is sent","Priority":"P3","Spec Ref":"R-136","Notes":"Name to be set; parked until an event log is available. PM-only: no Design frame yet (Design 261104)"}],"previous":{},"requirements":"# Batch Editing — requirements (ios)\nSpec: Batch Editing - PM and Design Figma.md (Figma-only spec set 2026-11-09: PM page 0:1 「26'11/E Batch editing: AI enhance, crop & rotate, adjustments」, Design page 12:2321 「261104_design」)\n\nSource order: Design (page dated 261104) over PM, except where a PM rule is newer or more specific (the 「✅ 結論」 crop rule board, the TBD Q1 / Q2 decisions of 10/30) (analysis.md pass 7). Decision ids in brackets ([D1-07], [DR-04]) are the PM's own. The draft boards 「Apply to all · icon options」 and 「提案 · Adjustment 縮圖列」 are proposals the PM marks as not in the spec yet; the 「Reference」 section is competitor material.\n\n## Entry and Photo Picker\n- R-001 [PM:pm-flow-1 D0-04, D0-04b; PM:pm-ui-1 DR-01b] Batch Edit is reached only from the Photo Picker of Launcher 「Edit」 and of the AI Enhance shortcut (and the Batch Editing shortcut); the single-photo Edit Room has no batch button\n- R-002 [PM:pm-flow-1 D0-07, D0-06, DR-03; PM:pm-header D0-03] Batch Edit offers only three tools that apply one setting to every photo: Crop & Rotate, Adjustment and AI Enhance (no Filter or Preset)\n- R-003 [PM:pm-flow-1 D0-08, D5-01b; PM:pm-tbd Q2; PM:pm-credit DR-11] Batch Edit is free on day 1: a Free user can open it, use Crop & Rotate and Adjustment and save, with the 20-photo limit; it is not locked to Premium\n- R-004 [DS:design-light-entry 「photo_picker」 13:2380; PM:pm-ui-1 DR-01b] The Photo Picker has a 「Single」 / 「Batch」 switch at the top, and it opens on 「Single」 every time\n- R-005 [PM:pm-ui-1 DR-13] With 「Single」, picking one photo opens the existing single-photo Edit Room as today\n- R-006 [PM:pm-ui-1 DR-01b, D0-04b; PM:pm-flow-4] The Launcher 「Edit」 picker and the AI Enhance shortcut picker have the same Single / Batch switch\n- R-007 [PM:pm-ui-1 DR-01] Only 「Batch」 allows several photos, at most 20 on both platforms\n- R-008 [DS:design-light-entry 13:2380; PM:pm-ui-1 D2-01] Picked photos show their pick order 1, 2, 3… on the thumbnails, and the Batch Edit Room lists them in that order\n- R-009 [DS:design-light-entry 13:2380; PM:pm-ui-1 DR-01] The picker bottom shows the count and 「Next」: Design 「Select 1 to 20 photos to continue.(10/20)」 (PM mockups: 「Select 1 to 20 photos.」, 「3 selected (max 20)」, 「Done」; Q-1)\n- R-010 [DS:design-light-entry 13:2380] The Design picker shows the picked photos in a row above 「Next」, each with ×; tapping × removes that photo from the selection (Design-only, Q-2)\n- R-011 [PM:pm-ui-1 DR-01] Picking a 21st photo is refused with the toast 「Please pick at most 20 photos.」\n- R-012 [PM:pm-ui-1 DR-01b, DR-13; PM:pm-flow-5] With 「Batch」 and only one photo picked, Next / Done opens the single-photo Edit Room\n- R-013 [PM:pm-flow-5 D1-08c; PM:pm-ui-1 D1-08c] In the single-photo Edit Room, Replace photo opens the Photo Picker, where switching to 「Batch」 leads to Batch Edit\n- R-014 [PM:pm-flow-1 row 8, 410:4074, 410:4076] The Launcher has a 「Batch Editing」 shortcut (icon still to be designed, Q-3) that opens Batch Edit; deeplink phd://navigate/page?name=batch_edit opens it too (where it lands: Q-3)\n- R-023 [PM:pm-ui-5 DR-02] From the AI Enhance shortcut, several photos land directly in the batch AI Enhance room (not the Batch Edit Room main screen)\n\n## Batch Edit Room\n- R-024 [DS:design-light-entry 「canvas_img_focus」 13:2826; PM:pm-ui-2 D1-11, D1-01] The Batch Edit Room looks like the Edit Room; its bottom has only three buttons, in this order: 「Crop & Rotate」, 「Adjustment」, 「AI Enhance」; the picker opens it on this main screen\n- R-025 [DS:design-light-entry 13:2826; PM:pm-ui-2 D1-11] The top bar has Home and Replace photo on the left and Save (download) and Settings on the right (Settings rightmost); the Design also draws a feedback icon (Q-4)\n- R-026 [PM:pm-ui-2 D1-11] Settings (rightmost) opens the existing save settings, as in the Edit Room (Q-4)\n- R-027 [DS:design-light-entry 13:2826; PM:pm-ui-2 D1-12, D1-09] A thumbnail strip on the main screen lists the batch; tapping a thumbnail shows that photo; photos cannot be removed or added (no × on the thumbnails)\n- R-028 [PM:pm-ui-2 DR-05, DR-05d] The main screen's Undo / Redo keep one history per photo and act only on the photo shown; what one room visit changed on a photo is one step in that photo's history\n- R-029 [PM:pm-ui-2 DR-10b, DR-12e] Undo on a photo can take it back to before AI Enhance (that photo only) and Redo brings the result back; once that photo is edited after the Undo, Redo is cleared and the result cannot be restored (Enhance can be run again)\n- R-030 [DS:design-light-entry 13:2826 「editing_area/btn_BA_n」] The compare button at the bottom right of the photo shows the current photo before its edits while held (as in the Edit Room)\n- R-031 [DS:design-light-entry 13:2826 「round/ic_feedback」] The feedback icon in the top bar opens the app's existing feedback page (Design-only, Q-4)\n\n## Crop & Rotate\n- R-032 [DS:design-light-entry 「3_」 22:2798; PM:pm-ui-3 D1-11, DR-03] The batch Crop & Rotate room is the existing Crop & Rotate room without a panel title bar: top ‹, the photo's size 「W x H ✎」 and 「All」; the angle slider; 「Rotate」, 「Flip」, 「Flip Vertically」, 「Original」, 「Custom」 and the ratios (「Squre」, 「2:3」, 「3:2」, 「3:4」…); ✕, ↶, ↷, ✓ at the bottom; the thumbnail strip above the slider\n- R-033 [PM:pm-ui-3 D1-11] The top shows the current photo's output size 「W x H」; switching photos shows that photo's size\n- R-034 [PM:pm-ui-3 D1-11; PM:pm-crop-apply-rule C12] Tapping ✎ allows typing the size in px, from 238 px up to that photo's original width / height; a value out of range shows a toast and is not applied (toast copy: Q-5)\n- R-035 [PM:pm-ui-3 D1-11, DR-04; PM:pm-crop-apply-rule] After a typed px size, Apply to all copies only the ratio to the other photos, never the px values\n- R-036 [PM:pm-ui-3 DR-04] With width and height linked, typing a size keeps the ratio, so 「All」 stays disabled; with them unlinked, the ratio changes to Free (custom) and 「All」 becomes enabled\n- R-037 [DS:design-light-entry 22:2798 「All」, 「status」 105:4500; PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] Each batch room (Crop & Rotate, Adjustment) has 「All」 (Apply to all) at the top right: an icon and 「All」 on a translucent dark capsule; it is a one-off button, not a checkbox: tapping it applies the current photo's setting of that room to every other photo\n- R-038 [DS:「status」 105:4500 (normal / disabled); PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] 「All」 is disabled when the room opens and the current photo has no change\n- R-039 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] 「All」 becomes enabled when the current photo has a change not yet applied, and is disabled again once applied, until the current photo changes again\n- R-040 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] Switching photos sets 「All」 by the newly shown photo: enabled only if that photo has a change not yet applied\n- R-041 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] Undo of the Apply-to-all step makes 「All」 enabled again; Redo of it makes 「All」 disabled\n- R-042 [DS:design-light-adjust 「adjust」 41:923 「Applied to 11 photos」; PM:pm-ui-3 DR-04, DR-04c; PM:pm-ui-4 DR-04] After 「All」 the room stays open and the toast 「Applied to x photos」 shows, x = the number of photos other than the current one\n- R-043 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] After 「All」 the thumbnail strip shows every photo with the applied result (updated at once)\n- R-044 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04] After 「All」 any photo can be shown and adjusted on its own; that adjustment changes only that photo\n- R-045 [PM:pm-ui-3 DR-04; PM:pm-ui-4 DR-04, DR-04c] Tapping 「All」 again after a new change applies the current photo's latest setting of the room, as a whole, to every other photo, replacing their own tweaks in that room\n- R-046 [PM:pm-crop-apply-rule C1, C5] Choosing a ratio gives the photo the largest box of that ratio, centred (as the single Crop & Rotate room); with Apply to all and the box not moved, every photo gets its own largest box, centred\n- R-047 [PM:pm-crop-apply-rule 一] Crop Apply to all keeps the current photo's crop box as the user set it (size and position)\n- R-048 [PM:pm-crop-apply-rule 一, 二; PM:pm-ui-3 DR-07] Every other photo gets the largest box of that ratio, placed at the current photo's relative position; only directions with room to move take the position, others are centred (the PM UI board said 「centred」: Q-6)\n- R-049 [PM:pm-crop-apply-rule 一] Each photo's output size is worked out from its own original, so the px sizes differ between photos\n- R-050 [PM:pm-crop-apply-rule 一] Crop Apply to all replaces the other photos' earlier crops, recomputed from each original\n- R-051 [PM:pm-crop-apply-rule 三; PM:pm-ui-3 DR-07] A Free crop is applied as a custom ratio (ratio and relative position), with each other photo at the largest box of that ratio\n- R-052 [PM:pm-crop-apply-rule 三, C11] 「Original」 with Apply to all returns every photo to its own original ratio, uncropped\n- R-053 [PM:pm-crop-apply-rule 三, C9] A photo whose ratio already equals the applied ratio stays whole (not cropped)\n- R-054 [PM:pm-crop-apply-rule 五; PM:pm-ui-3 DR-07] Apply to all copies rotation and flips: 90° rotation and horizontal / vertical flips to every photo; a fine angle copies the same angle, with each photo's box shrunk to avoid black edges from its own size\n- R-055 [PM:pm-crop-apply-rule 五; PM:pm-ui-3 DR-05b] One Undo after Apply to all undoes it on every photo; one Redo applies it to every photo again\n- R-056 [PM:pm-ui-3 DR-05, DR-05b; PM:pm-ui-4 DR-05, DR-05b] Each batch room has one shared Undo / Redo history of two kinds of step: Apply to all (all photos) and a single parameter edit on one photo; Undo of a single edit changes only the photo it was made on, whichever photo is shown\n- R-057 [PM:pm-ui-3 DR-05e; PM:pm-ui-4 DR-05e] Switching photos in a room does not clear its history\n- R-058 [PM:pm-ui-3 DR-05h; PM:pm-ui-4 DR-05h] When Undo / Redo changes a photo that is not shown, the room switches to that photo and the strip selects it\n- R-059 [PM:pm-ui-3 DR-05c; PM:pm-ui-4 DR-05c] A room's ✕ drops every change made to every photo since the room was opened, Apply to all included\n- R-060 [PM:pm-ui-3 DR-05d; PM:pm-ui-4 DR-05d] A room's ✓ returns to the Batch Edit Room keeping the changes (one step per photo in the main screen's history)\n- R-061 [PM:pm-ui-3 D1-12; PM:pm-ui-4 D1-12] Each batch room shows the thumbnail strip; tapping a thumbnail switches the current photo\n- R-062 [DS:design-light-entry 22:2798 「top/ic_back」; PM:pm-ui-3 D1-11] The Crop & Rotate room's ‹ at the top left leaves the room like ✕ (Q-7)\n\n## Adjustment\n- R-065 [DS:design-light-adjust 「adjust」 41:923; PM:pm-ui-4 D1-11, DR-03, DR-06] The batch Adjustment room is the 26'10/E Adjustment room with tabs 「Light」 / 「Color」 / 「Details」, ⓘ at the top left and 「All」 at the top right, the thumbnail strip, ✕ ↶ ↷ ✓; it has no Subject Detection; the Design draws 「AI Exposure」 in the tool row while the PM says it is not shown (Q-8)\n- R-066 [PM:pm-ui-4 DR-04, DR-04c] Adjustment Apply to all copies the room's whole setting: photo 1 Exposure +20 → 「All」 → every photo +20; photo 3 Contrast +10; photo 1 Exposure +30 → 「All」 → every other photo matches photo 1 and photo 3 loses its Contrast +10\n- R-067 [PM:pm-ui-4 DR-05g] Undo / Redo in Adjustment do not switch the Light / Color / Details tab (as the single Adjustment room)\n- R-068 [DS:design-light-adjust 「9_Adjust_curve」 57:6798, 「9_Adjust_HSL」 63:7874; PM:pm-ui-4 D1-12, 31:1833] Opening Color › Curve or HSL hides the thumbnail strip (it cannot be tapped); 「All」 stays shown\n- R-069 [DS:design-light-adjust 「9_Adjust_curve_collapse」 128:8508, 「9_Adjust_HSL_collapse」 105:4123; PM:pm-ui-4 D1-12] Collapsing the Curve / HSL panel (﹀) or going back to a slider tool such as Exposure shows the strip again; to switch photos the panel is collapsed first\n- R-070 [DS:design-light-adjust 63:7874] HSL has the colour chips and 「Hue」, 「Saturation」, 「Lightness」 sliders as in the single Adjustment room, and Curve has its reset and compare buttons\n- R-071 [DS:design-light-adjust 41:923 「top/ic_info」] ⓘ at the top left of the batch rooms opens the existing help for that tool (Design-only, Q-7)\n\n## AI Enhance\n- R-075 [DS:design-light-enhance 「Enhance_1」 57:4257; PM:pm-ui-5 DR-09, DR-12a, D1-11] The batch AI Enhance room has no Standard / Advanced tabs and no scenario list: one 「Enhance」 button with 「Maximize detaill and clarity with advanced AI.」 under it, the thumbnail strip above it, ✕ and ✓ at the bottom\n- R-076 [PM:pm-ui-5 DR-09d] The batch 「Enhance」 runs the 10/E Standard · Portrait enhance\n- R-077 [PM:pm-ui-5 DR-12b, DR-12f, DR-12g, DR-09b, DR-09] Batch has none of the Advanced rules or the seven Advanced scene presets (General, Portrait, Scenery, Pets, Concert, Product, Anime)\n- R-078 [PM:pm-ui-5 DR-11, D5-01b; PM:pm-ui-6 DR-11; PM:pm-credit DR-11; PM:pm-tbd Q1] AI Enhance in batch charges no credits: the 「Enhance」 button and the dialog show no price, and the balance does not change; Crop & Rotate and Adjustment are free too\n- R-079 [PM:pm-ui-5 DR-10, DR-12h] One 「Enhance」 enhances every photo of the batch, and the results apply when done (no ✓ per photo)\n- R-080 [DS:design-light-enhance 57:4625 「Alert」; PM:pm-ui-6 DR-12, DR-12h, D1-02, D1-03] Each tap on 「Enhance」 asks 「Enhance {xx} photos?」 / 「Processing takes a moment and cannot be canceled once started.」 with 「Cancel」 and 「Start」 ({xx} = the photos to enhance, Q-9)\n- R-081 [PM:pm-ui-6 DR-12] 「Cancel」 returns to the AI Enhance room with nothing processed; 「Start」 starts the batch\n- R-082 [DS:design-light-enhance 57:4892; PM:pm-ui-5 D1-02] While processing, the existing loading screen shows 「Creating Your AI Image」 and 「Enhancing k / N」 (k = done, N = requests) with a progress bar; the mask covers the whole screen, the strip included\n- R-083 [PM:pm-ui-5 D1-02, D1-03] While processing nothing else can be done: no Crop / Adjustment, no thumbnail switch, no cancel, no save; the user waits for every photo\n- R-084 [PM:pm-ui-5 DR-12e, DR-12h] In one visit of the AI Enhance room 「Enhance」 can be applied once: afterwards the button reads 「Enhanced」 and is greyed\n- R-085 [PM:pm-ui-5 DR-12e] Leaving the room and opening it again allows one more Enhance, run on the current (already enhanced) photos\n- R-086 [PM:pm-ui-5 DR-12d, D3-01, D3-02; PM:pm-flow-4 151:2352] A Free user's 「Enhance」 opens the existing Premium IAP page at once (no trial of one photo, no dialog)\n- R-087 [PM:pm-flow-4 151:2336] Closing the Premium IAP page without buying returns to the AI Enhance room with nothing enhanced (Q-10)\n- R-088 [DS:design-light-enhance 57:4257 「✕」] The AI Enhance room's ✕ returns to the Batch Edit Room; whether a finished Enhance is kept is not stated (Q-11)\n- R-089 [PM:pm-ui-5 D1-12] The AI Enhance room's thumbnail strip switches the photo shown\n- R-090 [KB:KP-013] On iOS the paid modes Pro and Pro+ are distinct; batch AI Enhance works for each paid mode\n\n## AI Enhance errors\n- R-098 [DS:design-light-enhance 57:5097; PM:pm-ui-5 D1-04; PM:pm-error-handle D1-04] Failures are summed up once, when every photo is done (no dialog per photo): 「X completed, Y failed」 and 「Failed photos are marked with ! on the thumbnails.」 (Design; PM: 「Failed photos are marked on the thumbnails.」, Q-12); failed thumbnails get a red ! at the top right, successful ones none\n- R-099 [PM:pm-ui-5 D1-04] Tapping a failed thumbnail shows that photo\n- R-100 [DS:design-light-enhance 57:5097 (× on the message)] The × on the result message closes it (Design-only)\n- R-101 [DS:design-light-enhance 57:5097; PM:pm-ui-5 D1-04, DR-12e] The button becomes 「Retry Failed (x)」 (x = failed ph es not say what they do. Assumption: ‹ = ✕ and ⓘ opens the existing help (R-062, R-071; TC-055, TC-069).\n- Q-8 AI Exposure in batch Adjustment: the PM says it is not shown (DR-06); the Design (261104) draws 「AI Exposure」 in the tool row. The dates cannot tell which is newer. Assumption: the Design, checked on device (R-065; TC-056).\n- Q-9 「Enhance {xx} photos?」: is {xx} the batch size, or only the photos not yet enhanced / still failed (Retry)? Assumption: the batch size, and the failed count on Retry (R-080; TC-072, TC-091).\n- Q-10 Closing the Premium IAP page opened from batch 「Enhance」: where does the user land? Spec silent. Assumption: back in the AI Enhance room with nothing enhanced (R-087; TC-083).\n- Q-11 AI Enhance room ✕ after a finished Enhance: are the results kept (they apply when done, DR-10) or dropped as a room ✕ (DR-05c)? Assumption: not asserted; the run records it (R-088; TC-079).\n- Q-12 Result message second line: the Design says 「Failed photos are marked with ! on the thumbnails.」; the PM UI board says 「Failed photos are marked on the thumbnails.」 (its flow board has the Design wording). Assumption: the Design (R-098; TC-088).\n- Q-13 Batch Save page title: the Design says 「Save 12 photos」; the PM says 「Saved 12 photos」. Assumption: the Design wording, the count as the batch size (R-111; TC-101).\n- Q-14 Light and dark: the Design draws every screen in both; does the app follow the system appearance? Assumption: the system appearance (R-132; TC-118, TC-119).\n- Q-16 Adjustment strip in Curve / HSL: the PM rule (D1-12) and the Design (261104) hide the strip while Curve / HSL is open; the PM draft board 「提案 · Adjustment 縮圖列」 shows RD's current build (「RD 實作提案一」) keeping the strip with a blank bar and ﹀, and two proposals (smaller strip; hide while dragging; ﹀ in the strip) marked 「尚未寫進 spec」. Assumption: the PM rule and the Design (R-068, R-069; TC-065, TC-066).\n- Q-17 Credit pill and History in the AI Enhance room: the PM mockups (pm-ui-5) a }
const find=id=>rows.find(r=>r.cur.ID===id);
function bindField(el){el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()}
function editCell(d){
  const ta=document.createElement('textarea');ta.dataset.id=d.dataset.id;ta.dataset.f=d.dataset.f;ta.rows=2;ta.value=find(d.dataset.id).cur[d.dataset.f]??'';
  d.replaceWith(ta);bindField(ta);ta.focus();
  ta.onblur=()=>{filters();const v=document.createElement('div');v.className='cv';v.tabIndex=0;v.dataset.id=ta.dataset.id;v.dataset.f=ta.dataset.f;v.textContent=ta.value;ta.replaceWith(v)};
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="Describe new cases in your own words; they become rows in the next draft">+ Add case</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>New case notes</b><span>Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.</span><button class="add" data-del="${esc(n.id)}">Remove</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">Keep</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">Delete</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">No cases match these filters.</td></tr>`;
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('select').forEach(el=>{if(REVIEW)bindField(el)});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function saveState(){
  if(!REVIEW||!D.save)return;
  // a working copy of the approved table: nothing to save until something changed (a real draft can be approved as it is)
  const none=/^edit-/.test(D.draft)&&rows.every(r=>state(r)==='kept')&&!liveNotes().length;
  $('#save').disabled=none;$('#save').title=none?'Nothing has changed yet':'';
}
function counts(){
  saveState();
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label+' copied.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' copied.')}catch(_){toast('Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),'Final CSV');if(liveNotes().length)setTimeout(()=>toast('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast('Save failed: '+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();openQuestion(m.dataset.q)});
header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
</body>
