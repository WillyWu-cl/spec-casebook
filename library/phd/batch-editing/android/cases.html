<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Editing Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

eave this page or quit the app.」 with a progress bar over the main screen; the top bar is dimmed (no feedback button) and does not respond; k counts up; the Batch Save page opens only when all are saved","Priority":"P1","Spec Ref":"R-150, R-220","Notes":""},{"ID":"TC-123","Section":"Save","Precondition":"Saving in progress with 20 photos","Action":"Time from Save to the Batch Save page","Expected Result":"Record the time; no stall longer than 10 s with the progress bar moving","Priority":"P2","Spec Ref":"R-150","Notes":"Rule 2 wait thresholds."},{"ID":"TC-124","Section":"Save","Precondition":"Saving in progress","Action":"Press Home (background) for 10 s and return","Expected Result":"Record: saving continues or resumes and ends on the Batch Save page with every photo saved","Priority":"P2","Spec Ref":"R-150","Notes":"Spec only asks the user not to leave; record."},{"ID":"TC-125","Section":"Save","Precondition":"Batch of 20 just saved","Action":"Open the phone gallery","Expected Result":"20 new files dated now; the 20 originals are still there unchanged","Priority":"P1","Spec Ref":"R-151","Notes":""},{"ID":"TC-126","Section":"Save","Precondition":"Batch of 20 (5 edited, 15 unedited) just saved","Action":"Count the new files","Expected Result":"All 20 input photos are saved as new files, the 15 unedited ones included","Priority":"P1","Spec Ref":"R-152","Notes":""},{"ID":"TC-127","Section":"Save","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room with 12 photos, AI Enhance running","Action":"Tap Save","Expected Result":"Save does not start before the enhance has finished","Priority":"P2","Spec Ref":"R-122","Notes":""},{"ID":"TC-128","Section":"Batch Save page","Precondition":"Batch of 12 just saved","Action":"Look at the page","Expected Result":"A thumbnail grid of the 12 saved photos under the title 「Save 12 photos」; 「‹」 top left, Home top right, 「Edit Next Batch」 fixed at the bottom; no Video tab and no 「Turn it to video」","Priority":"P1","Spec Ref":"R-153, R-157, R-221","Notes":"Design copy; PM writes 「Saved 12 photos」 (Q-20)."},{"ID":"TC-129","Section":"Batch Save page","Precondition":"Batch Save page with 12 photos","Action":"Tap a few thumbnails","Expected Result":"Nothing opens (no full-screen viewer)","Priority":"P2","Spec Ref":"R-156","Notes":""},{"ID":"TC-130","Section":"Batch Save page","Precondition":"Batch Save page","Action":"Scroll to the bottom of the grid","Expected Result":"「Edit Next Batch」 stays fixed at the bottom while the grid scrolls","Priority":"P3","Spec Ref":"R-155","Notes":""},{"ID":"TC-131","Section":"Batch Save page","Precondition":"Batch Save page after saving an edited batch","Action":"Tap 「‹」","Expected Result":"Returns to Batch Edit Room","Priority":"P1","Spec Ref":"R-154, R-222","Notes":"Record whether the edits are still there and whether Save again creates another set of files (Q-14)."},{"ID":"TC-132","Section":"Batch Save page","Precondition":"Batch Save page","Action":"Tap Home","Expected Result":"Goes to the Launcher","Priority":"P1","Spec Ref":"R-154, R-223","Notes":""},{"ID":"TC-133","Section":"Batch Save page","Precondition":"Batch Save page","Action":"Tap 「Edit Next Batch」","Expected Result":"The Photo Picker opens on 「Batch」 with no photo selected","Priority":"P1","Spec Ref":"R-155, R-224","Notes":""},{"ID":"TC-134","Section":"Batch Save page","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room with 12 photos, photo 1 cropped to Square; saved; Photo Picker opened by 「Edit Next Batch」","Action":"Tap 「‹」","Expected Result":"Returns to Batch Edit Room showing the edits as they were (photo 1 still Square), not the Launcher and not the Batch Save page","Priority":"P1","Spec Ref":"R-155, R-235","Notes":"UI UX flow 2: day-1 follows the Android single Edit Room (iOS single goes to the Launcher today)."},{"ID":"TC-135","Section":"Batch Save page","Precondition":"Signed in with a Free (non-Premium) account; IAP flyer / ad frequency as on the test account","Action":"Save a batch of 5","Expected Result":"IAP flyers and ads appear as they do after a normal save (no extra, none dropped)","Priority":"P3","Spec Ref":"R-158","Notes":""},{"ID":"TC-136","Section":"Batch Save page","Precondition":"Signed in with a PhotoDirector Premium account; the rating dialog trigger count from RD (n saves)","Action":"Save n batches of several photos each","Expected Result":"The rating dialog counts each batch as one save (it appears after n batches, not after n photos)","Priority":"P3","Spec Ref":"R-158","Notes":"needs: rating trigger count from RD."},{"ID":"TC-137","Section":"Android Back","Precondition":"Photo Picker from 「Edit」 on 「Batch」, 2 selected","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to the Launcher","Priority":"P2","Spec Ref":"R-170","Notes":""},{"ID":"TC-138","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos (Launcher 「Edit」 › 「Batch」), no edit yet","Action":"Press system Back","Expected Result":"Record: leaves to the Launcher (as Home) or the picker (as Replace photo), with no dialog","Priority":"P1","Spec Ref":"R-170","Notes":"Spec silent on Back here (Q-11)."},{"ID":"TC-139","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos, photo 1 cropped to Square and back on the main screen (✓)","Action":"Press system Back","Expected Result":"The Discard Dialog appears (edits are not dropped silently); record where 「Discard」 then leads","Priority":"P1","Spec Ref":"R-170, R-140","Notes":"Spec silent (Q-11)."},{"ID":"TC-140","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos (Launcher 「Edit」 › 「Batch」), no edit yet; Crop & Rotate room open on photo 1; 3:2 applied to all","Action":"Press system Back","Expected Result":"Same as ✕: back to Batch Edit Room with the room's changes dropped","Priority":"P2","Spec Ref":"R-170, R-085","Notes":"Spec silent (Q-11)."},{"ID":"TC-141","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos (Launcher 「Edit」 › 「Batch」), no edit yet; Adjustment room open on photo 1; Exposure +20 applied to all","Action":"Press system Back","Expected Result":"Same as ✕: back to Batch Edit Room with the room's changes dropped","Priority":"P2","Spec Ref":"R-170, R-102","Notes":"Spec silent (Q-11)."},{"ID":"TC-142","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos (Launcher 「Edit」 › 「Batch」), no edit yet; AI Enhance page open on photo 1, no photo enhanced yet; enhance finished","Action":"Press system Back","Expected Result":"Same as ✕: back to Batch Edit Room with the results kept","Priority":"P2","Spec Ref":"R-170, R-130","Notes":"The Design draws the Discard Dialog over the AI Enhance page (Q-19): record if Back asks first."},{"ID":"TC-143","Section":"Android Back","Precondition":"Batch enhance processing","Action":"Press system Back","Expected Result":"Processing is not interrupted or cancelled; the screen stays under the mask","Priority":"P1","Spec Ref":"R-170, R-121, R-122","Notes":""},{"ID":"TC-144","Section":"Android Back","Precondition":"Confirm Dialog open","Action":"Press system Back","Expected Result":"Same as 「Cancel」: the dialog closes and nothing is processed","Priority":"P2","Spec Ref":"R-170, R-137","Notes":""},{"ID":"TC-145","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with 12 photos, photo 1 cropped to Square and back on the main screen (✓); Discard Dialog open","Action":"Press system Back","Expected Result":"Same as 「Keep Editing」: stays in Batch Edit Room with the edits","Priority":"P2","Spec Ref":"R-170, R-142","Notes":"Spec silent (Q-11)."},{"ID":"TC-146","Section":"Android Back","Precondition":"Saving in progress","Action":"Press system Back","Expected Result":"Saving is not interrupted; the Batch Save page follows","Priority":"P2","Spec Ref":"R-170, R-150","Notes":"Spec silent (Q-11)."},{"ID":"TC-147","Section":"Android Back","Precondition":"Batch Save page","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to Batch Edit Room","Priority":"P2","Spec Ref":"R-170, R-154","Notes":""},{"ID":"TC-148","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room with 12 photos, photo 1 cropped to Square; saved; Photo Picker opened by 「Edit Next Batch」","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to Batch Edit Room with the edits (photo 1 still Square), not the Batch Save page","Priority":"P2","Spec Ref":"R-170, R-155, R-235","Notes":""},{"ID":"TC-149","Section":"Android Back","Precondition":"Signed in with a PhotoDirector Premium account; Batch Edit Room open with the Section 3 test set in this order: ① escalator 2:3 (1706×2559), ② 101 4:5 (1576×1970), ③ tea cup 1:1 (small), ④ seascape 16:9 (2730×1535); Crop & Rotate room open; pixel input open with the keyboard","Action":"Press system Back twice","Expected Result":"The first Back closes the keyboard; the second closes the pixel input without applying a value","Priority":"P3","Spec Ref":"R-170, R-066","Notes":""}],"previous":{},"requirements":"# Batch Editing — requirements (android)\nSpec: UI UX flow 2.pdf (PM \"Demo + Spec\", Batch Edit, 26'11/E, re-exported 2026-11-09), Section 3 · 美圖 Apply to all\n實測.pdf (crop Apply to all decision) and the Design Figma frames exported one PDF per frame (`Design - *.pdf`, light and\ndark copies), spec set 2026-11-09.\n\nSource tags: `[PM:\u003cboard>; \u003crule IDs>]`, board IDs from `specs/2026-11-09/extracted/boards.json`, rule IDs as the boards\nprint them (`D1-08`, `DR-05b` …); `[S3:\u003cboard>]` for Section 3 · 美圖 Apply to all 實測. The flow file is PM-owned and also\ncarries the UI; `[DS:\u003cboard>]` = a Design frame (`ds-*` boards, `design-text.md`). UI strings follow the Design frames,\nrules the PM boards; where the two disagree on a rule the question is open and the row says which it follows. Mockups\nare iPhone frames; Android differences are in \"System back\". The Design Figma was read from PDF exports, not through\nFigma (quota ran out mid read: `figma-pending.json`, Q-12). Request ledger: REQ-001 (this table), REQ-003 (this update), REQ-004 (UI copy follows the Design).\n\n## Scope\n- R-001 [PM:overview; D0-04, D0-04b] The feature is named 「Batch Edit」 / 「Batch Edit Room」 and is reached only from the Photo Picker of the Launcher 「Edit」 button and of the Launcher 「AI Enhance」 shortcut.\n- R-002 [PM:overview; D0-04] Edit Room itself offers no Batch Edit tool (its toolbar has no batch entry); the only way from Edit Room is Replace photo → Picker Batch tab (R-017).\n- R-003 [PM:overview, room-default; D0-07, D0-06, DR-03, D1-11] Batch Edit offers only three tools: 「Crop & Rotate」, 「Adjustment」, 「AI Enhance」 (no Filter, no Preset).\n- R-004 [PM:overview, enhance-default; D0-08, D5-01b, DR-11] Batch Edit is free: Crop & Rotate and Adjustment cost nothing and AI Enhance deducts no credits (the credit balance is unchanged after a batch enhance).\n- R-005 [PM:overview; D0-05] Released on iOS and Android together in 26'11/E. — NOT TESTABLE: release planning.\n\n## Photo Picker\n- R-010 [PM:picker-single; DR-01b] The Photo Picker has a 「Single」 / 「Batch」 tab at the top; it opens on 「Single」 every time.\n- R-011 [PM:picker-single; DR-13] On 「Single」, choosing one photo opens the existing single-photo Edit Room; that flow is unchanged.\n- R-012 [PM:picker-single; DR-01b, D0-04b] The Launcher 「Edit」 picker and the 「AI Enhance」 shortcut picker carry the same 「Single」 / 「Batch」 tabs.\n- R-013 [PM:picker-batch, pm-decisions; DR-01, D5-01b] Only the 「Batch」 tab allows several photos; at most 20 for Free and Premium users alike, with no IAP at any count (Q2 decided 10/30: no Premium lock day-1, not Meitu's IAP at the 13th photo), and the same on both platforms, so Android is not held to a lower cap.\n- R-014 [PM:picker-batch; D2-01] Selected thumbnails show their selection order 1, 2, 3 …; Batch Edit Room lists the photos in that order.\n- R-015 [PM:picker-batch, entry-enhance-shortcut; DR-01; DS:ds-photo-picker] The bottom bar of the Batch tab shows the hint with the count, 「Select 1 to 20 photos to continue. (n/20)」, and 「Next」 (Design copy; PM draws 「n selected (max 20)」 and 「Done」: Q-1).\n- R-019 [DS:ds-photo-picker] On the Batch tab a tray under the bottom bar lists the selected photos in selection order, each with ✕; ✕ deselects that photo (the tile loses its number, the count drops).\n- R-233 [DS:ds-photo-picker] Every picker tile carries an expand icon at its bottom right that opens the photo large without selecting it (Design draws the icon only; what opens is not stated: Q-13).\n- R-016 [PM:picker-batch-one, batch-one; DR-01b] On the 「Batch」 tab, 「Next」 with only one photo selected opens the single-photo Edit Room.\n- R-017 [PM:picker-batch-one, batch-one; D1-08c, DR-13] In the single-photo Edit Room, Replace photo opens the Photo Picker, where switching to 「Batch」 and choosing several photos goes to Batch Edit Room.\n- R-018 [PM:picker-over-max; DR-01] Selecting a 21st photo is blocked with the toast 「Please pick at most 20 photos.」.\n\n## Entry\n- R-020 [PM:entry-edit; D1-01] From the Launcher 「Edit」 picker, Batch tab → 「Next」 lands on the Batch Edit Room main screen.\n- R-021 [PM:entry-enhance-shortcut, enhance-default; DR-02] From the Launcher 「AI Enhance」 shortcut picker, Batch tab with several photos → 「Next」 lands directly on the Batch Edit Room AI Enhance page.\n- R-022 [PM:entry-batch-shortcut] A Launcher Batch Edit shortcut is planned (its icon is still to be designed, after Meitu); the Launcher drawn has none yet. The deeplink `phd://navigate/page?name=batch_edit` opens Batch Edit; where it lands is not stated (Q-15).\n\n## Batch Edit Room\n- R-030 [PM:room-default; D1-11, D1-01] The main screen looks like the current Edit Room; its bottom bar has only three buttons, in the order 「Crop & Rotate」 → 「Adjustment」 → 「AI Enhance」, each opening a room like the current feature room.\n- R-031 [PM:room-default; D1-11; DS:ds-canvas-img-focus] Top bar: Home and Replace photo at the left; a feedback button (speech bubble with !), Save (unchanged from Edit Room) and a Setting button at the right (the feedback button is drawn by Design only: Q-21).\n- R-032 [PM:room-default; D1-12] A thumbnail strip on the main screen; tapping a thumbnail switches the current photo.\n- R-033 [PM:room-default; D1-09] Photos cannot be removed or added in Batch Edit Room (no × on thumbnails, no add button).\n- R-034 [PM:room-default; D1-08] Home with no edit yet goes straight to the Launcher; after an edit it opens the Discard Dialog, and 「Discard」 goes to the Launcher.\n- R-035 [PM:room-default, leave-flow; D1-08, D1-08b] Replace photo with no edit yet goes straight to the Photo Picker Batch tab; after an edit it opens the Discard Dialog, and 「Discard」 goes to the Photo Picker Batch tab. Both keep the earlier selected photos selected; Discard drops every edit of this Batch Edit.\n- R-036 [PM:room-default; DR-05, DR-05d] The main screen's Undo / Redo keeps one history per photo and acts only on the current photo; one visit to a room ended with ✓ is one step in each changed photo's history.\n- R-037 [PM:room-default, enhance-done; DR-10b, DR-12e] On the main screen, Undo on an enhanced photo returns only that photo to its pre-Enhance state; Redo brings the Enhance result back.\n- R-038 [PM:room-default; DR-10b, DR-12e] After an Enhance was undone, any other edit to that photo clears the Redo: the Enhance result cannot be brought back, but the photo can be enhanced again from the AI Enhance room (R-229).\n- R-039 [PM:room-default] The Setting button's target is not stated (Q-3); the compare button drawn on the photo works as in Edit Room (Q-4).\n\n## Crop & Rotate room\n- R-050 [PM:crop-default; D1-11, DR-03; DS:ds-3, ds-main-down-tool-box] The room matches the current Crop & Rotate room (Rotate, Flip, Flip Vertically, Original, Custom, Square, 2:3, 3:2, 3:4 and more ratios, angle slider, ✕ / undo / redo / ✓), with no title above the tool panel. Its top bar has ‹ at the left, the current photo's pixel size 「W x H」 with a pencil (manual pixel input, R-066) in the middle and 「All」 at the right (‹ beside ✕: Q-22).\n- R-051 [PM:crop-default; DR-04] Top right: an 「Apply to all」 button (icon + 「All」, semi-transparent dark capsule). It is a one-shot button, not a checkbox.\n- R-234 [DS:ds-status] 「All」 has a normal and a greyed (disabled) look; when it is greyed is not stated (Q-16).\n- R-052 [PM:crop-default, crop-applied; DR-04, DR-04c] Tapping 「All」 applies this room's settings from the current photo to every other photo; the screen stays in the room.\n- R-053 [PM:crop-applied; DR-04] After 「All」 the toast 「Applied to x photos」 appears; x = the number of photos other than the current one.\n- R-054 [PM:crop-default, crop-applied; DR-04] The thumbnail strip updates at once to show the applied result on every photo.\n- R-055 [PM:crop-default; DR-04] After applying, tapping a thumbnail switches to that photo to check or fine-tune it; a fine-tune changes only that photo.\n- R-056 [PM:crop-default; DR-04; S3:meitu-conclusion] Changing the source and tapping 「All」 again re-applies the current photo's latest settings to the others, overwriting their earlier crop (recomputed from each original).\n- R-057 [PM:crop-default; DR-07; S3:meitu-conclusion] Apply to all carries the ratio, the rotation angle and the flips; the 「Free」 ratio can be applied too.\n- R-058 [S3:meitu-conclusion] The current (source) photo keeps the box the user adjusted (size and position unchanged).\n- R-059 [S3:meitu-conclusion, meitu-summary] Every other photo gets the largest box of that ratio (one side flush with its original, only the part outside the ratio cut); the box size is not synced (Meitu syncs relative size, PhD does not).\n- R-060 [S3:meitu-conclusion] The largest box of each other photo is placed at the source's relative position: horizontal = left margin ÷ (width − box width), vertical = top margin ÷ (height − box height); 0 = left / top, 0.5 = centre, 1 = right / bottom.\n- R-061 [S3:meitu-conclusion] Only a direction in which a photo's box has room to move takes the relative position; a direction with no room is centred, and a source direction with no room counts as 0.5 (centred). (DR-07 says boxes default to centred on each photo: Q-5.)\n- R-062 [S3:meitu-conclusion] Output size is computed from each original, so the saved photos' pixel sizes differ; this is expected.\n- R-063 [S3:meitu-conclusion] 「Free」 counts as a custom ratio: its ratio and relative position are applied, other photos get the largest box of that ratio.\n- R-064 [S3:meitu-conclusion] 「Original」 applied to all returns each photo to its own original ratio, uncropped.\n- R-065 [S3:meitu-conclusion] A photo whose ratio equals the chosen ratio keeps the whole photo (no crop).\n- R-066 [S3:meitu-conclusion, meitu-cases C12] Manual pixel input accepts 238 px up to the photo's own width / height; a value beyond the range shows a toast and is not taken (Meitu: 「Width and height exceed the range」 with the range under the field; PhD copy: Q-6).\n- R-067 [S3:meitu-conclusion] Apply to all after a manual pixel input applies only its ratio, not the pixel values.\n- R-068 [S3:meitu-conclusion] Rotation applied to all: 90° rotation and horizontal / vertical flips apply to every photo as they are.\n- R-069 [S3:meitu-conclusion] An angle fine-tune applies the same angle to every photo; each photo's box shrinks by its own size to avoid black edges, then the crop rules above apply.\n- R-070 [S3:meitu-cases C1] With Apply to all not tapped, choosing 3:4 on the seascape (2730×1535) gives the largest box 1151×1535, full height, centred, on that photo only.\n- R-071 [S3:meitu-cases C5] Choosing 3:2 on the escalator photo and applying to all gives every photo its own largest 3:2 box, centred.\n- R-072 [S3:meitu-cases C6] Square on the seascape dragged fully left, applied to all: photos with no horizontal room stay centred.\n- R-073 [S3:meitu-cases C7] Square on the 101 photo dragged fully down, applied to all: the escalator photo's box sits low (vertical position synced); the seascape has no vertical room and stays centred.\n- R-074 [S3:meitu-cases C8] Square on the seascape shrunk to 865×865 at the bottom right, applied to all: the seascape keeps 865×865 at the bottom right; the escalator gets 1706×1706 flush with the bottom; the 101 gets 1576×1576 flush with the bottom; the 1:1 tea cup stays whole.\n- R-075 [S3:meitu-cases C9] Square applied from the seascape leaves the 1:1 tea cup uncropped.\n- R-076 [S3:meitu-cases C10] 「Free」 on the escalator dragged to 1236×611 at the top left, applied to all: every other photo gets the largest ≈2:1 box at the top left (not 72 % of its width).\n- R-077 [S3:meitu-cases C11] After all photos are 3:2, 「Original」 on any photo applied to all returns all four to their original ratios.\n- R-080 [PM:crop-default; D1-12] The batch thumbnail strip is shown at the bottom of the room; tapping a thumbnail switches the current photo.\n- R-081 [PM:crop-default; DR-05, DR-05b] The room has one Undo / Redo with one shared history recording, in order, ① Apply to all (several photos at once) and ② a single parameter edit on one photo.\n- R-082 [PM:crop-default; DR-05b] Undo / Redo steps back / forward the latest step: an Apply to all step for all photos together; a single edit only on the photo it was made on, whichever photo is current.\n- R-083 [PM:crop-default; DR-05e] Switching photos does not clear the room's history.\n- R-084 [PM:crop-default; DR-05h] When Undo / Redo changes a single edit of a photo that is not current, t const find=id=>rows.find(r=>r.cur.ID===id);

function body(){

function saveState(){

const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;

function decisions(){
  const out=[];

    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}

function decisionText(){

async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
