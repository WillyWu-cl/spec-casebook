<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Editing Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

ction":"Try to select a second photo","Expected Result":"Only one photo can be chosen on 「Single」 (the first tap opens Edit Room; no multi-select)","Priority":"P2","Spec Ref":"R-013","Notes":""},{"ID":"TC-005","Section":"Photo Picker","Precondition":"Photo Picker from 「Edit」","Action":"Tap 「Batch」 and look at the tab and the bottom bar","Expected Result":"The 「Batch」 tab is highlighted\nA bottom bar shows the hint 「Select 1 to 20 photos to continue. (0/20)」 and 「Next」","Priority":"P1","Spec Ref":"R-012, R-015","Notes":"Design copy; the PM boards draw 「Select 1 to 20 photos.」 / 「n selected (max 20)」 and 「Done」 (Q-1): record the string shown before and after selecting."},{"ID":"TC-006","Section":"Photo Picker","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Gallery holds at least 25 photos of mixed orientation","Action":"On the Launcher tap the 「AI Enhance」 shortcut","Expected Result":"The Photo Picker opens with the same 「Single」 / 「Batch」 tab, 「Single」 selected","Priority":"P1","Spec Ref":"R-012, R-010, R-214","Notes":""},{"ID":"TC-007","Section":"Photo Picker","Precondition":"Photo Picker on 「Batch」","Action":"Tap 3 photos one after another","Expected Result":"Each selected thumbnail shows its order number 1, 2, 3\nThe hint ends 「(3/20)」\nThe tray under the bar lists the 3 photos in that order\n「Next」 is enabled","Priority":"P1","Spec Ref":"R-013, R-014, R-015, R-019","Notes":""},{"ID":"TC-008","Section":"Photo Picker","Precondition":"Photo Picker on 「Batch」 with photos A, B, C selected in that order","Action":"Tap 「Next」 and look at the thumbnail strip of Batch Edit Room","Expected Result":"The strip lists A, B, C in the selection order (not the gallery order)","Priority":"P1","Spec Ref":"R-014","Notes":""},{"ID":"TC-009","Section":"Photo Picker","Precondition":"Photo Picker on 「Batch」 with 3 photos selected (1, 2, 3)","Action":"Tap photo 2 again to deselect it","Expected Result":"Photo 2 is deselected\nRecord whether photo 3 is renumbered to umbnail strip, 「Crop & Rotate」 / 「Adjustment」 / 「AI Enhance」)","Priority":"P1","Spec Ref":"R-020, R-001, R-201, R-225","Notes":""},{"ID":"TC-019","Section":"Entry","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Photo Picker from the 「AI Enhance」 shortcut on 「Batch」 with 3 photos selected (「(3/20)」)","Action":"Tap 「Next」","Expected Result":"Batch Edit Room opens directly on its AI Enhance page (「Enhance」 button, thumbnail strip of the 3 photos)","Priority":"P1","Spec Ref":"R-021, R-001, R-215","Notes":""},{"ID":"TC-020","Section":"Entry","Precondition":"Single-photo Edit Room open on one photo, no edit","Action":"Tap Replace photo, switch the picker to 「Batch」, select 3 photos and tap 「Next」","Expected Result":"The picker allows the 「Batch」 tab and 「Next」 opens Batch Edit Room with the 3 photos","Priority":"P1","Spec Ref":"R-017, R-219","Notes":""},{"ID":"TC-021","Section":"Entry","Precondition":"Single-photo Edit Room open","Action":"Look through every Edit Room tool tab (Quick Action, Edit, Enhance, Portrait …)","Expected Result":"No Batch Edit tool or entry in Edit Room itself","Priority":"P3","Spec Ref":"R-002","Notes":""},{"ID":"TC-022","Section":"Entry","Precondition":"Launcher open","Action":"Look for a Batch Edit shortcut on the Launcher (shortcut row and 「View all」); if there is one, tap it","Expected Result":"Record whether the shortcut exists (its icon is still being designed) and where it lands (expected: the Photo Picker on 「Batch」)","Priority":"P3","Spec Ref":"R-022","Notes":"UI UX flow 2 plans the shortcut and a deeplink (TC-152); landing not stated (Q-15)."},{"ID":"TC-152","Section":"Entry","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Phone on USB","Action":"Open the deeplink phd://navigate/page?name=batch_edit (adb shell am start -a android.intent.action.VIEW -d \"phd://navigate/page?name=batch_edit\")","Expected Result":"PhotoDirector opens on the Batch Edit entry\nRecord where it lands (expected: the ack","Precondition":"Batch enhance processing","Action":"Press system Back","Expected Result":"Processing is not interrupted or cancelled\nThe screen stays under the mask","Priority":"P1","Spec Ref":"R-170, R-121, R-122","Notes":""},{"ID":"TC-144","Section":"Android Back","Precondition":"Confirm Dialog open","Action":"Press system Back","Expected Result":"Same as 「Cancel」: the dialog closes and nothing is processed","Priority":"P2","Spec Ref":"R-170, R-137","Notes":""},{"ID":"TC-145","Section":"Android Back","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Batch Edit Room open with 12 photos, photo 1 cropped to Square and back on the main screen (✓)\n3. Discard Dialog open","Action":"Press system Back","Expected Result":"Same as 「Keep Editing」: stays in Batch Edit Room with the edits","Priority":"P2","Spec Ref":"R-170, R-142","Notes":"Spec silent (Q-11)."},{"ID":"TC-146","Section":"Android Back","Precondition":"Saving in progress","Action":"Press system Back","Expected Result":"Saving is not interrupted\nThe Batch Save page follows","Priority":"P2","Spec Ref":"R-170, R-150","Notes":"Spec silent (Q-11)."},{"ID":"TC-147","Section":"Android Back","Precondition":"Batch Save page","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to Batch Edit Room","Priority":"P2","Spec Ref":"R-170, R-154","Notes":""},{"ID":"TC-148","Section":"Android Back","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Batch Edit Room with 12 photos, photo 1 cropped to Square\n3. Saved\n4. Photo Picker opened by 「Edit Next Batch」","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to Batch Edit Room with the edits (photo 1 still Square), not the Batch Save page","Priority":"P2","Spec Ref":"R-170, R-155, R-235","Notes":""},{"ID":"TC-149","Section":"Android Back","Precondition":"1. Signed in with a PhotoDirector Premium account\n2. Batch Edit Room open with the Section 3 test set in this order: ① escalator 2:3 (1706×2559), ② 101 4:5 (1576×1970), ③ tea cup 1:1 (small), ④ seascape 16:9 (2730×1535)\n3. Crop & Rotate room open\n4. Pixel input open with the keyboard","Action":"Press system Back twice","Expected Result":"The first Back closes the keyboard\nThe second closes the pixel input without applying a value","Priority":"P3","Spec Ref":"R-170, R-066","Notes":""}],"previous":{},"requirements":"# Batch Editing — requirements (android)\nSpec: UI UX flow 2.pdf (PM \"Demo + Spec\", Batch Edit, 26'11/E, re-exported 2026-11-09), Section 3 · 美圖 Apply to all\n實測.pdf (crop Apply to all decision) and the Design Figma frames exported one PDF per frame (`Design - *.pdf`, light and\ndark copies), spec set 2026-11-09.\n\nSource tags: `[PM:\u003cboard>; \u003crule IDs>]`, board IDs from `specs/2026-11-09/extracted/boards.json`, rule IDs as the boards\nprint them (`D1-08`, `DR-05b` …); `[S3:\u003cboard>]` for Section 3 · 美圖 Apply to all 實測. The flow file is PM-owned and also\ncarries the UI; `[DS:\u003cboard>]` = a Design frame (`ds-*` boards, `design-text.md`). UI strings follow the Design frames,\nrules the PM boards; where the two disagree on a rule the question is open and the row says which it follows. Mockups\nare iPhone frames; Android differences are in \"System back\". The Design Figma was read from PDF exports, not through\nFigma (quota ran out mid read: `figma-pending.json`, Q-12). Request ledger: REQ-001 (this table), REQ-003 (this update), REQ-004 (UI copy follows the Design), REQ-011 (v5).\n\n**Also read (REQ-011, 2026-11-11):** the PM and Design Figma pages themselves (PM page 0:1, Design page 12:2321), as the\ntext snapshot of spec set 2026-11-09-figma (re-read 2026-11-11). `[PMF:\u003cboard>; \u003crule IDs>]` = a PM Figma board\n(`specs/2026-11-09-figma/extracted/figma-inventory-pm-*.json`). The PDF export 「UI UX flow 2.pdf」 is an older state\nof that page: it lacks the 【NEW】 「All」 states and the width / height rule (DR-04), the Curve / HSL strip rule (D1-12)\nand has DR-05g before its 2026-11-11 change (KF-005). Where the two differ, the Figma page wins.\n\n## Scope\n- R-001 [PM:overview; D0-04, D0-04b] The feature is named 「Batch Edit」 / 「Batch Edit Room」 and is reached only from the Photo Picker of the Launcher 「Edit」 button and of the Launcher 「AI Enhance」 shortcut.\n- R-002 [PM:overview; D0-04] Edit Room itself offers no Batch Edit tool (its toolbar has no batch entry); the only way from Edit Room is Replace photo → Picker Batch tab (R-017).\n- R-003 [PM:overview, room-default; D0-07, D0-06, DR-03, D1-11] Batch Edit offers only three tools: 「Crop & Rotate」, 「Adjustment」, 「AI Enhance」 (no Filter, no Preset).\n- R-004 [PM:overview, enhance-default; D0-08, D5-01b, DR-11] Batch Edit is free: Crop & Rotate and Adjustment cost nothing and AI Enhance deducts no credits (the credit balance is unchanged after a batch enhance).\n- R-005 [PM:overview; D0-05] Released on iOS and Android together in 26'11/E. — NOT TESTABLE: release planning.\n\n## Photo Picker\n- R-010 [PM:picker-single; DR-01b] The Photo Picker has a 「Single」 / 「Batch」 tab at the top; it opens on 「Single」 every time.\n- R-011 [PM:picker-single; DR-13] On 「Single」, choosing one photo opens the existing single-photo Edit Room; that flow is unchanged.\n- R-012 [PM:picker-single; DR-01b, D0-04b] The Launcher 「Edit」 picker and the 「AI Enhance」 shortcut picker carry the same 「Single」 / 「Batch」 tabs.\n- R-013 [PM:picker-batch, pm-decisions; DR-01, D5-01b] Only the 「Batch」 tab allows several photos; at most 20 for Free and Premium users alike, with no IAP at any count (Q2 decided 10/30: no Premium lock day-1, not Meitu's IAP at the 13th photo), and the same on both platforms, so Android is not held to a lower cap.\n- R-014 [PM:picker-batch; D2-01] Selected thumbnails show their selection order 1, 2, 3 …; Batch Edit Room lists the photos in that order.\n- R-015 [PM:picker-batch, entry-enhance-shortcut; DR-01; DS:ds-photo-picker] The bottom bar of the Batch tab shows the hint with the count, 「Select 1 to 20 photos to continue. (n/20)」, and 「Next」 (Design copy; PM draws 「n selected (max 20)」 and 「Done」: Q-1).\n- R-019 [DS:ds-photo-picker] On the Batch tab a tray under the bottom bar lists the selected photos in selection order, each with ✕; ✕ deselects that photo (the tile loses its number, the count drops).\n- R-233 [DS:ds-photo-picker] Every picker tile carries an expand icon at its bottom right that opens the photo large without selecting it (Design draws the icon only; what opens is not stated: Q-13).\n- R-016 [PM:picker-batch-one, batch-one; DR-01b] On the 「Batch」 tab, 「Next」 with only one photo selected opens the single-photo Edit Room.\n- R-017 [PM:picker-batch-one, batch-one; D1-08c, DR-13] In the single-photo Edit Room, Replace photo opens the Photo Picker, where switching to 「Batch」 and choosing several photos goes to Batch Edit Room.\n- R-018 [PM:picker-over-max; DR-01] Selecting a 21st photo is blocked with the toast 「Please pick at most 20 photos.」.\n\n## Entry\n- R-020 [PM:entry-edit; D1-01] From the Launcher 「Edit」 picker, Batch tab → 「Next」 lands on the Batch Edit Room main screen.\n- R-021 [PM:entry-enhance-shortcut, enhance-default; DR-02] From the Launcher 「AI Enhance」 shortcut picker, Batch tab with several photos → 「Next」 lands directly on the Batch Edit Room AI Enhance page.\n- R-022 [PM:entry-batch-shortcut] A Launcher Batch Edit shortcut is planned (its icon is still to be designed, after Meitu); the Launcher drawn has none yet. The deeplink `phd://navigate/page?name=batch_edit` opens Batch Edit; where it lands is not stated (Q-15).\n\n## Batch Edit Room\n- R-030 [PM:room-default; D1-11, D1-01] The main screen looks like the current Edit Room; its bottom bar has only three buttons, in the order 「Crop & Rotate」 → 「Adjustment」 → 「AI Enhance」, each opening a room like the current feature room.\n- R-031 [PM:room-default; D1-11; DS:ds-canvas-img-focus] Top bar: Home and Replace photo at the left; a feedback button (speech bubble with !), Save (unchanged from Edit Room) and a Setting button at the right (the feedback button is drawn by Design only: Q-21).\n- R-032 [PM:room-default; D1-12] A thumbnail strip on the main screen; tapping a thumbnail switches the current photo.\n- R-033 [PM:room-default; D1-09] Photos cannot be removed or added in Batch Edit Room (no × on thumbnails, no add button).\n- R-034 [PM:room-default; D1-08] Home with no edit yet goes straight to the Launcher; after an edit it opens the Discard Dialog, and 「Discard」 goes to the Launcher.\n- R-035 [PM:room-default, leave-flow; D1-08, D1-08b] Replace photo with no edit yet goes straight to the Photo Picker Batch tab; after an edit it opens the Discard Dialog, and 「Discard」 goes to the Photo Picker Batch tab. Both keep the earlier selected photos selected; Discard drops every edit of this Batch Edit.\n- R-036 [PM:room-default; DR-05, DR-05d] The main screen's Undo / Redo keeps one history per photo and acts only on the current photo; one visit to a room ended with ✓ is one step in each changed photo's history.\n- R-037 [PM:room-default, enhance-done; DR-10b, DR-12e] On the main screen, Undo on an enhanced photo returns only that photo to its pre-Enhance state; Redo brings the Enhance result back.\n- R-038 [PM:room-default; DR-10b, DR-12e] After an Enhance was undone, any other edit to that photo clears the Redo: the Enhance result cannot be brought back, but the photo can be enhanced again from the AI Enhance room (R-229).\n- R-039 [PM:room-default] The Setting button's target is not stated (Q-3); the compare button drawn on the photo works as in Edit Room (Q-4).\n\n## Crop & Rotate room\n- R-050 [PM:crop-default; D1-11, DR-03; DS:ds-3, ds-main-down-tool-box] The room matches the current Crop & Rotate room (Rotate, Flip, Flip Vertically, Original, Custom, Square, 2:3, 3:2, 3:4 and more ratios, angle slider, ✕ / undo / redo / ✓), with no title above the tool panel. Its top bar has ‹ at the left, the current photo's pixel size 「W x H」 with a pencil (manual pixel input, R-066) in the middle and 「All」 at the right (‹ beside ✕: Q-22).\n- R-051 [PM:crop-default; DR-04] Top right: an 「Apply to all」 button (icon + 「All」, semi-transparent dark capsule). It is a one-shot button, not a checkbox; it has a normal and a disabled state (R-234).\n- R-234 [DS:ds-status; PMF:pm-ui-3, pm-ui-4 DR-04 【NEW】] 「All」 (Crop & Rotate and Adjustment) is normal or disabled by the current photo: disabled on entering the room while the current photo has no change; normal once it has a change not yet applied; disabled once applied, until the current photo changes again; on switching photos, set by that photo's own unapplied changes; Undo of the Apply to all step → normal, Redo of it → disabled.\n- R-236 [PMF:pm-ui-3 DR-04 【NEW】] Crop manual size (W x H ✎): with width and height linked, a size-only change keeps the ratio, so there is nothing to apply and 「All」 stays disabled; with them unlinked the ratio changes to 「Free」 (custom) and 「All」 turns normal, applying that Free ratio.\n- R-052 [PM:crop-default, crop-applied; DR-04, DR-04c] Tapping 「All」 applies this room's settings from the current photo to every other photo; the screen stays in the room.\n- R-053 [PM:crop-applied; DR-04] After 「All」 the toast 「Applied to x photos」 appears; x = the number of photos other than the current one.\n- R-054 [PM:crop-default, crop-applied; DR-04] The thumbnail strip updates at once to show the applied result on every photo.\n- R-055 [PM:crop-default; DR-04] After applying, tapping a thumbnail switches to that photo to check or fine-tune it; a fine-tune changes only that photo.\n- R-056 [PM:crop-default; DR-04; S3:meitu-conclusion] Changing the source and tapping 「All」 again re-applies the current photo's latest settings to the others, overwriting their earlier crop (recomputed from each original).\n- R-057 [PM:crop-default; DR-07; S3:meitu-conclusion] Apply to all carries the ratio, the rotation angle and the flips; the 「Free」 ratio can be applied too.\n- R-058 [S3:meitu-conclusion] The current (source) photo keeps the box the user adjusted (size and position unchanged).\n- R-059 [S3:meitu-conclusion, meitu-summary] Every other photo gets the largest box of that ratio (one side flush with its original, only the part outside the ratio cut); the box size is not synced (Meitu syncs relative size, PhD does not).\n- R-060 [S3:meitu-conclusion] The largest box of each other photo is placed at the source's relative position: horizontal = left margin ÷ (width − box width), vertical = top margin ÷ (height − box height); 0 = left / top, 0.5 = centre, 1 = right / bottom.\n- R-061 [S3:meitu-conclusion] Only a direction in which a photo's box has room to move takes the relative position; a direction with no room is centred, and a source direction with no room counts as 0.5 (centred). (DR-07 says boxes default to centred on each photo: Q-5.)\n- R-062 [S3:meitu-conclusion] Output size is computed from each original, so the saved photos' pixel sizes differ; this is expected.\n- R-063 [S3:meitu-conclusion] 「Free」 counts as a custom ratio: its ratio and relative position are applied, other photos get the largest box of that ratio.\n- R-064 [S3:meitu-conclusion] 「Original」 applied to all returns each photo to its own original ratio, uncropped.\n- R-065 [S3:meitu-conclusion] A photo whose ratio equals the chosen ratio keeps the whole photo (no crop).\n- R-066 [S3:meitu-conclusion, meitu-cases C12] Manual pixel input accepts 238 px up to the photo's own width / height; a value beyond the range shows a toast and is not taken (Meitu: 「Width and height exceed the range」 with the range under the field; PhD copy: Q-6).\n- R-067 [S3:meitu-conclusion] Apply to all after a manual pixel input applies only its ratio, not the pixel values.\n- R-068 [S3:meitu-conclusion] Rotation applied to all: 90° rotation and horizontal / vertical flips apply to every photo as they are.\n- R-069 [S3:meitu-conclusion] An angle fine-tune applies the same angle to every photo; each photo's box shrinks by its own size to avoid black edges, then the crop rules above apply.\n- R-070 [S3:meitu-cases C1] With Apply to all not tapped, choosing 3:4 on the seascape (2730×1535) gives the largest box 1151×1535, full height, centred, on that photo only.\n- R-071 [S3:meitu-cases C5] Choosing 3:2 on the escalator photo and applying to all gives every photo its own largest 3:2 box, centred.\n- R-072 [S3:meitu-cases C6] Square on the seascape dragged fully left, applied to all: photos with no horizontal room stay centred.\n- R-073 [S3:meitu-cases C7] Square on the 101 photo dragged fully down, applied to all: the escalator photo's box sits low (vertical position synced); the seascape has no vertical room and stays centred.\n- R-074 [S3:meitu-cases C8] Square on the seascape shrunk to 865×865 at the bottom right, applied to all: the seascape keeps 865×865 at the bottom right; the escalator gets 1706×1706 flush with the bottom; the 101 gets 1576×1576 flush with the bottom; the 1:1 tea cup stays whole.\n- R-075 [S3:meitu-cases C9] Square applied from the seascape leaves the 1:1 tea cup uncropped.\n- R-076 [S3:meitu-cases C10] 「Free」 on the escalator dragged to 1236×611 at the top left, applied to all: every other photo gets the largest ≈2:1 box at the top left (not 72 % of its width).\n- R-077 [S3:meitu-cases C11] After all photos are 3:2, 「Original」 on any photo applied to all returns all four to their original ratios.\n- R-080 [PM:crop-default; D1-12] The batch thumbnail strip is shown at the bottom of the room; tapping a thumbnail switches the current photo.\n- R-081 [PM:crop-default; DR-05, DR-05b] The room has one Undo / Redo with one shared history recording, in order, ① Apply to all (several photos at once) and ② a single parameter edit on one photo.\n- R-082 [PM:crop-default; DR-05b] Undo / Redo steps back / forward the latest step: an Apply to all step for all photos together; a single edit only on the photo it was made on, whichever photo is current.\n- R-083 [PM:crop-default; DR-05e] Switching photos does not clear the room's history.\n- R-084 [PM:crop-default; DR-05h] When Undo / Redo changes a single edit of a photo that is not current, the room switches to that photo (the thumbnail strip selects it).\n- R-085 [PM:crop-default; DR-05c] ✕ drops every change made to every photo since entering the room, Apply to all included.\n- R-086 [PM:crop-default; DR-05d] ✓ returns to Batch Edit Room; the room's changes to each photo are one step in that photo's main-screen history.\n- R-087 [PM:crop-applied; DR-05b; S3:meitu-conclusion] Apply to all is one step of the room history: one Undo takes it back on all photos, one Redo restores it on all (Section 3 「Undo」 rule; whether it also means the main screen: Q-9).\n\n## Adjustment room\n- R-090 [PM:adjust-default; D1-11, DR-03, DR-06] The room matches the 26'10/E Adjustment room (Light / Color / Details), without Subject Detection and without AI Exposure (the Design frames draw 「AI Exposure」 in the tool list: Q-18; rows follow PM).\n- R-230 [DS:ds-9-adjust-hsl, ds-9-adjust-curve, ds-9-adjust-hsl-collapse, ds-9-adjust-curve-collapse; PM:adjust-guideline-note] The Color tab has an HSL panel (「Hue」 / 「Saturation」 / 「Lightness」 sliders and eight colour dots: red, orange, yellow, green, cyan, blue, purple, magenta) and a Curve panel (channel buttons RGB / red / green / blue beside the tone curve), as the current Adjustment room; each panel folds down with a chevron (﹀) and opens again with ︿, and reset and compare sit on the photo.\n- R-231 [PM:adjust-default; DR-04, DR-04c; DS:ds-9-adjust-hsl, ds-9-adjust-curve] 「All」 carries the HSL and Curve values with the rest of the set (the whole set of the room, R-092).\n- R-232 [PM:adjust-guideline-note] PM asks Design for the HSL / Curve layout with the thumbnail strip (the photo gets small) and prefers the proposal 「Adjustment 縮圖列（draft）」: A. thumbnails 50→40 px, strip 62→48 px; B. the strip fades out while a finger holds a slider or a curve point and fades back on release. — NOT TESTABLE: direction only, not drawn yet (Q-17). Decided in the PM Figma (D1-12): R-237, R-238.\n- R-237 [PMF:pm-ui-4 D1-12; DS:9_Adjust_curve, 9_Adjust_HSL] Opening Color › Curve or HSL fades the batch thumbnail strip out; it cannot be tapped (the panel lies over the photo); 「All」 stays shown at the top right.\n- R-238 [PMF:pm-ui-4 D1-12; DS:9_Adjust_curve_collapse, 9_Adjust_HSL_collapse] Collapsing the panel (﹀), or going back to a slider tool such as Exposure, shows the strip again; to switch photos the panel is collapsed first.\n- R-091 [PM:adjust-default; DR-04] Top right: the one-shot 「Apply to all」 button (icon + 「All」, semi-transparent dark capsule, as PDR), not a checkbox.\n- R-092 [PM:adjust-default, adjust-applied; DR-04, DR-04c] Tapping 「All」 applies the whole set of this room's settings from the current photo to every other photo; the screen stays in the room.\n- R-093 [PM:adjust-applied; DR-04] The toast 「Applied to x photos」 appears, x = the photos other than the current one.\n- R-094 [PM:adjust-applied; DR-04] The thumbnail strip shows the applied result.\n- R-095 [PM:adjust-default; DR-04] After applying, a thumbnail switches to that photo; a fine-tune there changes only that photo.\n- R-096 [PM:adjust-default; DR-04, DR-04c] Changing the source and tapping 「All」 again replaces the others' whole set with the source's: e.g. photo 1 Exposure +20 → All → all +20; photo 3 Contrast +10; photo 1 Exposure +30 → All → every other photo equals photo 1 and photo 3 loses its Contrast +10.\n- R-097 [PM:adjust-default; D1-12] The thumbnail strip is at the bottom of the room; tapping switches the current photo.\n- R-098 [PM:adjust-default; DR-05, DR-05b] One shared Undo / Redo history records Apply to all steps and single parameter edits in order.\n- R-099 [PM:adjust-default; DR-05b] Undo / Redo of an Apply to all step affects all photos together; of a single edit, only that photo whichever is current.\n- R-100 [PM:adjust-default; DR-05e] Switching photos does not clear the history.\n- R-101 [PM:adjust-default; DR-05h] Undo / Redo of a single edit on a non-current photo switches to that photo (strip selection follows).\n- R-102 [PM:adjust-default; DR-05c] ✕ drops every change to every photo since entering the room, Apply to all included.\n- R-103 [PM:adjust-default; DR-05d] ✓ returns to Batch Edit Room; the room's changes are one step in each photo's main-screen history.\n- R-104 [PM:adjust-default; PMF:pm-ui-4 DR-05g, changed 2026-11-11] Undo / Redo switches to the Light / Color / Details tab of the value it undoes or redoes, as the Android single Adjustment room (was: no tab switch).\n- R-105 [PM:adjust-applied; DR-05b] Apply to all is one step: Undo takes it back on all photos at once.\n\n## AI Enhance\n- R-110 [PM:enhance-default; DR-09, DR-12a, D1-11, DR-09b] Batch AI Enhance supports only Standard: no Standard / Advanced tab, no scenario / Scene Presets (General, Portrait, Scenery, Pets, Concert, Product, Anime), only one 「Enhance」 button with 「Maximize detaill and clarity with advanced AI.」 (spelling: Q-10).\n- R-111 [PM:enhance-default; DR-09d] The 「Enhance」 button runs the 10/E Standard · Portrait enhancement on each photo.\n- R-112 [PM:enhance-default, confirm-dialog; DR-12h, DR-12] 「Enhance」 applies to all photos of the batch and first opens the AI Enhance Confirm Dialog, every time.\n- R-113 [PM:enhance-default; DR-11, D5-01b] The 「Enhance」 button shows no credit count and no credits are deducted.\n- R-114 [PM:enhance-default; DR-10] Results are applied as soon as they finish; there is no per-photo ✓.\n- R-115 [PM:enhance-default; D1-12] The thumbnail strip is above the 「Enhance」 button; tapping a thumbnail switches the current photo.\n- R-116 [PM:enhance-done; DR-12e, DR-12h] Each visit of the AI Enhance room allows one Enhance, applied to every photo of the batch; after it the button reads 「Enhanced」 and is disabled for the rest of the visit.\n- R-117 [PM:enhance-done] (removed 2026-11-09: UI UX flow 2 dropped 「Undo 退回 Enhance 的照片仍算做過，不能再 Enhance」; R-229 replaces it.) — NOT TESTABLE: no longer a rule.\n- R-229 [PM:enhance-done, room-default; DR-12e, DR-10b] Leaving the AI Enhance room and entering it again allows another Enhance; it processes the current images (results already enhanced are enhanced again, an undone photo from its state now), as in the single Edit Room.\n- R-118 [PM:enhance-done; DR-12b, DR-12f, DR-12g] Advanced-only rules do not apply to batch. — NOT TESTABLE: no Advanced mode in batch (checked as R-110).\n- R-119 [PM:enhance-free, free-user-iap; DR-12d, D3-01, D3-02] A Free user tapping 「Enhance」 goes straight to the existing Premium IAP page; there is no trial of one photo.\n- R-120 [PM:enhance-processing; D1-02] Processing uses the current loading screen with 「Creating Your AI Image」 and 「Enhancing k / N」 (k = finished, N = number of enhance requests); the mask covers the whole screen and the thumbnail strip is under it.\n- R-121 [PM:enhance-processing; D1-02] While processing, the user cannot switch to Crop & Rotate / Adjustment or tap thumbnails until every photo has finished.\n- R-122 [PM:enhance-processing, server-task-notes; D1-03, D1-02] Processing cannot be cancelled and nothing can be saved before it finishes.\n- R-123 [PM:enhance-result, server-task-notes; D1-04; DS:ds-enhance-1-2] Partial failure shows one summary card after every photo has finished (no dialog per photo): 「X completed, Y failed」 and 「Failed photos are marked with ! on the thumbnails.」 (Design copy; the PM state board drops 「with !」); each failed thumbnail has a red ! at its top right, successful ones none; tapping a failed thumbnail switches to it. The card has a ✕ that closes it (Design).\n- R-124 [PM:enhance-result; D1-04, DR-12e] The button reads 「Retry Failed (x)」, x = failed photos; Retry reruns only the failed photos, not the successful ones; the ! of a retried photo disappears; a failed   const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=false,table=null;
  const flush=()=>{if(list){out.push('</ul>');list=false}if(table){out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');table=null}};
  for(const line of src.split(/\r?\n/)){
    const l=line.trim();
    if(/^\|/.test(l)){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(list){out.push('</ul>');list=false}(table??=[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(table)flush();
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){flush();out.push(`<h${Math.min(4,h[1].length+1)}>${inline(h[2])}</h${Math.min(4,h[1].length+1)}>`);continue}
    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}
    flush();if(l)out.push(`<p>${inline(l)}</p>`);
  }
  flush();return out.join('');
}

    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}

    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);

  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
