<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to Video Reuse Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

i and mobile data off\n4. Open video A's Save & Share page","Action":"Tap 「Reuse」","Expected Result":"Image to Video behaves as when it is opened with no network today (same message or state as entering from 「Create more」 offline)\nNo credits are charged","Priority":"P2","Spec Ref":"R-047","Notes":"PM-only: the Design does not draw this. Compare with 「Create more」 offline on the same build"},{"ID":"TC-034","Section":"Error handling","Precondition":"1. Android phone, PhotoDirector signed in\n2. A finished Custom video G made with a model that does not support real people\n3. A photo with a person's face\n4. Open its Save & Share page","Action":"1. Tap 「Reuse」\n2. Add the photo with a face\n3. Tap 「Generate」","Expected Result":"「The photo you uploaded includes a real person, which isn't supported by the selected model.」 shows, as today\nNo credits are charged","Priority":"P2","Spec Ref":"R-048","Notes":"PM-only: the Design does not draw this. Which model: Q-12"},{"ID":"TC-035","Section":"Error handling","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. A Free account with fewer credits than 「Generate」's price\n4. Open video A's Save & Share page","Action":"1. Tap 「Reuse」\n2. Add a photo\n3. Tap 「Generate」","Expected Result":"The Upgrade to Premium path shows, as today\nNo credits are charged","Priority":"P2","Spec Ref":"R-049","Notes":"PM-only: the Design does not draw this. KP-012"},{"ID":"TC-036","Section":"Error handling","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. A VIP account with fewer credits than 「Generate」's price\n4. Open video A's Save & Share page","Action":"1. Tap 「Reuse」\n2. Add a photo\n3. Tap 「Generate」","Expected Result":"「More Credits Required」 shows, as today\nNo credits are charged","Priority":"P2","Spec Ref":"R-050","Notes":"PM-only: the Design does not draw this. Needs a VIP account with low credits; KP-012"},{"ID":"TC-037","Section":"Tracking events","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. The analytics event log open","Action":"Open video A's Save & Share page and tap 「Reuse」","Expected Result":"ImageToVideo_Reuse_Click is sent with model = Kling 2.6's model value","Priority":"P3","Spec Ref":"R-051","Notes":"PM-only: the Design does not draw this. Parked until an event log is available (Q-8)"},{"ID":"TC-038","Section":"Tracking events","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page and tap 「Reuse」 (from the Image to Video tab)\n4. A photo added\n5. The analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = artwork_reuse","Priority":"P3","Spec Ref":"R-052","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-039","Section":"Tracking events","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A from My AI Artwork › Recent (Video filter), tap 「Reuse」 and add a photo\n4. The analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = artwork_reuse","Priority":"P3","Spec Ref":"R-053","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-040","Section":"Tracking events","Precondition":"1. Android phone, PhotoDirector signed in\n2. In My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab, tap 「Create more」 and add a photo\n3. The analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = Artwork","Priority":"P3","Spec Ref":"R-054","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-043","Section":"Android system Back","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page and tap 「Reuse」","Action":"Press system Back","Expected Result":"Video A's 「Save & Share」 page shows again, as with ‹","Priority":"P2","Spec Ref":"R-058","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-044","Section":"Android system Back","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page from My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab","Action":"Press system Back","Expected Result":"My AI Artwork opens on the 「Image to Video」 tab, as with ‹","Priority":"P2","Spec Ref":"R-059","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-045","Section":"Android system Back","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page and tap 「Reuse」\n4. Tap the prompt box so the keyboard opens","Action":"Press system Back","Expected Result":"The keyboard closes and the room stays open with video A's prompt unchanged","Priority":"P2","Spec Ref":"R-060","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-046","Section":"Android system Back","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. The state of TC-015 (the explanation sheet shows on entry)\n4. Open video A's Save & Share page and tap 「Reuse」","Action":"Press system Back while the explanation sheet shows","Expected Result":"Record what happens\nExpected (Q-9): the sheet closes, the Custom page shows video A's settings and 「Settings applied」 appears","Priority":"P3","Spec Ref":"R-061","Notes":"PM-only: the Design does not draw this. Spec silent: Q-9"},{"ID":"TC-047","Section":"Android: credits and artwork","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page and tap 「Reuse」","Action":"Tap the history button at the top right","Expected Result":"My AI Artwork opens with the 「Image to Video」 tab selected","Priority":"P3","Spec Ref":"R-056","Notes":"PM-only: the Design does not draw this. KP-026"},{"ID":"TC-048","Section":"Android: credits and artwork","Precondition":"1. Android phone, PhotoDirector signed in\n2. My AI Artwork (Launcher › AI Photos › My Artwork, top right) › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt\n3. Open video A's Save & Share page and tap 「Reuse」","Action":"Tap the credit button at the top","Expected Result":"It showed the account's balance, and Buy Credit opens","Priority":"P3","Spec Ref":"R-057","Notes":"PM-only: the Design does not draw this. KP-020"}],"previous":{},"requirements":"# Image to Video Reuse — requirements (android)\nSpec: Image to Video Reuse - PM Figma 6336-3478.md (text of the PM Figma page\nhttps://www.figma.com/design/lSk4JUgbXG3DjauMLS9Et7/Image-to-Video?node-id=6336-3478, re-read 2026-11-06) and\nImage to Video Reuse - Design Figma 4701-15518.md (text of the Design page 「261105_support to reuse model settings」\nhttps://www.figma.com/design/VU8bgYiFHTWhYddg7ciqtL/Image-to-video---Character-motion-swap?node-id=4701-15518, read 2026-11-06). Figma-only spec set, no PDF.\n\nThe Design draws only Save & Share and My AI Artwork, in light and dark, with no arrows or notes. Everything else\n(the reused room, the toasts, the removed model, errors, tracking) stays PM-only (pass 7) and its strings are checked\nagain if the Design draws them. Bracketed decision ids ([D1-04]) are the PM's own.\n\n## Scope and entry\n- R-001 [PM:pm-header D0-04] Reuse on a video's Save & Share page brings back the whole generation setting set (model, Duration, Video Quality, Generate Sound by AI and the prompt), not only the prompt text as the old Prompt Reuse did.\n- R-002 [PM:pm-flow Overview D0-03] The only entry is the video-level 「Reuse」 on the Save & Share page: My AI Artwork shows no reuse list and no other reuse entry.\n- R-003 [PM:pm-flow Overview D0-05] The button is named 「Reuse」 and appears on the Save & Share page reached from the My AI Artwork 「Image to Video」 tab and from Recent (Video).\n- R-004 [PM:pm-flow Overview D0-06; PM:pm-ui template_video D0-06] Only Custom videos: a Template video's Save & Share page shows no 「Reuse」 and no 「Prompts & Settings」, as today.\n- R-005 [PM:pm-flow Overview D0-06, D0-06b] Custom videos made with the 10/E Start/End frame option are in scope: their Save & Share page shows 「Prompts & Settings」 and 「Reuse」.\n\n## My AI Artwork — Image to Video tab\n- R-006 [PM:pm-ui My AI Artwork D0-07] The Image to Video tab is the same as today: 「Create more」 is its only creation button.\n- R-007 [DS:d-artwork-light; PM:pm-ui Save & Share D1-07] The list tiles get no Reuse or other new button.\n- R-008 [PM:pm-ui Save & Share D1-01; PM:pm-ui My AI Artwork D1-01] Tapping a finished Custom video in the Image to Video tab opens its Save & Share page with 「Prompts & Settings」 and 「Reuse」.\n- R-009 [PM:pm-ui Save & Share D0-05, D1-01] Tapping a finished Custom video in Recent (Video) opens the same Save & Share page with 「Prompts & Settings」 and 「Reuse」.\n\n## Save & Share — Prompts & Settings\n- R-010 [DS:d-save-share-light; PM:pm-ui Save & Share D0-04b, D1-10] The Prompts area's title is 「Prompts & Settings」.\n- R-011 [DS:d-save-share-light; PM:pm-ui Save & Share D0-04b] The page has exactly one 「Reuse」: the old Prompt Reuse row is replaced by it, not shown beside it.\n- R-012 [DS:d-save-share-light; PM:pm-ui Save & Share D2-01] The section is a card: the model's icon and name with 「Reuse」 at the right of the same row, under them one chip each for Duration, Quality and Sound (sample 「10s」 「Pro」 「Sound on」, Q-13), and under the chips the video's prompt.\n- R-067 [DS:d-save-share-light] On a Custom video's page the order is 「Save」, 「More Video Editing Tools」, 「Add Text」 「Add Sticker」 「Add Music」, 「Prompts & Settings」, 「Share to」.\n- R-068 [DS:d-save-share-dark] In dark mode the 「Prompts & Settings」 card follows the dark frame: the title, model name, chips, prompt and 「Reuse」 are readable on the dark background (Q-16).\n- R-013 [PM:pm-ui Save & Share D2-03] Only Custom videos that generated successfully show 「Prompts & Settings」 and 「Reuse」; processing and failed jobs do not.\n- R-014 [PM:pm-ui Save & Share D2-03b; PM:pm-draft-tbd Q1] Custom videos generated before 4/E show no 「Reuse」 on day 1 (RD to confirm).\n- R-015 [PM:pm-draft-tbd Q2 D2-07] A Custom video whose full settings cannot be read (made on the other platform, or after a reinstall) shows no 「Reuse」 on day 1 (RD to confirm).\n\n## Reuse into Image to Video Custom\n- R-016 [PM:pm-ui Save & Share D1-04] Tapping 「Reuse」 opens Image to Video with the 「Custom」 tab selected.\n- R-017 [PM:pm-ui From Save & Share Reuse D2-01] The model the video was made with is selected.\n- R-018 [PM:pm-ui From Save & Share Reuse D2-01] The video's Duration is selected.\n- R-019 [PM:pm-ui From Save & Share Reuse D2-01] The video's Video Quality is selected.\n- R-020 [PM:pm-ui From Save & Share Reuse D2-01] Generate Sound by AI is set as it was for the video.\n- R-021 [PM:pm-ui From Save & Share Reuse D2-01, D0-06b] The 「Specify Video Start / End」 switch is set as it was for the video.\n- R-022 [PM:pm-ui From Save & Share Reuse D2-01; PM:pm-flow D1-04] The video's prompt is filled in the prompt box, with its character counter (mockup 「58/2,500」).\n- R-023 [PM:pm-ui From Save & Share Reuse D2-01; PM:pm-flow D1-04] The photo is not brought back: 「Add your images」 is empty.\n- R-024 [PM:pm-ui From Save & Share Reuse D2-01] The Inspiration is not brought back: no inspiration is selected under 「Try with inspirations」.\n- R-025 [PM:pm-flow D1-04; PM:pm-ui From Save & Share Reuse D1-04b] On entering, the toast 「Settings applied」 shows on the Custom page.\n- R-026 [PM:pm-ui From Save & Share Reuse D1-04b] When Image to Video would show its Android explanation sheet (intro), it shows first as today, and 「Settings applied」 shows only once the Custom page is visible.\n- R-027 [PM:pm-ui From Save & Share Reuse D1-08] The toast takes priority over a panel (Q-4).\n- R-028 [PM:pm-ui From Save & Share Reuse D3-01] Reuse charges no credits.\n- R-029 [PM:pm-ui From Save & Share Reuse D3-02] 「Generate」 shows the reused model's current credit price.\n- R-030 [PM:pm-ui From Save & Share Reuse D3-03; KB: KP-016] Free trial works as in Image to Video Custom: a user with the free trial sees it in the reused room as in a Custom room opened by Create more.\n\n## In the room after Reuse\n- R-031 [PM:pm-ui From Save & Share Reuse D1-06] Switching models in the room keeps the settings as the 4/E rule does; values the new model does not support go back to that model's defaults.\n- R-032 [PM:pm-ui From Save & Share Reuse D1-06] Leaving the room resets it, as Image to Video Custom does: the next Custom room opened by 「Create more」 has the default model and settings and an empty prompt.\n- R-033 [PM:pm-ui From Save & Share Reuse D1-05] ‹ Back in the reused room returns to the Save & Share page.\n- R-034 [PM:pm-flow arrow 「‹ back --> My AI Artwork」] ‹ Back on the Save & Share page returns to My AI Artwork (Image to Video tab).\n\n## Generate from Reuse\n- R-035 [PM:pm-ui From Save & Share Reuse D4-01] Generate is sent under the reused model's existing action ID.\n- R-036 [PM:pm-ui From Save & Share Reuse D3-02; KB: KP-017] Generate charges the price 「Generate」 showed, and Buy Credit › Detail lists the use under Image to Video with that amount.\n- R-037 [PM:pm-flow Artwork mockup; KB: KP-029] The new job appears in My AI Artwork › Image to Video as a Processing tile showing the source photo, and becomes a finished Custom video.\n- R-038 [PM:pm-header D0-04; Rule pass 10] The new video is made with the reused settings: its length is the reused Duration and it has sound only when Generate Sound by AI was on.\n- R-039 [PM:pm-ui From Save & Share Reuse D2-01; KB: KP-036] The reused prompt is the prompt sent to the generator.\n- R-040 [KB: KP-019] Rapid taps on 「Generate」 in the reused room charge once and start one job.\n\n## Create more (unchanged)\n- R-041 [PM:pm-ui My AI Artwork D1-03, D0-03; PM:pm-flow D1-03] 「Create more」 opens the Custom tab with the default model (mockup 「Kling 3.0」), the placeholder prompt 「Describe the subject, action, and overall scene, e.g. A woman walking in a park on a sunny afternoon.」, 「0/2,500」, no 「Settings applied」 toast and no reuse list.\n\n## Model no longer available\n- R-042 [PM:pm-ui Model 已下架 D2-02] 「Reuse」 can still be tapped on a video whose model was removed; the room opens with the default model.\n- R-043 [PM:pm-ui Model 已下架 D2-02] The other parameters come along where the default model supports them, else they take its defaults (4/E model-switch rule).\n- R-044 [PM:pm-ui Model 已下架 D2-02b, D1-09] Entering shows the toast 「This model is no longer available.」 / 「Switched to recommended model.」 on two lines, and not 「Settings applied」.\n- R-045 [PM:pm-ui Model 已下架 D3-04; PM:pm-error-handling] 「Generate」 charges the default model's current price under its action id.\n\n## Error handling\n- R-046 [PM:pm-error-handling D2-05] A reused prompt longer than the current model's limit (Android limit 500) is brought back whole; the box and the counter turn red and 「Generate」 is disabled, as today; no credits are charged.\n- R-047 [PM:pm-error-handling D2-06] Reuse with no network behaves as opening Image to Video with no network today; no credits are charged.\n- R-048 [PM:pm-error-handling D2-08] After Reuse to a model that does not support real people, a photo with a face shows 「The photo you uploaded includes a real person, which isn't supported by the selected model.」, as today; no credits are charged.\n- R-049 [PM:pm-error-handling D2-08; KB: KP-012] Not enough credits, Free user: 「Generate」 leads to Upgrade to Premium, as today; no credits are charged.\n- R-050 [PM:pm-error-handling D2-08; KB: KP-012] Not enough credits, subscriber (VIP): 「Generate」 leads to 「More Credits Required」, as today; no credits are charged.\n\n## Tracking events\n- R-051 [PM:pm-tracking D4-05] Tapping 「Reuse」 sends the new event ImageToVideo_Reuse_Click with parameter `model`.\n- R-052 [PM:pm-tracking D4-02, D4-03] Generate after Reuse from the Image to Video tab's Save & Share sends ImageToVideo_Result_Generate with from = artwork_reuse (on Android an existing value).\n- R-053 [PM:pm-tracking D4-02] Generate after Reuse from a Save & Share page opened from Recent (Video) sends from = artwork_reuse (Recent is not split out).\n- R-054 [PM:pm-tracking D4-02] Generate after 「Create more」 sends from = Artwork, as today.\n- R-055 [PM:pm-tracking D0-02, D4-03] Success metric and naming rule (three PascalCase parts, snake_case parameters) — NOT TESTABLE: analytics rules for RD; the event names are checked by R-051 to R-054.\n\n## Android: credits and artwork (domain rules)\n- R-056 [KB: KP-026] The history button at the reused room's top right opens My AI Artwork with the Image to Video tab selected.\n- R-057 [KB: KP-020] The credit button at the reused room's top shows the account's balance and opens Buy Credit.\n\n## Android system Back (pass 8, REQ-051 rule)\n- R-058 [Rule pass 8: system Back; PM:pm-ui D1-05] System Back in the reused room does what ‹ does: back to the Save & Share page.\n- R-059 [Rule pass 8: system Back; PM:pm-flow arrow] System Back on the Save & Share page does what ‹ does: back to My AI Artwork.\n- R-060 [Rule pass 8: system Back] System Back while the prompt keyboard is open in the reused room closes the keyboard first and keeps the prompt.\n- R-061 [Rule pass 8: system Back] System Back on the Android explanation sheet shown after Reuse: the spec does not say what it does (Q-9); the row records it.\n\n## Open questions\n- Q-1 The Design does not draw the reused room or its toasts, so 「Settings applied」 and the removal toast still come from the PM mockups only. 「Prompts & Settings」 and 「Reuse」 are now confirmed by the Design. Assumption: the PM strings are expected until the Design draws them. R-025, R-044; TC-010, TC-029.\n- Q-2 Which videos count as made 「before 4/E」? The PM's own draft question Q1 waits for RD (meeting 2026-10-28) and no build or date is given. Assumption: a Custom video generated on a build older than 4/E shows no 「Reuse」. R-014; TC-041.\n- Q-3 Videos whose settings cannot be read. The PM draft Q2 suggests 「do not bring in the default model setting」 but its day-1 line says 「no Reuse」. Assumption: day 1 shows no 「Reuse」 for such a video (made on iOS, or before a reinstall). R-015; TC-042.\n- Q-4 「toast 優先於 panel」: which panel, and what does priority mean? Assumption: when a panel is open or opens as the room appears, 「Settings applied」 still shows on top of it and is not hidden by it. R-027; TC-016.\n- Q-5 Back from a Save & Share page opened from Recent (Video): the PM arrow draws only the Image to Video tab path. Assumption: ‹ returns to where the page was opened (Recent). R-034, R-059; TC-009, TC-044.\n- Q-6 The 「model_sunset」 mockup shows an empty prompt and placeholder, while the rule says the other parameters come along. Assumption: the prompt is brought back (R-043) and the empty box in the mockup is a drawing shortcut. R-043; TC-030.\n- Q-7 「Android 上限 500」 names no model. Assumption: the over-limit case is reached by reusing a video with a prompt over 500 characters and switching to (or landing on, after a removal) a model whose limit is 500. R-046; TC-032.\n- Q-8 How are tracking events observed on Android? Assumption: rows wait for an event log (Mixpanel debug view or a log pull) and are parked until one is set up. R-051 to R-054; TC-037 to TC-040.\n- Q-9 What system Back does on the Android explanation sheet is not stated. Assumption: it closes the sheet like its own close and leaves the reused room with the settings applied and the toast shown. R-061; TC-046.\n- Q-10 The chips for a model without a Quality or Sound option are not drawn. Assumption: the card shows chips only for the settings the model has, in the order Duration, Quality, Sound. R-012; TC-012.\n- Q-11 A video made from an inspiration: is the prompt text kept while only the inspiration selection is dropped? Assumption: yes, the prompt text comes back and no inspiration is selected. R-024; TC-014.\n- Q-12 Which model does not support real people, and which are the 10 models? Not listed. Assumption: the tester finds the model from the app's current behaviour (the message shows today) and records its name. R-048; TC-034.\n- Q-13 The Sound chip reads 「Soound on」 in the Design, a likely typo, and the PM wrote 「Sound On」. Assumption: the app shows 「Sound on」, with a lower-case 「on」 as the Design has it. R-012; TC-006.\n- Q-14 The Design's My AI Artwork frames look copied from an older page: the selected tab is 「Character Motion Swap」 with no 「Image to Video」 tab, and the failed tile has 「Resume to Upload」, while the PM draws an 「Image to Video」 tab and failed tiles with 「Retry」, 「Report」 and 「View Details」. The PM says this page stays as today. Assumption: the PM holds, and the first run confirms it on the device. R-006, R-008, R-013; TC-001, TC-002, TC-004.\n- Q-15 The PM's Save & Share mockup has a home button at the top right; the Design shows only ‹. Assumption: the page keeps whatever it has today, so no row presses it. No row depends on this. R-067; TC-049.\n- Q-16 Does PhotoDirector Android have a dark mode for this page, and how is it turned on? The Design draws dark frames but no spec says how they are reached. Assumption: it follows the phone's dark theme; if the app has no dark mode the row is retired. R-068; TC-050.\n\n## Added 2026-11-04 — coverage passes and standing inputs\n\n### Flow arrows walked by existing rows\nThe PM draws its arrows as frames named 「\u003cfrom> --> \u003cto>」 (legend: blue = forward, red = return); they are listed by hand in `arrows.json`.\n- R-062 [PM: flow arrow 6366:5631 https://www.figma.com/design/lSk4JUgbXG3DjauMLS9Et7/Image-to-Video?node-id=6366-5631] Custom video tile → Save & Share · Reuse: the Save & Share page with 「Prompts & Set     for(const r of rs){

      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">${T('keep')??'Keep'}</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">${T('delete')??'Delete'}</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">${T('noMatch')??'No cases match these filters.'}</td></tr>`;
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm(T('removeConfirm')??'Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('select').forEach(el=>{if(REVIEW)bindField(el)});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function saveState(){
  if(!REVIEW||!D.save)return;
  // a working copy of the approved table: nothing to save until something changed (a real draft can be approved as it is)
  const none=/^edit-/.test(D.draft)&&rows.every(r=>state(r)==='kept')&&!liveNotes().length;
  $('#save').disabled=none;$('#save').title=none?'Nothing has changed yet':'';
}
function counts(){
  saveState();
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  if(L==='zh'){$('#counts').innerHTML=REVIEW?T('counts',fin,c('kept'),c('edited'),c('added'),c('deleted'),nn):T('countsView',rows.length);return}
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
