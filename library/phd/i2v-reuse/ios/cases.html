ompt. Open video A's Save & Share page and tap 「Reuse」. In a second Custom room opened by 「Create more」, note the price 「Generate」 shows for Kling 2.6 with the same settings","Action":"Look at 「Generate」 in the reused room","Expected Result":"「Generate」 shows the same current price as Kling 2.6 with these settings in a fresh Custom room (mockup 「30」)","Priority":"P1","Spec Ref":"R-029","Notes":"PM-only: the Design does not draw this. Credit numbers are binding; the mockup 「30」 is sample"},{"ID":"TC-019","Section":"Reuse into Image to Video Custom","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; an account that has the Image to Video free trial today","Action":"1. Open video A's Save & Share page\n2. Tap 「Reuse」\n3. Look at 「Generate」","Expected Result":"「Generate」 shows the free trial as a Custom room opened by 「Create more」 does; after the free use it never shows the free trial again","Priority":"P2","Spec Ref":"R-030","Notes":"PM-only: the Design does not draw this. Needs an account with the free trial (fixtures.md); KP-016"},{"ID":"TC-020","Section":"In the room after Reuse","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」","Action":"Tap ‹ at the top left","Expected Result":"Video A's 「Save & Share」 page shows again","Priority":"P1","Spec Ref":"R-033, R-064","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-021","Section":"In the room after Reuse","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」","Action":"1. Tap 「Model」\n2. Choose another model\n3. Open its settings\n4. Switch back to Kling 2.6","Expected Result":"The other model keeps the reused settings it supports and shows its defaults for the rest (the 4/E model-switch rule); back on Kling 2.6 the settings follow the same rule","Priority":"P2","Spec Ref":"R-031","Notes":"PM-only: the Design does not draw this. 4/E model-switch rule as in Image to Video Custom today"},{"ID":"TC-022","Section":"In the room after Reuse","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」","Action":"1. Tap ‹ twice (back to My AI Artwork)\n2. Tap 「Create more」","Expected Result":"The Custom room has the default model and settings, the placeholder prompt and 「0/2,500」, and no 「Settings applied」","Priority":"P2","Spec Ref":"R-032, R-041","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-023","Section":"Generate from Reuse","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」; enough credits for one Kling 2.6 video. Note the balance and 「Generate」's price","Action":"1. Add a photo under 「Add your images」\n2. Tap 「Generate」\n3. Open My AI Artwork › 「Image to Video」","Expected Result":"The balance drops by the price 「Generate」 showed; a new 「Processing...」 tile appears; video A is still listed","Priority":"P1","Spec Ref":"R-036, R-037","Notes":"PM-only: the Design does not draw this. Full video generation (credits). Video A still listed: KP-083 risk"},{"ID":"TC-024","Section":"Generate from Reuse","Precondition":"The video from TC-023 has finished","Action":"1. Play the new video\n2. Open its Save & Share page","Expected Result":"The video is 10 s long with AI sound; its 「Prompts & Settings」 card shows 「Kling 2.6」 with the chips 「10s」, 「Pro」 and 「Sound on」, and video A's prompt","Priority":"P1","Spec Ref":"R-038, R-037, R-012","Notes":"Check the length on the player or the saved file"},{"ID":"TC-025","Section":"Generate from Reuse","Precondition":"TC-023 done","Action":"Open the credit usage history (Mine › My Credits)","Expected Result":"The newest entry names Image to Video with the amount TC-023 charged","Priority":"P2","Spec Ref":"R-036, R-035","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-026","Section":"Generate from Reuse","Precondition":"TC-023 done; app log collection on (PhotoDirector log pull not set up yet)","Action":"Pull the app log and find the Image to Video generate request","Expected Result":"The request carries Kling 2.6's existing action ID and video A's prompt; the video follows that prompt","Priority":"P2","Spec Ref":"R-035, R-039","Notes":"PM-only: the Design does not draw this. Parked until a log pull is set up ("},{"ID":"TC-028","Section":"Create more (unchanged)","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt","Action":"In My AI Artwork › 「Image to Video」 tab, tap 「Create more」","Expected Result":"Image to Video opens on the 「Custom」 tab with the default model (mockup 「Kling 3.0」), the placeholder 「Describe the subject, action, and overall scene, e.g. A woman walking in a park on a sunny afternoon.」, 「0/2,500」, no 「Settings applied」 and no list of videos to reuse","Priority":"P1","Spec Ref":"R-041, R-002, R-066","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-029","Section":"Model no longer available","Precondition":"iPhone, PhotoDirector signed in; a finished Custom video E whose model has since been removed from Image to Video. Open its Save & Share page","Action":"Tap 「Reuse」","Expected Result":"The room opens with the default model and the toast shows 「This model is no longer available.」 and 「Switched to recommended model.」 on two lines; 「Settings applied」 does not show","Priority":"P1","Spec Ref":"R-042, R-044","Notes":"PM-only: the Design does not draw this. Needs a removed-model fixture from RD"},{"ID":"TC-030","Section":"Model no longer available","Precondition":"As TC-029, the room open after the removal toast","Action":"Open the model settings and look at the prompt box","Expected Result":"Settings the default model supports keep video E's values, the others show the default model's defaults; the prompt box holds video E's prompt","Priority":"P2","Spec Ref":"R-043","Notes":"PM-only: the Design does not draw this. Mockup shows an empty prompt: Q-6"},{"ID":"TC-031","Section":"Model no longer available","Precondition":"As TC-029; a photo added; enough credits; note the balance and 「Generate」's price","Action":"1. Tap 「Generate」\n2. Open the credit usage history (Mine › My Credits)","Expected Result":"The balance drops by the default model's current price, the price 「Generate」 showed; Detail lists it under Image to Video","Priority":"P1","Spec Ref":"R-045","Notes":"PM-only: the Design does not draw this. Needs a removed-model fixture; full video generation (credits)"},{"ID":"TC-032","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; a finished Custom video F whose prompt is longer than another model's limit, made with a model that allows it. Open its Save & Share page","Action":"1. Tap 「Reuse」\n2. Switch to a model with a lower limit\n3. Delete text until the counter is at the limit","Expected Result":"At step 2 the whole prompt stays in the box, the box and the counter turn red and 「Generate」 is disabled; at step 3 the red goes and 「Generate」 is enabled; no credits are charged","Priority":"P2","Spec Ref":"R-046","Notes":"PM-only: the Design does not draw this. iOS limit and model: Q-7"},{"ID":"TC-033","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; Wi-Fi and mobile data off. Open video A's Save & Share page","Action":"Tap 「Reuse」","Expected Result":"Image to Video behaves as when it is opened with no network today (same message or state as entering from 「Create more」 offline); no credits are charged","Priority":"P2","Spec Ref":"R-047","Notes":"PM-only: the Design does not draw this. Compare with 「Create more」 offline on the same build"},{"ID":"TC-034","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; a finished Custom video G made with a model that does not support real people; a photo with a person's face. Open its Save & Share page","Action":"1. Tap 「Reuse」\n2. Add the photo with a face\n3. Tap 「Generate」","Expected Result":"「The photo you uploaded includes a real person, which isn't supported by the selected model.」 shows, as today; no credits are charged","Priority":"P2","Spec Ref":"R-048","Notes":"PM-only: the Design does not draw this. Which model: Q-12"},{"ID":"TC-035","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; a Free account with fewer credits than 「Generate」's price. Open video A's Save & Share page","Action":"1. Tap 「Reuse」\n2. Add a photo\n3. Tap 「Generate」","Expected Result":"The Upgrade to Premium path shows, as today; no credits are charged","Priority":"P2","Spec Ref":"R-049","Notes":"PM-only: the Design does not draw this"},{"ID":"TC-036","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; a Pro account with fewer credits than 「Generate」's price. Open video A's Save & Share page","Action":"1. Tap 「Reuse」\n2. Add a photo\n3. Tap 「Generate」","Expected Result":"「More Credits Required」 shows, as today; no credits are charged","Priority":"P2","Spec Ref":"R-050","Notes":"PM-only: the Design does not draw this. Needs a Pro account with low credits (Launcher › Pink › ☰ › [0] IAP › Status = Pro)"},{"ID":"TC-052","Section":"Error handling","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; a Pro+ account with fewer credits than 「Generate」's price. Open video A's Save & Share page","Action":"1. Tap 「Reuse」\n2. Add a photo\n3. Tap 「Generate」","Expected Result":"「More Credits Required」 shows, as today; no credits are charged","Priority":"P2","Spec Ref":"R-050","Notes":"PM-only: the Design does not draw this. Needs a Pro+ account with low credits (Launcher › Pink › ☰ › [0] IAP › Status = Pro+)"},{"ID":"TC-037","Section":"Tracking events","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt; the analytics event log open","Action":"Open video A's Save & Share page and tap 「Reuse」","Expected Result":"ImageToVideo_Reuse_Click is sent with model = Kling 2.6's model value","Priority":"P3","Spec Ref":"R-051","Notes":"PM-only: the Design does not draw this. Parked until an event log is available (Q-8)"},{"ID":"TC-038","Section":"Tracking events","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」 (from the Image to Video tab); a photo added; the analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = artwork_reuse","Priority":"P3","Spec Ref":"R-052","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-039","Section":"Tracking events","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A from My AI Artwork › Recent (Video filter), tap 「Reuse」 and add a photo; the analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = artwork_reuse","Priority":"P3","Spec Ref":"R-053","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-040","Section":"Tracking events","Precondition":"iPhone, PhotoDirector signed in. In My AI Artwork › 「Image to Video」 tab, tap 「Create more」 and add a photo; the analytics event log open","Action":"Tap 「Generate」","Expected Result":"ImageToVideo_Result_Generate is sent with from = Artwork","Priority":"P3","Spec Ref":"R-054","Notes":"PM-only: the Design does not draw this. Parked (Q-8); full video generation (credits)"},{"ID":"TC-047","Section":"Credits and artwork","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」","Action":"Tap the history button at the top right","Expected Result":"It opens what it opens in a Custom room opened by 「Create more」","Priority":"P3","Spec Ref":"R-056","Notes":"PM-only: the Design does not draw this. Compare with 「Create more」 on the same build"},{"ID":"TC-048","Section":"Credits and artwork","Precondition":"iPhone, PhotoDirector signed in; My AI Artwork › 「Image to Video」 tab holds a finished Custom video A made with Kling 2.6, 10s, Pro, Generate Sound by AI On, Start/End Off and a typed prompt. Open video A's Save & Share page and tap 「Reuse」","Action":"Tap the credit button at the top","Expected Result":"It showed the account's balance, and it opens what it opens in a Custom room opened by 「Create more」","Priority":"P3","Spec Ref":"R-057","Notes":"PM-only: the Design does not draw this. Compare with 「Create more」 on the same build"}],"previous":{},"requirements":"# Image to Video Reuse — requirements (ios)\nSpec: Image to Video Reuse - PM Figma 6336-3478.md (text of the PM Figma page\nhttps://www.figma.com/design/lSk4JUgbXG3DjauMLS9Et7/Image-to-Video?node-id=6336-3478, re-read 2026-11-06) and\nImage to Video Reuse - Design Figma 4701-15518.md (text of the Design page 「261105_support to reuse model settings」\nhttps://www.figma.com/design/VU8bgYiFHTWhYddg7ciqtL/Image-to-video---Character-motion-swap?node-id=4701-15518, read 2026-11-06). Figma-only spec set, no PDF.\n\nThe Design draws only Save & Share and My AI Artwork, in light and dark, with no arrows or notes. Everything else\n(the reused room, the toasts, the removed model, errors, tracking) stays PM-only (pass 7) and its strings are checked\nagain if the Design draws them. Bracketed decision ids ([D1-04]) are the PM's own.\n\n## Scope and entry\n- R-001 [PM:pm-header D0-04] Reuse on a video's Save & Share page brings back the whole generation setting set (model, Duration, Video Quality, Generate Sound by AI and the prompt), not only the prompt text as the old Prompt Reuse did.\n- R-002 [PM:pm-flow Overview D0-03] The only entry is the video-level 「Reuse」 on the Save & Share page: My AI Artwork shows no reuse list and no other reuse entry.\n- R-003 [PM:pm-flow Overview D0-05] The button is named 「Reuse」 and appears on the Save & Share page reached from the My AI Artwork 「Image to Video」 tab and from Recent (Video).\n- R-004 [PM:pm-flow Overview D0-06; PM:pm-ui template_video D0-06] Only Custom videos: a Template video's Save & Share page shows no 「Reuse」 and no 「Prompts & Settings」, as today.\n- R-005 [PM:pm-flow Overview D0-06, D0-06b] Custom videos made with the 10/E Start/End frame option are in scope: their Save & Share page shows 「Prompts & Settings」 and 「Reuse」.\n\n## My AI Artwork — Image to Video tab\n- R-006 [PM:pm-ui My AI Artwork D0-07] The Image to Video tab is the same as today: 「Create more」 is its only creation button.\n- R-007 [DS:d-artwork-light; PM:pm-ui Save & Share D1-07] The list tiles get no Reuse or other new button.\n- R-008 [PM:pm-ui Save & Share D1-01; PM:pm-ui My AI Artwork D1-01] Tapping a finished Custom video in the Image to Video tab opens its Save & Share page with 「Prompts & Settings」 and 「Reuse」.\n- R-009 [PM:pm-ui Save & Share D0-05, D1-01] Tapping a finished Custom video in Recent (Video) opens the same Save & Share page with 「Prompts & Settings」 and 「Reuse」.\n\n## Save & Share — Prompts & Settings\n- R-010 [DS:d-save-share-light; PM:pm-ui Save & Share D0-04b, D1-10] The Prompts area's title is 「Prompts & Settings」.\n- R-011 [DS:d-save-share-light; PM:pm-ui Save & Share D0-04b] The page has exactly one 「Reuse」: the old Prompt Reuse row is replaced by it, not shown beside it.\n- R-012 [DS:d-save-share-light; PM:pm-ui Save & Share D2-01] The section is a card: the model's icon and name with 「Reuse」 at the right of the same row, under them one chip each for Duration, Quality and Sound (sample 「10s」 「Pro」 「Sound on」, Q-13), and under the chips the video's prompt.\n- R-067 [DS:d-save-share-light] On a Custom video's page the order is 「Save」, 「More Video Editing Tools」, 「Add Text」 「Add Sticker」 「Add Music」, 「Prompts & Settings」, 「Share to」.\n- R-068 [DS:d-save-share-dark] In dark mode the 「Prompts & Settings」 card follows the dark frame: the title, model name, chips, prompt and 「Reuse」 are readable on the dark background (Q-16).\n- R-013 [PM:pm-ui Save & Share D2-03] Only Custom videos that generated successfully show 「Prompts & Settings」 and 「Reuse」; processing and failed jobs do not.\n- R-014 [PM:pm-ui Save & Share D2-03b; PM:pm-draft-tbd Q1] Custom videos generated before 4/E show no 「Reuse」 on day 1 (RD to confirm).\n- R-015 [PM:pm-draft-tbd Q2 D2-07] A Custom video whose full settings cannot be read (made on the other platform, or after a reinstall) shows no 「Reuse」 on day 1 (RD to confirm).\n\n## Reuse into Image to Video Custom\n- R-016 [PM:pm-ui Save & Share D1-04] Tapping 「Reuse」 opens Image to Video with the 「Custom」 tab selected.\n- R-017 [PM:pm-ui From Save & Share Reuse D2-01] The model the video was made with is selected.\n- R-018 [PM:pm-ui From Save & Share Reuse D2-01] The video's Duration is selected.\n- R-019 [PM:pm-ui From Save & Share Reuse D2-01] The video's Video Quality is selected.\n- R-020 [PM:pm-ui From Save & Share Reuse D2-01] Generate Sound by AI is set as it was for the video.\n- R-021 [PM:pm-ui From Save & Share Reuse D2-01, D0-06b] The 「Specify Video Start / End」 switch is set as it was for the video.\n- R-022 [PM:pm-ui From Save & Share Reuse D2-01; PM:pm-flow D1-04] The video's prompt is filled in the prompt box, with its character counter (mockup 「58/2,500」).\n- R-023 [PM:pm-ui From Save & Share Reuse D2-01; PM:pm-flow D1-04] The photo is not brought back: 「Add your images」 is empty.\n- R-024 [PM:pm-ui From Save & Share Reuse D2-01] The Inspiration is not brought back: no inspiration is selected under 「Try with inspirations」.\n- R-025 [PM:pm-flow D1-04; PM:pm-ui From Save & Share Reuse D1-04b] On entering, the toast 「Settings applied」 shows on the Custom page.\n- R-026 [PM:pm-ui From Save & Share Reuse D1-04b] When Image to Video would show its iOS intro (demo / Steps) or the AI Processing Notice, it shows first as today, and 「Settings applied」 shows only once the Custom page is visible.\n- R-027 [PM:pm-ui From Save & Share Reuse D1-08] The toast takes priority over a panel (Q-4).\n- R-028 [PM:pm-ui From Save & Share Reuse D3-01] Reuse charges no credits.\n- R-029 [PM:pm-ui From Save & Share Reuse D3-02] 「Generate」 shows the reused model's current credit price.\n- R-030 [PM:pm-ui From Save & Share Reuse D3-03; KB: KP-016] Free trial works as in Image to Video Custom: a user with the free trial sees it in the reused room as in a Custom room opened by Create more.\n\n## In the room after Reuse\n- R-031 [PM:pm-ui From Save & Share Reuse D1-06] Switching models in the room keeps the settings as the 4/E rule does; values the new model does not support go back to that model's defaults.\n- R-032 [PM:pm-ui From Save & Share Reuse D1-06] Leaving the room resets it, as Image to Video Custom does: the next Custom room opened by 「Create more」 has the default model and settings and an empty prompt.\n- R-033 [PM:pm-ui From Save & Share Reuse D1-05] ‹ Back in the reused room returns to the Save & Share page.\n- R-034 [PM:pm-flow arrow 「‹ back --> My AI Artwork」] ‹ Back on the Save & Share page returns to My AI Artwork (Image to Video tab).\n\n## Generate from Reuse\n- R-035 [PM:pm-ui From Save & Share Reuse D4-01] Generate is sent under the reused model's existing action ID.\n- R-036 [PM:pm-ui From Save & Share Reuse D3-02; KB: KP-023] Generate charges the price 「Generate」 showed; the credit usage history is the record to match, not the badge.\n- R-037 [PM:pm-flow Artwork mockup] The new job appears in My AI Artwork › Image to Video as a Processing tile and becomes a finished Custom video.\n- R-038 [PM:pm-header D0-04; Rule pass 10] The new video is made with the reused settings: its length is the reused Duration and it has sound only when Generate Sound by AI was on.\n- R-039 [PM:pm-ui From Save & Share Reuse D2-01] The reused prompt is the prompt sent to the generator.\n\n## Create more (unchanged)\n- R-041 [PM:pm-ui My AI Artwork D1-03, D0-03; PM:pm-flow D1-03] 「Create more」 opens the Custom tab with the default model (mockup 「Kling 3.0」), the placeholder prompt 「Describe the subject, action, function md(src){

  const out=[];let list=false,table=null;

    if(table)flush();

    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}

}

  $('#h').textContent=`${D.title} · ${plat} · ${REVIEW?'Cases':'Approved test cases'}`;
  const f=[];
  if(REVIEW){f.push(`Draft <code>${esc(D.draft)}</code>`);f.push(D.based_on_version?`Updates approved version ${D.based_on_version}`:'No approved table yet');}
  else f.push(`Version ${D.version} · approved ${esc((D.approved_at||'').slice(0,10))}`);
  f.push(`Spec: ${D.spec_files.map(s=>esc(s.name)).join(', ')}`);
  $('#facts').innerHTML=f.map(x=>`<span>${x}</span>`).join('');
  if(D.update_plan){$('#planBox').hidden=false;$('#planBox').open=true;$('#plan').innerHTML=md(D.update_plan)}
  if(D.requirements){$('#reqBox').hidden=false;$('#req').innerHTML=md(D.requirements)}
  if(!REVIEW){document.body.classList.add('view');$('#decHead').hidden=true;$('#copyDec').hidden=true;$('#save').hidden=true}
  if(REVIEW&&!D.save){$('#save').disabled=true;$('#save').title='Open this page through scripts/review.ts to save.'}
  $('#foot').textContent=REVIEW?'Edits and new-case notes are kept in this browser until you save. Save writes the approved CSV, keeps the previous version in history/, regenerates the Excel and HTML views, and hands new-case notes to the agent for the next draft.':'Read-only view generated from cases.csv.';
}
function filters(){
  const cnt=(k,v)=>rows.filter(r=>k==='change'?(r.cur.Change||'')===v:state(r)===v).length;
  const changes=['new','modified','removed','unchanged'].filter(v=>cnt('change',v));
  const states=['kept','edited','added','deleted'];
  let h=`<input type="search" id="q" placeholder="Search ID or text" value="${esc(F.q)}"><select id="sec"><option value="">All sections (${rows.length})</option>${sections().map(s=>`<option${F.section===s?' selected':''}>${esc(s)}</option>`).join('')}</select>`;
  if(changes.length){h+=`<span class="sep"></span>`+[['','All changes'],...changes.map(c=>[c,c])].map(([v,l])=>`<button class="chip" data-k="change" data-v="${v}" aria-pressed="${F.change===v}">${l}${v?` <b>${cnt('change',v)}</b>`:''}</button>`).join('')}
  if(REVIEW)h+=`<span class="sep"></span>`+[['','Any decision'],...states.map(s=>[s,s])].map(([v,l])=>`<button class="chip" data-k="state" data-v="${v}" aria-pressed="${F.state===v}">${l}${v?` <b>${cnt('state',v)}</b>`:''}</button>`).join('');
  $('#filters').innerHTML=h;
  $('#q').oninput=e=>{F.q=e.target.value;body()};
  $('#sec').onchange=e=>{F.section=e.target.value;body()};
  $('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;filters();body()});
}
function visible(r){
  const t=(r.cur.ID+' '+FIELDS.map(f=>r.cur[f]).join(' ')).toLowerCase();
  return (!F.q||t.includes(F.q.toLowerCase()))&&(!F.section||(r.cur.Section||'(no section)')===F.section)&&(!F.change||(r.cur.Change||'')===F.change)&&(!F.state||state(r)===F.state);
}
function cell(r,f){
  const prev=D.previous[r.cur.ID];
  const was=prev&&r.cur.Change==='modified'&&(prev[f]??'')!==(r.orig[f]??'')?`<div class="was">${esc(prev[f])}</div>`:'';
  return `<td><textarea data-id="${esc(r.cur.ID)}" data-f="${f}" rows="2">${esc(r.cur[f])}</textarea>${was}</td>`;
}
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${ch}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${st}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:[PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(r.cur.ID)}" title="Coverage: where in the spec this case comes from and the controls it presses">Coverage →</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(r.cur.ID)}" title="Progress: the segment that runs this case and its latest result">Progress →</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(r.cur.ID)}" title="Results: what each run found, with screenshots">Results →</a>`].filter(Boolean);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  // the open questions this row's assumption depends on: a marker that opens the question above the table
  const qm=(D.questions||[]).filter(q=>q.rows.includes(r.cur.ID)).map(q=>{const st=qState(q.id);
    return `<a class="qmark ${st}" href="#q-${esc(q.id)}" data-q="${esc(q.id)}" title="${esc(st==='open'?'This row assumes an answer to an open question: read it or answer it':st==='done'?'Answered and applied':'Answered, waiting for the agent')}">${esc(q.id)}${st==='open'?' ?':' ✓'}</a>`}).join(' ');
  return `${esc(r.cur.ID)}<div>${badges}</div>${qm?`<div>${qm}</div>`:''}${spec}${r.cur['Change Reason']?`<div class="reason">${esc(r.cur['Change Reason'])}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="Describe new cases in your own words; they become rows in the next draft">+ Add case</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>New case notes</b><span>Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.</span><button class="add" data-del="${esc(n.id)}">Remove</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">Keep</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">Delete</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">No cases match these filters.</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label+' copied.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' copied.')}catch(_){toast('Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),'Final CSV');if(liveNotes().length)setTimeout(()=>toast('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast('Save failed: '+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();openQuestion(m.dataset.q)});
header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
</body>
