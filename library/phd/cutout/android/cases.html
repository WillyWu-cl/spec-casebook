<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutout Reset / Undo / Redo Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

const D={"mode":"view","save":false,"feature":"phd/cutout","platform":"android","title":"Cutout Reset / Undo / Redo","draft":"edit-20261112-093823","based_on_version":null,"version":2,"approved_at":"2026-11-12T01:38:23.914Z","spec_files":[{"name":"Cutout UI UX flow (before 11E).pdf","sha256":"793775d3c3f5cc78e128d0a304e115448ef7b6de6c88992b27b9e22b41e0d8bb","bytes":1143342},{"name":"Cutout Reset Undo Redo Spec 11E.pdf","sha256":"e25471600f0e024c6067052af8f188a2c22c39382143a0d5c437f0b62d7b31f0","bytes":9020752}],"rows":[{"ID":"TC-001","Section":"Entry and layout","Precondition":"A photo with one or two people open in the editor","Action":"1. Tap Edit › 「Cutout」\n2. Tap 「Auto」\n3. Tap 「Cutout」","Expected Result":"The Cutout room opens with the cut-out people on the canvas, an edit (pencil) button on the canvas, tabs 「Background」 and 「Stroke」 with 「Background」 selected, category chips starting with 「Solid」 and the item row below.","Priority":"P1","Spec Ref":"R-001, R-003, R-004","Notes":""},{"ID":"TC-002","Section":"Entry and layout","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"Look at the bottom bar","Expected Result":"Five buttons from left to right: ✕, Reset, Undo, Redo, ✓\nReset, Undo and Redo are grey (disabled)\n✕ and ✓ are enabled","Priority":"P1","Spec Ref":"R-002, R-010","Notes":""},{"ID":"TC-003","Section":"Entry and layout","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap Reset\n2. Tap Undo\n3. Tap Redo","Expected Result":"Nothing happens: canvas and panel unchanged, the three buttons stay grey.","Priority":"P2","Spec Ref":"R-010","Notes":""},{"ID":"TC-004","Section":"Button states","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"Tap 「White」 in the 「Solid」 item row","Expected Result":"The background turns white\nReset and Undo are enabled\nRedo stays disabled","Priority":"P1","Spec Ref":"R-011, R-020","Notes":""},{"ID":"TC-005","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」","Action":"Tap Undo","Expected Result":"The background is white again\nReset, Undo and Redo are all enabled","Priority":"P1","Spec Ref":"R-012","Notes":""},{"ID":"TC-006","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」\n3. Tap Undo (background white)","Action":"Tap Undo","Expected Result":"The canvas is back to the entry state (transparent background)\nReset and Undo are disabled\nRedo is enabled","Priority":"P1","Spec Ref":"R-013, R-016","Notes":""},{"ID":"TC-007","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」","Action":"Tap Reset","Expected Result":"The canvas is back to the entry state\nReset is disabled, Undo is enabled, Redo is disabled","Priority":"P1","Spec Ref":"R-014","Notes":""},{"ID":"TC-008","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」\n3. Tap Reset","Action":"1. Tap Undo\n2. Tap Redo","Expected Result":"After Undo: the black background is back and Reset is enabled again\nAfter Redo: the Reset is applied again (entry state), Reset disabled and Undo enabled","Priority":"P1","Spec Ref":"R-014, R-028, R-035","Notes":""},{"ID":"TC-009","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」\n3. Tap Undo (Redo enabled)","Action":"Tap Reset","Expected Result":"Entry state\nRedo is disabled (Reset clears the Redo history)\nUndo is enabled","Priority":"P1","Spec Ref":"R-014, R-017","Notes":""},{"ID":"TC-010","Section":"Button states","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」\n3. Tap Undo (Redo enabled)","Action":"Tap 「Blue」 in the item row","Expected Result":"The background turns blue\nRedo is disabled (the new step cleared the Redo history)\nUndo is enabled","Priority":"P1","Spec Ref":"R-017","Notes":""},{"ID":"TC-011","Section":"Button states","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet\n3. Note which item is selected on entry (transparent)","Action":"1. Tap 「White」\n2. Tap the item selected on entry (transparent)","Expected Result":"The canvas looks as on entry\nReset is disabled (state equals the initial one) while Undo is enabled (two steps)\nTapping Undo once shows the white background","Priority":"P2","Spec Ref":"R-015, R-016","Notes":""},{"ID":"TC-012","Section":"Steps per operation","Precondition":"1. In the Cutout room, 「Solid」 chip\n2. 「White」 selected (one step)","Action":"1. Tap 「Black」\n2. Tap Undo\n3. Tap Redo","Expected Result":"After Undo: white background and the orange selection frame back on 「White」\nAfter Redo: black background and the frame on 「Black」","Priority":"P1","Spec Ref":"R-020, R-035","Notes":""},{"ID":"TC-013","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet\n3. A 「Wall」 template already downloaded (no download arrow)","Action":"1. Tap the 「Wall」 chip\n2. Tap the downloaded template\n3. Tap Undo\n4. Tap Redo","Expected Result":"The template is applied and Undo enables once it shows\nAfter Undo: the entry background and the selection frame back on the entry item\nAfter Redo: the template again, frame on it","Priority":"P1","Spec Ref":"R-021, R-035","Notes":""},{"ID":"TC-014","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet\n3. A 「Wall」 template not downloaded yet (download arrow), slow network if available","Action":"1. Tap the 「Wall」 chip\n2. Tap the template with the download arrow\n3. Watch Undo while it downloads","Expected Result":"Undo stays disabled while the template downloads and enables only when the template is applied to the canvas (recorded when applying completes).","Priority":"P1","Spec Ref":"R-021, R-070","Notes":"Q-2 answered (REQ-005): with no earlier step Undo stays disabled during the download."},{"ID":"TC-015","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the import-photo item\n2. Choose a photo\n3. Tap Undo\n4. Tap Redo","Expected Result":"Undo enables when the photo shows on the canvas\nAfter Undo: the photo is gone from the canvas and the entry background is back\nAfter Redo: the photo again","Priority":"P1","Spec Ref":"R-022, R-035","Notes":""},{"ID":"TC-016","Section":"Steps per operation","Precondition":"In the Cutout room:\n1. Import a photo as background\n2. Tap Undo","Action":"Open the import-photo item again","Expected Result":"The undone photo is still listed under 「最近使用」 (Recent).","Priority":"P2","Spec Ref":"R-071","Notes":"REQ-008: the app has no 「最近使用」 for now, so this row is expected to fail; after running it, file an eBug for the missing Recent first."},{"ID":"TC-017","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the colour-palette item\n2. Drag across several colours without confirming\n3. Look at Undo\n4. Confirm the colour\n5. Tap Undo","Expected Result":"Undo stays disabled while dragging\nIt enables only after confirming\nUndo returns the background from before the palette opened (not an intermediate dragged colour)","Priority":"P1","Spec Ref":"R-023","Notes":""},{"ID":"TC-018","Section":"Steps per operation","Precondition":"In the Cutout room: 「White」 selected (one step)","Action":"1. Tap the colour-palette item\n2. Drag to a red colour\n3. Close the palette without confirming\n4. Tap Undo","Expected Result":"Closing the palette records the pick as one step: the background is the picked colour after closing\nOne Undo returns white","Priority":"P2","Spec Ref":"R-023","Notes":""},{"ID":"TC-051","Section":"Steps per operation","Precondition":"In the Cutout room: 「White」 selected (one step)","Action":"1. Tap the colour-palette item\n2. Close the palette without changing the colour\n3. Tap Undo","Expected Result":"Closing the palette unchanged adds no step: one Undo returns the entry background and Undo is then disabled.","Priority":"P2","Spec Ref":"R-023","Notes":"Q-9 answered (REQ-005)."},{"ID":"TC-019","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the 「Stroke」 tab\n2. Tap an orange colour swatch\n3. Tap Undo\n4. Tap Redo","Expected Result":"Undo enables on the tap\nAfter Undo: the stroke setting from before (entry colour)\nAfter Redo: orange stroke","Priority":"P1","Spec Ref":"R-024, R-035","Notes":""},{"ID":"TC-020","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the 「Stroke」 tab\n2. Tap a different stroke style thumbnail\n3. Tap Undo","Expected Result":"Undo enables on the tap\nUndo returns the previous stroke style","Priority":"P1","Spec Ref":"R-024","Notes":""},{"ID":"TC-021","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet\n3. 「Stroke」 tab, thickness slider at its entry value (33 in the Design)","Action":"1. Drag the thickness slider to about 60 and hold\n2. Look at Undo\n3. Release\n4. Tap Undo","Expected Result":"Undo stays disabled while the finger is down and enables on release\nUndo returns the slider and the stroke to the entry value","Priority":"P1","Spec Ref":"R-025","Notes":""},{"ID":"TC-022","Section":"Steps per operation","Precondition":"In the Cutout room: 「Stroke」 tab, thickness slider at 33","Action":"1. Drag the slider to about 60 and release\n2. Drag it to about 10 and release\n3. Tap Undo","Expected Result":"One Undo returns the slider to about 60 (each release is one step, no step for the positions in between).","Priority":"P2","Spec Ref":"R-025","Notes":""},{"ID":"TC-023","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Rotate the cutout with two fingers and hold\n2. Look at Undo\n3. Release\n4. Tap Undo","Expected Result":"Undo stays disabled while rotating and enables on release\nUndo returns the cutout to its angle before the rotation","Priority":"P1","Spec Ref":"R-026","Notes":""},{"ID":"TC-024","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Select the cutout on the canvas\n2. Tap the Flip button\n3. Tap Undo\n4. Tap Redo","Expected Result":"A Flip button is there and flips the cutout\nUndo enables on the flip\nAfter Undo: the cutout faces the direction from before the flip\nAfter Redo: flipped again","Priority":"P1","Spec Ref":"R-027, R-035","Notes":"REQ-009: the room must have a Flip button; if the build has none, record Fail and file an eBug."},{"ID":"TC-025","Section":"Steps per operation","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap 「White」\n2. Tap the 「Stroke」 tab\n3. Tap an orange swatch\n4. Drag the thickness slider and release\n5. Rotate the cutout and release\n6. Tap Undo four times\n7. Tap Redo four times","Expected Result":"The four Undo taps revert rotation, thickness, stroke colour and white background in that order, ending at the entry state (Reset and Undo disabled, Redo enabled)\nThe four Redo taps re-apply them in the original order","Priority":"P1","Spec Ref":"R-005, R-035","Notes":""},{"ID":"TC-026","Section":"Operations that are not steps","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the cutout on the canvas\n2. Tap 「Stroke」\n3. Tap 「Background」\n4. Tap the 「Wall」 chip\n5. Tap the 「Romantic」 chip\n6. Tap the 「Solid」 chip\n7. Scroll the item row left and right\n8. Tap the item already selected","Expected Result":"Reset, Undo and Redo stay disabled after every action.","Priority":"P2","Spec Ref":"R-030, R-031, R-032, R-033, R-034","Notes":""},{"ID":"TC-027","Section":"Operations that are not steps","Precondition":"In the Cutout room, 「Solid」 chip (two steps):\n1. Tap 「White」\n2. Tap 「Black」\n3. Tap Undo (Redo enabled)","Action":"1. Tap the cutout on the canvas\n2. Tap 「Stroke」\n3. Tap 「Background」\n4. Tap the 「Wall」 chip\n5. Tap the 「Solid」 chip\n6. Scroll the item row\n7. Tap the selected 「White」 again\n8. Tap Redo","Expected Result":"Redo stays enabled through steps 1–7 (none of them is a step) and Redo brings the black background back.","Priority":"P2","Spec Ref":"R-017, R-030, R-031, R-032, R-033, R-034","Notes":""},{"ID":"TC-028","Section":"Operations that are not steps","Precondition":"In the Cutout room: 「White」 selected (one step)","Action":"1. Tap 「White」 again\n2. Tap Undo","Expected Result":"One Undo returns the entry background\nUndo is then disabled (the second tap added no step)","Priority":"P2","Spec Ref":"R-034","Notes":""},{"ID":"TC-029","Section":"Undo across tabs","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet\n3. A 「Wall」 template downloaded","Action":"1. Apply the 「Wall」 template\n2. Tap 「Stroke」 and change the stroke colour\n3. Tap 「Background」\n4. Tap Undo","Expected Result":"The stroke change is reverted and the panel switches to the 「Stroke」 tab by itself.","Priority":"P1","Spec Ref":"R-040, R-090","Notes":""},{"ID":"TC-030","Section":"Undo across tabs","Precondition":"After the previous row: on the 「Stroke」 tab, the Wall template still applied","Action":"Tap Undo","Expected Result":"The Wall template is reverted\nThe panel switches back to 「Background」\nThe canvas is at the entry state with Reset and Undo disabled and Redo enabled","Priority":"P1","Spec Ref":"R-040, R-013, R-091","Notes":""},{"ID":"TC-031","Section":"Undo across tabs","Precondition":"After the previous row: entry state on 「Background」, Redo enabled","Action":"1. Tap Redo\n2. Tap Redo","Expected Result":"First Redo: the Wall template is back and the panel stays on 「Background」\nSecond Redo: the stroke change is back and the panel switches to 「Stroke」","Priority":"P1","Spec Ref":"R-041, R-042, R-035","Notes":""},{"ID":"TC-032","Section":"Undo across tabs","Precondition":"In the Cutout room: 「Stroke」 tab, two stroke colour changes made on it","Action":"Tap Undo","Expected Result":"The last stroke colour is reverted and the panel stays on 「Stroke」.","Priority":"P2","Spec Ref":"R-041","Notes":""},{"ID":"TC-033","Section":"Reset and the cutout style","Precondition":"1. In the Cutout room: background, stroke colour and thickness changed\n2. The panel on 「Stroke」","Action":"Tap Reset","Expected Result":"The panel switches to 「Background」 and the canvas shows the entry state: cutout on its entry background with the entry stroke.","Priority":"P1","Spec Ref":"R-044, R-055","Notes":""},{"ID":"TC-034","Section":"Reset and the cutout style","Precondition":"In the Cutout room: background changed","Action":"Tap Reset","Expected Result":"The canvas shows the state on entering the room (the cut-out people), not the original photo with its own background.","Priority":"P1","Spec Ref":"R-055","Notes":""},{"ID":"TC-035","Section":"Reset and the cutout style","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the edit (pencil) button on the canvas\n2. On the edit cutout page, brush an extra area into the selection\n3. Return to the Cutout room","Expected Result":"The cutout shows the edited shape\nUndo and Redo stay disabled (the round trip is no step)\nReset is enabled (the state differs from the entry state)","Priority":"P1","Spec Ref":"R-029, R-052","Notes":""},{"ID":"TC-036","Section":"Reset and the cutout style","Precondition":"After the previous row: cutout edited on the edit cutout page, no room step","Action":"Tap Reset","Expected Result":"The cutout returns to its shape on entering the room\nReset is disabled, Undo is enabled, the panel is on 「Background」","Priority":"P1","Spec Ref":"R-051, R-014","Notes":""},{"ID":"TC-037","Section":"Reset and the cutout style","Precondition":"After the previous row: Reset done","Action":"Tap Undo","Expected Result":"The edited cutout shape comes back (the state before Reset, cutout style included).","Priority":"P1","Spec Ref":"R-028, R-050","Notes":""},{"ID":"TC-038","Section":"Reset and the cutout style","Precondition":"In the Cutout room: 「White」 selected (one step)","Action":"1. Tap the edit button\n2. Brush an extra area into the selection\n3. Return to the Cutout room\n4. Tap Undo\n5. Tap Redo","Expected Result":"The round trip adds no step\nUndo reverts 「White」 and the cutout goes back to its shape at that step (entry shape)\nRedo brings back the white background and the edited cutout","Priority":"P2","Spec Ref":"R-029, R-050","Notes":"Q-1 answered (REQ-005)."},{"ID":"TC-039","Section":"Reset and the cutout style","Precondition":"In the Cutout room: tapped the edit button (on the edit cutout page)","Action":"1. Brush an extra area\n2. Tap the edit cutout page's own Undo","Expected Result":"The edit cutout page's Undo reverts the brush stroke on that page.","Priority":"P3","Spec Ref":"R-006","Notes":""},{"ID":"TC-040","Section":"Leaving the room","Precondition":"In the Cutout room: two steps made","Action":"Tap ✕","Expected Result":"The room closes without keeping its edits and the Cutout page opens (Auto / Box / Circle / Brush / Eraser) showing the image as it was before the room.","Priority":"P1","Spec Ref":"R-060, R-092","Notes":""},{"ID":"TC-041","Section":"Leaving the room","Precondition":"After the previous row: on the Cutout page","Action":"Tap 「Cutout」 to enter the room again","Expected Result":"Reset, Undo and Redo are all disabled\nNo earlier step can be undone","Priority":"P1","Spec Ref":"R-060, R-010","Notes":""},{"ID":"TC-042","Section":"Leaving the room","Precondition":"In the Cutout room: background changed to white and stroke changed","Action":"Tap ✓","Expected Result":"The image is flattened (background, cutout and stroke as one image) and the Cutout page opens with it.","Priority":"P1","Spec Ref":"R-061, R-093","Notes":""},{"ID":"TC-043","Section":"Leaving the room","Precondition":"After the previous row: on the Cutout page with the flattened image","Action":"1. Make a selection\n2. Tap 「Cutout」 to enter the room again","Expected Result":"Reset, Undo and Redo are all disabled\nThe white background and stroke are part of the image and cannot be undone in the room","Priority":"P1","Spec Ref":"R-061, R-010","Notes":""},{"ID":"TC-044","Section":"Other scenarios","Precondition":"1. In the Cutout room: 「White」 selected (one step)\n2. A 「Wall」 template not downloaded yet\n3. Slow network if available","Action":"1. Tap the template with the download arrow\n2. While it downloads, tap Undo","Expected Result":"Only the template apply is cancelled: the canvas does not show the template and the white background stays.","Priority":"P1","Spec Ref":"R-070","Notes":"Q-2 answered (REQ-005)."},{"ID":"TC-045","Section":"Other scenarios","Precondition":"After the previous row: the cancelled template still downloading","Action":"Wait until the download finishes","Expected Result":"The template is not applied when the download finishes\nThe canvas is unchanged","Priority":"P2","Spec Ref":"R-070","Notes":""},{"ID":"TC-046","Section":"Other scenarios","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Make 60 steps (alternate 「White」 and 「Black」)\n2. Tap Undo until it is disabled","Expected Result":"Undo walks back all 60 steps to the entry state (transparent background) before it disables\nNo step is dropped and no message appears","Priority":"P2","Spec Ref":"R-072","Notes":"REQ-006: no step limit."},{"ID":"TC-047","Section":"Other scenarios","Precondition":"In the Cutout room:\n1. Make two steps\n2. Tap Undo","Action":"1. Send the app to the background for 10 s\n2. Return to the app","Expected Result":"The room shows the same canvas and panel\nReset, Undo and Redo are enabled as before\nRedo still re-applies the undone step","Priority":"P2","Spec Ref":"R-081","Notes":""},{"ID":"TC-048","Section":"Android","Precondition":"In the Cutout room: two steps made","Action":"Press system Back","Expected Result":"Back does what ✕ does: the room closes to the Cutout page and the history is cleared on re-entry.","Priority":"P2","Spec Ref":"R-080, R-060","Notes":"Q-7 answered (REQ-005)."},{"ID":"TC-049","Section":"Android","Precondition":"1. In the Cutout room just entered (a person photo, 「Auto」 selection, 「Cutout」 tapped)\n2. No step made yet","Action":"1. Tap the colour-palette item\n2. Drag to a colour\n3. Press system Back","Expected Result":"Back closes the palette only (the room stays) and the pick is recorded as one step (Undo enabled; Undo returns the entry background).","Priority":"P2","Spec Ref":"R-080, R-023","Notes":"Q-7 answered (REQ-005)."},{"ID":"TC-050","Section":"Android","Precondition":"In the Cutout room: tapped the edit button (on the edit cutout page)","Action":"Press system Back","Expected Result":"Back returns to the Cutout room (like the page's own close)\nThe room's Reset / Undo / Redo states are unchanged","Priority":"P3","Spec Ref":"R-080, R-029","Notes":"Q-7 answered (REQ-005)."}],"previous":{},"requirements":"# Cutout Reset / Undo / Redo — requirements (android)\nSpec: Cutout Reset Undo Redo Spec 11E.pdf, Cutout UI UX flow (before 11E).pdf (spec set 2026-11-10; from 「Cutout with Stroke.zip」)\nRead PDF-only from the text layer and renders (figma-pending.json); the linked Design 2025/09 page was read with figma-design (links.json).\nSource order: the 11/E page is the newest and governs; the 「before 11/E」 page is used only for the Cutout page and the entry.\n\n## Entry and layout\n- R-001 [PM:uiux-before-11e; PM:pm-11e-crosstab] Edit › 「Cutout」 opens the Cutout page (tools 「Auto」 / 「Box」 / 「Circle」 / 「Brush」 / 「Eraser」, bottom bar ✕, reset, undo, redo, 「Cutout」); after a selection, 「Cutout」 opens the Cutout room with the cutout on the canvas.\n- R-002 [PM:pm-11e-buttons] The Cutout room has a Reset, an Undo and a Redo button (➊ add button: reset / undo / redo), drawn in the bottom bar between ✕ and ✓ in the order ✕, Reset, Undo, Redo, ✓.\n- R-003 [PM:pm-11e-crosstab] The Cutout room opens on the 「Background」 tab (「Background tab (default locate)」).\n- R-004 [PM:pm-11e-buttons] The room panel has two tabs, 「Background」 and 「Stroke」; the Background tab has category chips (「Solid」, 「Wall」, 「Romantic」, 「Blue」, 「Summer」…) above an item row (none, transparent, import photo, colour palette, solid colours, templates).\n- R-005 [PM:pm-11e-buttons; PM:pm-11e-rules] The history covers only edits made in the Cutout room, and Background and Stroke share one history (「Background + Stroke 共用一條」).\n- R-006 [PM:pm-11e-logic] The edit cutout page (reached with the canvas edit button) keeps its own undo for its own edits (operation table #10: 「由 edit cutout page 自己的 undo 管理」).\n\n## Button states\n- R-010 [PM:pm-11e-buttons] ① On entering the room (current = initial state): Reset, Undo and Redo are disabled (grey).\n- R-011 [PM:pm-11e-buttons] ② After any step: Reset enabled, Undo enabled, Redo disabled.\n- R-012 [PM:pm-11e-buttons] ③ After an Undo that has not reached the initial state: Reset, Undo and Redo are all enabled.\n- R-013 [PM:pm-11e-buttons] ④ After undoing every step (back at the initial state): Reset disabled, Undo disabled, Redo enabled.\n- R-014 [PM:pm-11e-buttons; PM:pm-11e-logic] ⑤ After Reset: Reset disabled, Undo enabled, Redo disabled — Reset is itself a step and clears the Redo history.\n- R-015 [PM:pm-11e-rules] Reset is enabled when the current state (cutout style included) differs from the initial state, and disabled when it is the same, whatever the history holds.\n- R-016 [PM:pm-11e-rules] Undo is enabled when there is a step to undo and disabled when there is none.\n- R-017 [PM:pm-11e-rules] Redo is enabled when there is an undone step; a new step after an Undo clears the Redo history (Redo disabled).\n\n## Steps per operation\n- R-020 [PM:pm-11e-logic] Choosing a solid background is a step, recorded on tap; Undo returns the previous background and the panel selection frame moves back with it.\n- R-021 [PM:pm-11e-logic; Req: REQ-005] Choosing a template background (Wall / Romantic…) is a step, recorded when applying completes; Undo returns the previous background and moves the selection back.\n- R-022 [PM:pm-11e-logic] Importing a photo as background is a step, recorded when the photo is applied to the canvas; Undo removes the photo from the canvas and returns the previous background.\n- R-023 [PM:pm-11e-logic; Req: REQ-005] Picking a colour in the colour palette is a step, recorded when the palette is confirmed or closed, not while dragging; Undo returns the background from before the pick. Closing the palette with no colour change is no step (Q-9 answered).\n- R-024 [PM:pm-11e-logic] Choosing a Stroke style or colour is a step, recorded on tap; Undo returns the previous stroke setting.\n- R-025 [PM:pm-11e-logic] Dragging the Stroke thickness slider is a step, recorded on finger-up, not while dragging; Undo returns the value from before the drag.\n- R-026 [PM:pm-11e-logic] Rotating the cutout object is a step, recorded on finger-up, not while rotating; Undo returns the angle from before the rotation.\n- R-027 [PM:pm-11e-logic; Req: REQ-009] Flipping the cutout object is a step, recorded on tap; Undo returns the direction from before the flip. The room must offer a Flip button (Q-8 answered, REQ-009).\n- R-028 [PM:pm-11e-logic] Reset is a step, recorded on tap; Undo after Reset returns the state from before the Reset, cutout style included.\n- R-035 [PM:pm-11e-rules; KB: KP-042] Undo reverts the last step and updates the canvas and the panel selection together; Redo re-applies the most recently undone step.\n\n## Operations that are not steps\n- R-029 [PM:pm-11e-logic] Opening the edit cutout page with the edit button and coming back is not a step (#10).\n- R-030 [PM:pm-11e-logic] Selecting the cutout object on the canvas is not a step (#11).\n- R-031 [PM:pm-11e-logic] Switching between the 「Background」 and 「Stroke」 tabs is not a step (#12).\n- R-032 [PM:pm-11e-logic] Switching category chips (「Solid」 / 「Wall」…) is not a step (#13).\n- R-033 [PM:pm-11e-logic] Scrolling the item row sideways is not a step (#14).\n- R-034 [PM:pm-11e-logic] Tapping the item that is already selected is not a step (#15).\n\n## Undo across tabs\n- R-040 [PM:pm-11e-crosstab; PM:pm-11e-rules] When the change an Undo or Redo reverts or re-applies was made on the other tab, the panel switches to that tab so the user sees the change.\n- R-041 [PM:pm-11e-rules] When the change is on the current tab, Undo / Redo keeps the panel on it (「在 C 按 Redo → 重做 ①「選 Wall 背景」→ 留在 Background tab」).\n- R-042 [PM:pm-11e-rules] From C, a second Redo re-applies ② 「調整 Stroke」 and switches to the Stroke tab.\n- R-044 [PM:pm-11e-rules] Tapping Reset switches the panel to the 「Background」 tab.\n\n## Reset and the cutout style\n- R-050 [PM:pm-11e-rules; Req: REQ-005] Undo and Redo include the edits made on the edit cutout page (cutout style): each step's state includes the cutout style of that moment, so undoing back past a step also brings back the cutout shape it had (Q-1 answered).\n- R-051 [PM:pm-11e-rules; PM:pm-11e-open] Reset restores the edits made on the edit cutout page (cutout style) too (5. 待決事項 Q7, decided: 「還原；否則使用者可能卡住，無法繼續 undo / redo」).\n- R-052 [PM:pm-11e-rules; PM:pm-11e-logic] After only editing the cutout on the edit cutout page (no step in the room), Reset is enabled (the state differs from the initial one) while Undo and Redo stay disabled (the round trip is no step).\n- R-055 [PM:pm-11e-rules] Reset returns to the state on entering the room, not to the original photo.\n\n## Leaving the room\n- R-060 [PM:pm-11e-buttons; PM:pm-11e-rules; Req: REQ-005] Leaving the room with ✕ discards the room's edits, returns to the Cutout page and clears the whole history: entering the room again starts with Reset, Undo and Redo disabled (Q-3 answered).\n- R-061 [PM:pm-11e-rules; Req: REQ-005] Leaving the room with ✓ flattens the image, returns to the Cutout page with it and clears the whole history (「壓平圖片處理，紀錄全部清空」; Q-3 answered).\n\n## Other scenarios\n- R-070 [PM:pm-11e-rules; Req: REQ-005] Tapping Undo while a template is still downloading cancels only that apply (the earlier step stays); when the download finishes the template is not applied. With no earlier step Undo stays disabled during the download (Q-2 answered).\n- R-071 [PM:pm-11e-rules; Req: REQ-008] After an imported photo is undone it is removed from the canvas but stays in 「最近使用」 (Recent).\n- R-072 [PM:pm-11e-rules; PM:pm-11e-open; Req: REQ-006] There is no step limit (Q-6 answered, REQ-006; replaces 「步數達到上限：最舊的步驟會被捨棄」 and the spec's open Q3): after many steps Undo walks back every one of them to the entry state.\n- R-081 [Rule 2: leave and return] Sending the app to the background in the Cutout room and returning keeps the canvas, the panel and the Reset / Undo / Redo states.\n\n## Android\n- R-080 [Rule: Android system Back (REQ-051 of the skill); Req: REQ-005] System Back in the Cutout room, with the colour palette open and on the edit cutout page does what the screen's own close does (Q-7 answered).\n\n## Flow arrows\n- R-090 [DS: flow arrow pm-11e-crosstab-a1  (PDF board pm-11e-crosstab, no Figma link)] A (Background tab after ① Wall, ② Stroke, ③ back on Background) → 「按 Undo」 → B: ② reverted, panel on the Stroke tab.\n- R-091 [DS: flow arrow pm-11e-crosstab-a2  (PDF board pm-11e-crosstab, no Figma link)] B → 「再按 Undo」 → C: ① reverted, panel back on the Background tab, Reset and Undo disabled.\n- R-092 [DS: flow arrow pm-11e-crosstab-a3  (PDF board pm-11e-crosstab, no Figma link)] Room ✕ → the Cutout page (pink arrow).\n- R-093 [DS: flow arrow pm-11e-crosstab-a4  (PDF board pm-11e-crosstab, no Figma link)] Room ✓ → the Cutout page (pink arrow).\n\n## Open questions\n\n## Answered questions (2026-11-10, Cases page)\n- Q-1 — 每一步記錄的狀態都包含當時的去背樣式 → confirms the assumption. REQ-005; R-050.\n- Q-2 — Undo 只取消這次還沒完成的套用；沒有更早的步驟時 Undo 維持不能按 → confirms the assumption. REQ-005; R-021, R-070.\n- Q-3 — ✕ 捨棄編輯並回到 Cutout 頁；✓ 壓平圖片後回到 Cutout 頁 → confirms the assumption. REQ-005; R-060, R-061.\n- Q-4 — 目前沒有 recent，執行完這條請先開個 bug → the app has no Recent for now; TC-016 stays (expected to fail) and an eBug is filed after it runs. REQ-008; R-071.\n- Q-6 — 沒有上限 → no step limit; replaces the oldest-step-dropped clause. REQ-006; R-072.\n- Q-7 — 返回鍵的效果和該畫面自己的關閉相同 → confirms the assumption. REQ-005; R-080.\n- Q-8 — 只能旋轉不能翻轉, corrected by the user: there must be a Flip button; when a run finds none, file an eBug → R-027 and TC-024 stay. REQ-009 (supersedes REQ-007); R-027.\n- Q-5 — Figma 上面的已經都儲存下來了，有更新會再更新 → the two PDFs hold everything on Figma (no missing sections, no newer frames); spec updates will be sent as a new set. REQ-010.\n- Q-9 — 沒改就不算 → closing the palette unchanged is no step; new TC-051. REQ-005; R-023.\n\n## Added 2026-11-10 — coverage passes and standing inputs\n### Job states\n| Job | Start / loading | Success | Failure | Retry | Leave and return | Longest wait | Done notice |\n|---|---|---|---|---|---|---|---|\n| Template background download | TC-013, TC-014 | TC-013, TC-014 | n/a (spec silent) | n/a (spec silent) | TC-047 | n/a (spec silent) | n/a (no notice) |\n| Photo import | TC-015 | TC-015 | n/a (spec silent) | n/a (spec silent) | TC-047 | n/a (spec silent) | n/a (no notice) |\n\n### Error classes\n| Job | Error classes |\n|---|---|\n| All jobs | n/a (the spec names no error classes or failure copy) |\n\n### Exit × stage\n| Stage | ✕ | ✓ | Edit button (round trip) | App to background | System Back |\n|---|---|---|---|---|---|\n| Room, no step | n/a (nothing to clear; R-060 checked with steps) | n/a (R-061 checked with steps) | TC-035 | n/a (spec silent) | n/a (same as with steps) |\n| Room, steps made | TC-040, TC-041, TC-048 | TC-042, TC-043 | TC-037, TC-038 | TC-047 | TC-048 |\n| Template downloading | n/a (spec silent) | n/a (spec silent) | n/a (spec silent) | n/a (spec silent) | n/a (spec silent) |\n| Colour palette open | n/a (no ✕ / ✓ while open) | n/a (no ✕ / ✓ while open) | n/a (not reachable) | n/a (spec silent) | TC-049 |\n\n### System back\n- Cutout room → as ✕: TC-048\n- Colour palette → closes it, pick recorded: TC-049\n- Edit cutout page → back to the room: TC-050\n- Cutout page → n/a (existing page, not changed by 11/E)\n- Photo picker (import photo) → n/a (existing picker, not changed by 11/E)\n\n### Hidden clauses\n| Requirement | Hidden clause | Observed through | Rows |\n|---|---|---|---|\n| R-005 | Background and Stroke share one history | Undo order across both tabs | TC-025 |\n| R-061 | the image is flattened on ✓ | the Cutout page shows one image; re-entering cannot undo it | TC-042, TC-043 |\n| R-070 | a cancelled template is not applied after its download finishes | canvas after the download ends | TC-014, TC-044, TC-045 |\n| R-071 | an undone photo is kept in 「最近使用」 | the Recent list after Undo | TC-016 |\n| R-072 | no step is ever dropped (no limit) | Undo count after 60 steps | TC-046 |\n\n### Variants\n| Requirement | Variant | Rows |\n|---|---|---|\n| R-035 × operation | solid background | TC-004, TC-012 |\n| R-035 × operation | template background | TC-013, TC-014 |\n| R-035 × operation | imported photo | TC-015 |\n| R-035 × operation | colour palette | TC-017, TC-018, TC-051, TC-049 |\n| R-035 × operation | stroke colour / style | TC-019, TC-020 |\n| R-035 × operation | stroke thickness | TC-021, TC-022 |\n| R-035 × operation | rotate | TC-023 |\n| R-035 × operation | flip | TC-024 |\n| R-035 × operation | Reset | TC-008, TC-037 |\n\n### Domain rules\n| Entry | Requirements |\n|---|---|\n| KP-012 Android has one paid mode: VIP = Pro = paid user | n/a (the Cutout room spec states no paid gating or price) |\n| KP-014 AI Exposure is paid-only | n/a (other feature or flow: not part of the Cutout room) |\n| KP-015 Mine refreshes entitlement after buying Premium | n/a (other feature or flow: not part of the Cutout room) |\n| KP-016 A one-time free trial is consumed at once | n/a (no free trial in the Cutout room spec) |\n| KP-017 Credit Detail lists every AI use with feature name and amounts | n/a (other feature or flow: not part of the Cutout room) |\n| KP-018 Credit Auto Pass keeps its own name in the Detail | n/a (other feature or flow: not part of the Cutout room) |\n| KP-019 A burst of Generate taps charges once | n/a (other feature or flow: not part of the Cutout room) |\n| KP-020 Blue credit button opens Buy Credit | n/a (other feature or flow: not part of the Cutout room) |\n| KP-021 Premium chat quota is higher, not unlimited | n/a (other feature or flow: not part of the Cutout room) |\n| KP-024 Finished AI images save to their feature tab | n/a (other feature or flow: not part of the Cutout room) |\n| KP-025 AI Exposure results go to Recent and the AI Exposure tab | n/ function md(src){

}

const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];

function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
