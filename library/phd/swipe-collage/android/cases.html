<style>
/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#1b2430; --muted:#5f6b7a; --line:#dde1e7; --head:#2f3b52;
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
  --body:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e5e9ef; --muted:#9aa5b3; --line:#2c3541; --head:#0d1117;
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
header{background:var(--head);color:#fff;padding:18px 20px;display:grid;gap:8px}
header h1{margin:0;font-size:1.35rem}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;opacity:.9}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 20px 110px;display:grid;gap:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1150px;background:var(--surface)}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:13px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
const D={"mode":"view","save":false,"feature":"phd/swipe-collage","platform":"android","title":"Swipe Collage","draft":"20261029-171116","based_on_version":null,"version":1,"approved_at":"2026-10-30T06:57:28.205Z","spec_files":[{"name":"Collage.pdf","sha256":"4d8c229b1f50e930e8ef5da943cab7a720d32f3c2fb4d8b13fb3522b785e1e24","bytes":16592266}],"rows":[{"ID":"TC-001","Section":"Entry","Precondition":"Fresh launch of the build under test","Action":"Open the Collage room from the Launcher","Expected Result":"A Swipe Collage banner with a 「NEW」 tag and 「›」 is shown at the top of the Collage room, above the Collage categories","Priority":"P1","Spec Ref":"R-001, R-003","Notes":"Banner copy differs between frames (Q-1): note the title and subtitle the app shows."},{"ID":"TC-002","Section":"Entry","Precondition":"Swipe Collage has been opened at least once from the banner","Action":"Leave the Collage room, then open it again; repeat after an app restart","Expected Result":"The banner is still shown at the top every time the Collage room is entered","Priority":"P2","Spec Ref":"R-002","Notes":""},{"ID":"TC-003","Section":"Entry","Precondition":"In the Collage room","Action":"Tap the Swipe Collage banner","Expected Result":"The Template Page titled 「Scrollable Collage」 opens: a separate room with its own category tabs, not a category inside Collage","Priority":"P1","Spec Ref":"R-004","Notes":""},{"ID":"TC-004","Section":"Entry","Precondition":"Launcher open","Action":"Look through the Launcher (and its shortcuts / tool lists) for a Swipe Collage shortcut","Expected Result":"There is no Launcher shortcut for Swipe Collage in this build; the only in-app entry is the Collage banner","Priority":"P3","Spec Ref":"R-005","Notes":""},{"ID":"TC-005","Section":"Entry","Precondition":"PhotoDirector installed, app closed; deeplink `scrollable_collage` from RD (no parameters)","Action":"Open the deeplink (adb `am start -a android.intent.action.VIEW -d \u003clink>`)","Expected Result":"PhotoDirector opens on the Swipe Collage Template Page (waterfall), with the first category 「Year End」 selected","Priority":"P2","Spec Ref":"R-007","Notes":"needs: deeplink URLs from RD (Q-10)."},{"ID":"TC-006","Section":"Entry","Precondition":"Deeplink `scrollable_collage` with the `category_guid` of a category other than Year End","Action":"Open the deeplink","Expected Result":"The Template Page opens with that category tab selected and its templates listed","Priority":"P2","Spec Ref":"R-008","Notes":"needs: deeplink URLs from RD (Q-10)."},{"ID":"TC-007","Section":"Entry","Precondition":"Deeplink `scrollable_collage` with a `template_guid`","Action":"Open the deeplink","Expected Result":"The Template Preview of that template opens directly (photo count / page count of that template)","Priority":"P2","Spec Ref":"R-009","Notes":"needs: deeplink URLs from RD (Q-10)."},{"ID":"TC-008","Section":"Entry","Precondition":"Template Preview opened by a `template_guid` deeplink","Action":"Tap 「‹」, then 「‹」 again","Expected Result":"The first ‹ goes to the Template Page; the second goes to the Collage room (or the app's previous page)","Priority":"P3","Spec Ref":"R-009, R-027, R-020","Notes":"Spec does not say where ‹ leads after a deeplink entry; record the result (Q-10)."},{"ID":"TC-009","Section":"Template Page","Precondition":"Template Page open","Action":"Look at the template list","Expected Result":"Templates are laid out as a waterfall (staggered two-column list); the title is 「Scrollable Collage」 with a 「‹」","Priority":"P2","Spec Ref":"R-010","Notes":""},{"ID":"TC-010","Section":"Template Page","Precondition":"Template Page open","Action":"Read the label under several template cards","Expected Result":"Each card shows only the photo count and the page count, e.g. 「6 photos · 3 pages」; no portrait / landscape label","Priority":"P2","Spec Ref":"R-011","Notes":""},{"ID":"TC-011","Section":"Template Page","Precondition":"Template Page open","Action":"Compare a card thumbnail with the first page in its Template Preview","Expected Result":"The card thumbnail shows the template's first page","Priority":"P3","Spec Ref":"R-012","Notes":""},{"ID":"TC-012","Section":"Template Page","Precondition":"Template Page open","Action":"Read the category tabs","Expected Result":"3 to 4 category tabs are shown; 「Year End」 is the first tab and is selected on entry","Priority":"P2","Spec Ref":"R-013","Notes":""},{"ID":"TC-013","Section":"Template Page","Precondition":"Template Page open","Action":"Tap each category tab in turn","Expected Result":"Each tab is highlighted and the list shows that category's templates","Priority":"P2","Spec Ref":"R-014","Notes":""},{"ID":"TC-014","Section":"Template Page","Precondition":"Template Page open; CMS tags at least one template NEW","Action":"Look for NEW tags on cards","Expected Result":"Templates tagged NEW in the CMS show a 「NEW」 tag; untagged templates show none","Priority":"P3","Spec Ref":"R-015","Notes":""},{"ID":"TC-015","Section":"Template Page","Precondition":"Template Page open","Action":"Look at the cards of PRO templates","Expected Result":"Each PRO template shows a 「PRO」 icon at the top right of its card; free templates show none","Priority":"P2","Spec Ref":"R-016","Notes":""},{"ID":"TC-016","Section":"Template Page","Precondition":"Template Page open","Action":"Swipe a card thumbnail to the right (horizontal swipe on the card) through all its pages","Expected Result":"The thumbnail shows that template's next pages one by one, every page of the template; the list does not scroll","Priority":"P2","Spec Ref":"R-017","Notes":""},{"ID":"TC-017","Section":"Template Page","Precondition":"Template Page open","Action":"Count the templates in all categories together","Expected Result":"20 templates in total (Day 1); note duplicates across categories","Priority":"P3","Spec Ref":"R-019","Notes":""},{"ID":"TC-018","Section":"Template Page","Precondition":"Template Page open; phone region / language set to an Asian locale, then to a Western locale","Action":"Compare the template thumbnails in the two settings","Expected Result":"The East or West thumbnail set is shown according to the setting (every page in that set)","Priority":"P3","Spec Ref":"R-018","Notes":"Which setting picks East / West is not stated (Q-12): record what changes."},{"ID":"TC-019","Section":"Template Page","Precondition":"Template Page open","Action":"Tap 「‹」","Expected Result":"Returns to the Collage room","Priority":"P2","Spec Ref":"R-020","Notes":""},{"ID":"TC-020","Section":"Template Page","Precondition":"Template Page open","Action":"Tap a template thumbnail","Expected Result":"The Template Preview of that template opens","Priority":"P1","Spec Ref":"R-021","Notes":""},{"ID":"TC-021","Section":"Template Preview","Precondition":"Template Preview of a free template","Action":"Read the screen","Expected Result":"Title 「Template」; the photo and page count (e.g. 「9 photos · 5 pages」) and the category (「Year End」) under the image; a 「Use Template」 button","Priority":"P2","Spec Ref":"R-022","Notes":""},{"ID":"TC-022","Section":"Template Preview","Precondition":"Template Preview of a template with 3+ pages","Action":"Swipe left and right on the preview","Expected Result":"The preview moves one page per swipe; the page dots follow; the shown layout is the template's default layout with sample photos","Priority":"P2","Spec Ref":"R-023, R-024","Notes":""},{"ID":"TC-023","Section":"Template Preview","Precondition":"Template Preview open","Action":"Tap 「‹」","Expected Result":"Returns to the Template Page with the same category selected","Priority":"P2","Spec Ref":"R-027","Notes":""},{"ID":"TC-024","Section":"Template Preview","Precondition":"Template Preview of a free template","Action":"Tap 「Use Template」","Expected Result":"The Canvas opens with the template's pages and layout; its empty frames show 「+」","Priority":"P1","Spec Ref":"R-025, R-029","Notes":""},{"ID":"TC-025","Section":"Template Preview","Precondition":"Signed in with a Free (non-Premium) account; Template Preview of a PRO template","Action":"Look at the preview, then tap 「Use Template」","Expected Result":"The preview shows a 「PRO」 icon at the top right; Use Template opens the Canvas with no IAP page","Priority":"P1","Spec Ref":"R-026","Notes":""},{"ID":"TC-026","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」)","Action":"Look at the Canvas","Expected Result":"Top: 「‹」, ↶ / ↷, 「Export」; bottom bar: 「Background」, 「Layers」, 「+」, 「Ratio」, 「Pages」","Priority":"P1","Spec Ref":"R-031","Notes":""},{"ID":"TC-027","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」)","Action":"Pinch to zoom the view in and out, then scroll left and right across the pages","Expected Result":"The view zooms freely and scrolls across all pages of the canvas","Priority":"P1","Spec Ref":"R-028","Notes":""},{"ID":"TC-028","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」)","Action":"Look at every hole in the layout on every page","Expected Result":"Each hole is a frame with a 「+」 (add image)","Priority":"P2","Spec Ref":"R-029","Notes":""},{"ID":"TC-029","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), every frame filled with photos; the template has a text element (「a year in pictures」)","Action":"Tap the text element and change its content, colour and font","Expected Result":"The text shows the new content, colour and font on the canvas","Priority":"P1","Spec Ref":"R-032","Notes":""},{"ID":"TC-030","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), every frame filled with photos","Action":"Drag a photo inside its frame to move its position (image focus)","Expected Result":"The photo moves inside its frame and stays where it was left","Priority":"P1","Spec Ref":"R-032","Notes":""},{"ID":"TC-031","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), every frame filled with photos","Action":"Do one of each: move a photo, flip a frame, change the background, add a sticker; then tap ↶ four times and ↷ four times","Expected Result":"Each ↶ undoes the last operation in reverse order; each ↷ redoes it","Priority":"P1","Spec Ref":"R-030","Notes":""},{"ID":"TC-032","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), at least one edit made","Action":"Tap 「‹」","Expected Result":"A 「Discard changes?」 dialog with 「Discard」 and 「Keep」 appears (same as Edit Room)","Priority":"P1","Spec Ref":"R-033","Notes":""},{"ID":"TC-033","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), at least one edit made; 「Discard changes?」 dialog open","Action":"Tap 「Keep」","Expected Result":"The dialog closes; the Canvas keeps every edit","Priority":"P1","Spec Ref":"R-033","Notes":""},{"ID":"TC-034","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), at least one edit made; 「Discard changes?」 dialog open","Action":"Tap 「Discard」","Expected Result":"Returns to the Template Preview; opening Use Template again gives the untouched template","Priority":"P1","Spec Ref":"R-033","Notes":""},{"ID":"TC-035","Section":"Canvas","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), no edit made","Action":"Tap 「‹」","Expected Result":"The 「Discard changes?」 dialog appears (the spec asks first on every ‹ from the Canvas)","Priority":"P3","Spec Ref":"R-033","Notes":"Check on device: the spec does not say whether an unedited canvas skips the dialog (Q-17)."},{"ID":"TC-036","Section":"Canvas","Precondit lt":"Width : height is 9 : 16 (short side as in R-100 / Q-8)","Priority":"P2","Spec Ref":"R-100","Notes":""},{"ID":"TC-117","Section":"Ratio","Precondition":"Ratio sheet open, a ratio applied","Action":"Tap ✕","Expected Result":"The sheet closes and the ratio stays (TBD-4 proposal)","Priority":"P3","Spec Ref":"R-086","Notes":"TBD-4 (Q-5)."},{"ID":"TC-118","Section":"Pages","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), every frame filled with photos, 3 pages, viewing page 2","Action":"Tap 「Pages」","Expected Result":"Pages opens: thumbnails of the pages joined with only a thin line between them; page 2 is selected and the small text reads 「Page 2 / 3」; ✕, ✓, bottom 「−」 「+」","Priority":"P1","Spec Ref":"R-103, R-104","Notes":""},{"ID":"TC-119","Section":"Pages","Precondition":"Pages open","Action":"Tap the thumbnail of page 3; then try to tap or drag an element inside a thumbnail","Expected Result":"Page 3 is selected (「Page 3 / 3」); elements cannot be edited here","Priority":"P2","Spec Ref":"R-105","Notes":""},{"ID":"TC-120","Section":"Pages","Precondition":"Pages open, 3 pages","Action":"Tap ≡ under a page without holding","Expected Result":"Nothing happens","Priority":"P3","Spec Ref":"R-107","Notes":""},{"ID":"TC-121","Section":"Pages","Precondition":"Pages open, 3 pages","Action":"Hold ≡ under page 1 and drag it after page 3, release","Expected Result":"While dragging the thumbnail is enlarged and translucent, 「Hold ≡ & drag to reorder」 shows and the others make room; on release page 1 is last","Priority":"P1","Spec Ref":"R-106","Notes":""},{"ID":"TC-122","Section":"Pages","Precondition":"Pages open, 3 pages","Action":"Tap ••• under page 2 › 「Duplicate page」","Expected Result":"A copy of page 2 is inserted right after page 2 (4 pages)","Priority":"P1","Spec Ref":"R-108","Notes":""},{"ID":"TC-123","Section":"Pages","Precondition":"Pages open, 3 pages","Action":"Tap ••• under page 2 › 「Delete page」","Expected Result":"Page 2 and everything on it is deleted at once, with no confirmation","Priority":"P1","Spec Ref":"R-108, R-109","Notes":""},{"ID":"TC-124","Section":"Pages","Precondition":"Pages open, 3 pages, page 1 selected","Action":"Tap the 「+」 at the end of the thumbnail row","Expected Result":"A new page is added at the end and the row scrolls to it (4 pages)","Priority":"P1","Spec Ref":"R-110","Notes":""},{"ID":"TC-125","Section":"Pages","Precondition":"Pages open, 3 pages","Action":"Tap the bottom 「+」, then the bottom 「−」","Expected Result":"「+」 adds a page at the end and scrolls to it; 「−」 removes the last page","Priority":"P2","Spec Ref":"R-110","Notes":""},{"ID":"TC-126","Section":"Pages","Precondition":"Pages open, 9 pages","Action":"Tap 「+」 once; then try the row 「+」, the bottom 「+」 and ••• › 「Duplicate page」","Expected Result":"The 10th page is added (「Page n / 10」); after that the row +, bottom + and Duplicate page are unavailable","Priority":"P1","Spec Ref":"R-111, R-112","Notes":""},{"ID":"TC-127","Section":"Pages","Precondition":"Pages open, 2 pages","Action":"Tap the bottom 「−」; then try 「−」 again and ••• › 「Delete page」","Expected Result":"One page is left (「Page 1 / 1」); then − and Delete page are unavailable","Priority":"P1","Spec Ref":"R-111, R-113","Notes":""},{"ID":"TC-128","Section":"Pages","Precondition":"Pages open","Action":"Look for undo / redo","Expected Result":"Pages has no ↶ / ↷","Priority":"P3","Spec Ref":"R-114","Notes":""},{"ID":"TC-129","Section":"Pages","Precondition":"Pages open, pages reordered and page 3 selected","Action":"Tap ✓","Expected Result":"Returns to the Canvas with the new page order, showing the selected page","Priority":"P1","Spec Ref":"R-115","Notes":""},{"ID":"TC-130","Section":"Pages","Precondition":"Pages open, no change made","Action":"Tap ✕","Expected Result":"Returns to the Canvas with no dialog","Priority":"P2","Spec Ref":"R-116","Notes":""},{"ID":"TC-131","Section":"Pages","Precondition":"Pages open, a page added and pages reordered","Action":"Tap ✕","Expected Result":"A 「Discard changes?」 dialog with 「Discard」 and 「Keep」 appears","Priority":"P1","Spec Ref":"R-116","Notes":""},{"ID":"TC-132","Section":"Pages","Precondition":"Pages 「Discard changes?」 dialog open after changes","Action":"Tap 「Keep」","Expected Result":"The dialog closes; Pages still shows the changes","Priority":"P2","Spec Ref":"R-116","Notes":""},{"ID":"TC-133","Section":"Pages","Precondition":"Pages 「Discard changes?」 dialog open after changes","Action":"Tap 「Discard」","Expected Result":"Returns to the Canvas; every page change of this visit is dropped","Priority":"P1","Spec Ref":"R-116","Notes":""},{"ID":"TC-134","Section":"Pages","Precondition":"Pages applied with ✓ after reordering","Action":"Tap ↶ on the Canvas","Expected Result":"Record whether ↶ reverts the page change","Priority":"P3","Spec Ref":"R-030","Notes":"Spec silent whether Canvas undo covers a Pages apply (Q-13)."},{"ID":"TC-135","Section":"Pages","Precondition":"An element spans the line between page 2 and 3","Action":"Open Pages, delete page 3, tap ✓","Expected Result":"Per TBD-6 proposal the whole element is deleted","Priority":"P3","Spec Ref":"R-117","Notes":"TBD-6 pending with PM (Q-7)."},{"ID":"TC-136","Section":"Export","Precondition":"Signed in with a PhotoDirector Premium account; On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), every frame filled with photos, 5 pages, free content only","Action":"Tap 「Export」","Expected Result":"The 「Save & Share」 page opens showing 「5 images」 (one image per page)","Priority":"P1","Spec Ref":"R-119, R-120","Notes":""},{"ID":"TC-137","Section":"Export","Precondition":"Export of a 5-page canvas just finished","Action":"Open the Gallery › 「PhotoDirector」 album","Expected Result":"5 new images, one per page in page order, all saved together","Priority":"P1","Spec Ref":"R-119, R-120","Notes":""},{"ID":"TC-138","Section":"Export","Precondition":"Export of a 5-page canvas just finished","Action":"Open each exported image full size","Expected Result":"No watermark on any image","Priority":"P1","Spec Ref":"R-123","Notes":""},{"ID":"TC-139","Section":"Export","Precondition":"Settings › Image Quality set to the lowest option, then the highest","Action":"Export the same canvas once per setting and check the images' pixel sizes","Expected Result":"The long side of each image follows the Image Quality setting","Priority":"P2","Spec Ref":"R-121","Notes":"TBD-7 proposes canvas size (short side 1200 px) instead (Q-8)."},{"ID":"TC-140","Section":"Export","Precondition":"Export just finished","Action":"Open My AI Artwork","Expected Result":"The exported collage is not listed there","Priority":"P2","Spec Ref":"R-124","Notes":""},{"ID":"TC-141","Section":"Export","Precondition":"Save & Share page; Instagram installed","Action":"Tap 「Instagram」","Expected Result":"Instagram opens with all exported images when it accepts several; otherwise Instagram just opens","Priority":"P2","Spec Ref":"R-122","Notes":""},{"ID":"TC-142","Section":"Export","Precondition":"Save & Share page; Facebook installed","Action":"Tap 「Facebook」","Expected Result":"Facebook opens with all exported images when it accepts several; otherwise Facebook just opens","Priority":"P2","Spec Ref":"R-122","Notes":""},{"ID":"TC-143","Section":"Export","Precondition":"Save & Share page","Action":"Tap 「More」","Expected Result":"The Android share sheet opens with all exported images","Priority":"P2","Spec Ref":"R-122","Notes":""},{"ID":"TC-144","Section":"Export","Precondition":"Save & Share page","Action":"Tap 「‹」","Expected Result":"Returns to the Canvas with every edit kept","Priority":"P2","Spec Ref":"R-125","Notes":""},{"ID":"TC-145","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; the free-export counter fresh (new install or new account); a canvas with free content only","Action":"Export and return to the Canvas three times","Expected Result":"The first two exports save with no IAP page; the 3rd save shows the IAP page (「PhotoDirector Premium」)","Priority":"P1","Spec Ref":"R-126","Notes":"Whether the IAP comes at the 3rd save or after it is not exact (Q-15)."},{"ID":"TC-146","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; counter fresh; a canvas with 10 pages and one with 1 page","Action":"Export the 10-page canvas twice, then the 1-page canvas once","Expected Result":"The IAP page comes at the 3rd export, not earlier: images are not counted","Priority":"P2","Spec Ref":"R-126","Notes":""},{"ID":"TC-147","Section":"Monetization","Precondition":"Signed in with a PhotoDirector Premium account","Action":"Export a free-content canvas 4 times","Expected Result":"No IAP page at any export","Priority":"P2","Spec Ref":"R-131","Notes":""},{"ID":"TC-148","Section":"Monetization","Precondition":"Any account, export just finished","Action":"Wait on the Save & Share page and return to the Canvas","Expected Result":"No rating dialog appears","Priority":"P3","Spec Ref":"R-127","Notes":""},{"ID":"TC-149","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; a canvas from a PRO template","Action":"Tap 「Export」","Expected Result":"The IAP page with 「Paid style applied」 appears before anything is saved","Priority":"P1","Spec Ref":"R-128","Notes":""},{"ID":"TC-150","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; a free template with a PRO frame added","Action":"Tap 「Export」","Expected Result":"The IAP page with 「Paid style applied」 appears before anything is saved","Priority":"P1","Spec Ref":"R-128","Notes":""},{"ID":"TC-151","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; a free template with a PRO texture background","Action":"Tap 「Export」","Expected Result":"The IAP page with 「Paid style applied」 appears before anything is saved","Priority":"P1","Spec Ref":"R-128","Notes":""},{"ID":"TC-152","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; PRO content IAP page shown at Export","Action":"Tap ✕","Expected Result":"The IAP page closes (as the existing IAP page); nothing is saved; the Canvas keeps its edits","Priority":"P2","Spec Ref":"R-128, R-061","Notes":"Spec says only 「同既有」; record where ✕ lands."},{"ID":"TC-153","Section":"Monetization","Precondition":"Signed in with a PhotoDirector Premium account; a canvas from a PRO template with a PRO frame and PRO texture","Action":"Tap 「Export」","Expected Result":"No IAP page; the images are saved","Priority":"P1","Spec Ref":"R-131","Notes":""},{"ID":"TC-154","Section":"Monetization","Precondition":"Signed in with a Free (non-Premium) account; free template, free content only; export counter at 0","Action":"Tap 「Export」","Expected Result":"No 「Paid style applied」 IAP page: Removal / Enhance are gated in their rooms, not here; the images save","Priority":"P2","Spec Ref":"R-129","Notes":""},{"ID":"TC-155","Section":"Monetization","Precondition":"Any account; note the credit balance (if the account shows one)","Action":"Go through a full journey: template → photos → Removal (Premium) → export","Expected Result":"No credits are charged at any step; the IAP page offers only the existing plans (no new SKU)","Priority":"P2","Spec Ref":"R-130","Notes":""},{"ID":"TC-156","Section":"Android Back","Precondition":"Template Page open","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to the Collage room","Priority":"P2","Spec Ref":"R-134","Notes":""},{"ID":"TC-157","Section":"Android Back","Precondition":"Template Preview open","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to the Template Page","Priority":"P2","Spec Ref":"R-134","Notes":""},{"ID":"TC-158","Section":"Android Back","Precondition":"On the Canvas of a Year End template (opened from Template Preview › 「Use Template」), an edit made","Action":"Press system Back","Expected Result":"Same as 「‹」: the 「Discard changes?」 dialog appears","Priority":"P1","Spec Ref":"R-134","Notes":""},{"ID":"TC-159","Section":"Android Back","Precondition":"Canvas 「Discard changes?」 dialog open","Action":"Press system Back","Expected Result":"The dialog closes and the Canvas keeps its edits (as Keep)","Priority":"P2","Spec Ref":"R-134","Notes":"Spec silent (Q-14): record."},{"ID":"TC-160","Section":"Android Back","Precondition":"Canvas with a frame or image in focus","Action":"Press system Back","Expected Result":"Record: the focus clears, or the Discard dialog appears","Priority":"P3","Spec Ref":"R-134","Notes":"Spec silent (Q-14)."},{"ID":"TC-161","Section":"Android Back","Precondition":"Photo picker opened from a frame 「+」, 1 photo selected","Action":"Press system Back","Expected Result":"Returns to the Canvas with nothing added (as the picker 「‹」)","Priority":"P2","Spec Ref":"R-134","Notes":""},{"ID":"TC-162","Section":"Android Back","Precondition":"Background sheet open (also: Add Layer, Layers, Ratio, Frame panel)","Action":"Press system Back on each sheet","Expected Result":"The sheet closes like its ✕; applied changes stay","Priority":"P2","Spec Ref":"R-134","Notes":"TBD-4 (Q-5)."},{"ID":"TC-163","Section":"Android Back","Precondition":"Custom color picker open, a colour chosen","Action":"Press system Back","Expected Result":"The picker closes like 「Cancel」 (colour not applied)","Priority":"P3","Spec Ref":"R-134","Notes":"Spec silent (Q-14)."},{"ID":"TC-164","Section":"Android Back","Precondition":"Text input from Add Layer with the keyboard open","Action":"Press system Back twice","Expected Result":"The first Back closes the keyboard; the second closes the text input like 「Cancel」","Priority":"P2","Spec Ref":"R-134","Notes":""},{"ID":"TC-165","Section":"Android Back","Precondition":"Pages open with changes","Action":"Press system Back","Expected Result":"Same as ✕: the 「Discard changes?」 dialog appears","Priority":"P1","Spec Ref":"R-134","Notes":""},{"ID":"TC-166","Section":"Android Back","Precondition":"Pages open, no change","Action":"Press system Back","Expected Result":"Same as ✕: returns to the Canvas with no dialog","Priority":"P3","Spec Ref":"R-134","Notes":""},{"ID":"TC-167","Section":"Android Back","Precondition":"Object Removal room opened from image focus","Action":"Press system Back","Expected Result":"Same as ✕: returns to the Canvas, nothing applied","Priority":"P2","Spec Ref":"R-134","Notes":""},{"ID":"TC-168","Section":"Android Back","Precondition":"Signed in with a Free (non-Premium) account; IAP page shown (any trigger)","Action":"Press system Back","Expected Result":"Same as the IAP page ✕","Priority":"P3","Spec Ref":"R-134","Notes":""},{"ID":"TC-169","Section":"Android Back","Precondition":"Save & Share page","Action":"Press system Back","Expected Result":"Same as 「‹」: returns to the Canvas with the edits kept","Priority":"P2","Spec Ref":"R-134","Notes":""}],"previous":{},"requirements":"# Swipe Collage — requirements (android)\nSpec: Collage.pdf (PM / Design \"Demo + Spec — Scrollable Collage (26 11E)\", spec set 2026-10-29)\n\nSource tags: `[PM:\u003cboard>; \u003cspec ID>]`, board IDs from `specs/2026-10-29/extracted/boards.json`, spec IDs as the board\nprints them (`D1-07`, `F4` …). The file is a single PM-owned Figma export that also carries the UI; there is no separate\nDesign file, so its mockups give the UI strings and its 【Requirement】 blocks the rules. Mockups are iPhone frames;\nAndroid differences are stated where the spec names them (photo picker cap, D2-06) and in \"System back\".\nRequest ledger: REQ-001 (this table).\n\n## Entry\n- R-001 [PM:states Collage Room · banner; D1-07, D1-16] On entering the Collage room a Swipe Collage banner is shown at the top of the room (Collage has no AI / Traditional categories).\n- R-002 [PM:states Collage Room · banner; D1-07] The banner is shown every time Collage is entered; it is not removed by default (also after it was used).\n- R-003 [PM:entry-banner, states Collage Room · banner; D1-07] The banner carries a 「NEW」 tag and 「›」; title / subtitle copy: see Q-1.\n- R-004 [PM:flow-table, states Collage Room · banner; D1-07, D0-04] Tapping the banner opens the Template Page 「Scrollable Collage」, an independent new room, not a Collage category.\n- R-005 [PM:overview; D0-04, D0-06, D1-08] No Launcher shortcut for the feature in this build (not in this spec; not built).\n- R-006 [PM:overview; D0-04, D0-06] Swipe Collage output is not added to My AI Artwork. (Checked as R-124.) Walked by: TC-140.\n- R-007 [PM:entry-deeplink, states Template Page; D1-09] Deeplink `scrollable_collage` lands on the Template Page (waterfall).\n- R-008 [PM:entry-deeplink, cms; D1-09, D2-07] A deeplink with `category_guid` selects that category on the Template Page.\n- R-009 [PM:entry-deeplink, cms; D1-09] A deeplink with `template_guid` opens that template's Template Preview directly.\n\n## Template Page\n- R-010 [PM:states Template Page · default; D1-01] The Template Page is titled 「Scrollable Collage」 with 「‹」 and lists templates as a waterfall.\n- R-011 [PM:states Template Page · default; D1-01] Each card shows only the default photo count and page count (「6 photos · 3 pages」); no portrait / landscape label.\n- R-012 [PM:states Template Page · default; D2-08, F16] A card thumbnail shows the template's first page.\n- R-013 [PM:states Template Page · default, cms; D2-03, D2-07] 3–4 categories in CMS order with 「Year End」 first (selected on entry, as drawn).\n- R-014 [PM:flow-table; D2-07] Tapping a category tab switches the list to that category.\n- R-015 [PM:states Template Page · default, cms; D2-03, D2-07] NEW tags come from the CMS tag.\n- R-016 [PM:states Template Page · default, cms; D3-02] A CMS-PRO template shows a 「PRO」 icon at the card's top right.\n- R-017 [PM:states Template Page · thumb_swipe, flow-table; D2-08, F16] Swiping a card thumbnail right shows that template's next pages (as SCRL); every page is shown.\n- R-018 [PM:states Template Page · thumb_swipe, cms, plan-notes; F16] Thumbnails come in East and West sets; every page of the set is shown in the UI. Which set a user sees is not stated (Q-12).\n- R-019 [PM:states Template Page · default, cms; F16] Day 1 has 20 templates.\n- R-020 [PM:flow-table; D1-07] Template Page 「‹」 returns to the Collage room.\n- R-021 [PM:flow-table; D1-02] Tapping a thumbnail opens the Template Preview.\n\n## Template Preview\n- R-022 [PM:states Template Preview · default; D1-02] The preview (title 「Template」) shows the photo / page count (「9 photos · 5 pages」), the category (「Year End」) and 「Use Template」.\n- R-023 [PM:states Template Preview · default, flow-table; D2-09] Swiping left / right moves page by page (as SCRL).\n- R-024 [PM:states Template Preview · default; F1] The preview shows the template's default layout.\n- R-025 [PM:states Template Preview · default, flow-table; D1-02] 「Use Template」 opens the Canvas.\n- R-026 [PM:states Template Preview · pro; D3-02, D3-04] A CMS-PRO template shows a 「PRO」 icon at the top right; a free user can use it, IAP comes only at export.\n- R-027 [PM:flow-table; D1-02] Template Preview 「‹」 returns to the Template Page.\n\n## Canvas\n- R-028 [PM:states Canvas · default; D1-03] The canvas has several pages; the view zooms freely and scrolls left / right.\n- R-029 [PM:states Canvas · default, pm-sketch; F2] Every hole is an add-image frame with 「+」.\n- R-030 [PM:states Canvas · default, flow-table; D1-13] Top 「↶」 / 「↷」 undo / redo every canvas operation.\n- R-031 [PM:states Canvas · default; D1-04] Bottom bar 「Background」 / 「Layers」 / 「+」 / 「Ratio」 / 「Pages」; top 「‹」, undo / redo, 「Export」.\n- R-032 [PM:states Canvas · default; D1-04] Every element is adjustable: text colour, content and font; image position.\n- R-033 [PM:leave-notes, entry-banner, flow-table; D1-10] Canvas 「‹」 shows 「Discard changes?」 with 「Discard」 / 「Keep」 (as Edit Room); Discard returns to the Template Preview, Keep stays with the edits.\n- R-034 [PM:leave-notes; D1-10] When the app was killed during editing, a 「Continue editing?」 dialog (as Edit Room) appears next time; continuing restores the project.\n- R-035 [PM:leave-notes; D1-18] Only the latest editing record is restored (one task at a time).\n\n## Photos\n- R-036 [PM:flow-table, entry-banner, states Photo Picker; F4, D2-06] Tapping a frame's 「+」 opens the photo picker, the same as the Collage picker; its 「‹」 returns to the Canvas.\n- R-037 [PM:states Canvas · default, Photo Picker; F4, D2-06] One or several photos can be imported; the limit is the number of empty frames (「Select up to 3 photos」, 「Done (2)」).\n- R-038 [PM:states Photo Picker; D2-06] The import limit is capped at 20 on both platforms; Android is not held to its default 6.\n- R-039 [PM:states Photo Picker, flow-table; F4] 「Done」 fills the empty frames in order and returns to the Canvas.\n- R-040 [PM:pm-sketch; F4] A single photo can be imported too.\n\n## Frame focus\n- R-041 [PM:states Canvas · frame_focus, pm-sketch; F6] Tapping a frame selects it (「Frame selected」); a tap in frame focus moves to image focus, a tap in image focus back to frame focus.\n- R-042 [PM:states Canvas · frame_focus; F7, D1-32, D1-05] Frame focus shows floating Delete / Duplicate / Lock icons.\n- R-043 [PM:states Canvas · frame_focus; F9] The frame toolbar holds 「Opacity」 「Shadow」 「Flip H」 「Flip V」 「Duplicate」 「Lock」 「Delete」.\n- R-044 [PM:states Canvas · frame_focus, flow-table; F9] Delete (floating or toolbar) removes the whole frame.\n- R-045 [PM:flow-table; F9, D1-05] Duplicate copies the frame.\n- R-046 [PM:flow-table; F9] Flip H / Flip V flip the frame immediately.\n- R-047 [PM:flow-table, tbd; F9] Opacity / Shadow open controls for the frame (TBD-1: the Collage room's sliders, Q-2).\n- R-048 [PM:states Canvas · frame_focus, pm-sketch; F3] A frame can be scaled.\n\n## Image focus\n- R-049 [PM:states Canvas · image_focus; F8, D1-35] Image focus (「Image selected」) has one horizontally scrolli   if(changes.length){h+=`<span class="sep"></span>`+[['',T('allChanges')??'All changes'],...changes.map(c=>[c,T(c)??c])].map(([v,l])=>`<button class="chip" data-k="change" data-v="${v}" aria-pressed="${F.change===v}">${l}${v?` <b>${cnt('change',v)}</b>`:''}</button>`).join('')}
  if(REVIEW)h+=`<span class="sep"></span>`+[['',T('anyDecision')??'Any decision'],...states.map(s=>[s,T(s)??s])].map(([v,l])=>`<button class="chip" data-k="state" data-v="${v}" aria-pressed="${F.state===v}">${l}${v?` <b>${cnt('state',v)}</b>`:''}</button>`).join('');
  $('#filters').innerHTML=h;
  $('#q').oninput=e=>{F.q=e.target.value;body()};
  $('#sec').onchange=e=>{F.section=e.target.value;body()};
  $('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;filters();body()});
}
function visible(r){
  const z=L==='zh'&&ZH[r.cur.ID]?' '+Object.values(ZH[r.cur.ID]).join(' '):'';
  const t=(r.cur.ID+' '+FIELDS.map(f=>r.cur[f]).join(' ')+z).toLowerCase();
  return (!F.q||t.includes(F.q.toLowerCase()))&&(!F.section||(r.cur.Section||'(no section)')===F.section)&&(!F.change||(r.cur.Change||'')===F.change)&&(!F.state||state(r)===F.state);
}
function cell(r,f){
  const prev=D.previous[r.cur.ID];
  const was=prev&&r.cur.Change==='modified'&&(prev[f]??'')!==(r.orig[f]??'')?`<div class="was">${esc(prev[f])}</div>`:'';
  const z=L==='zh'&&f!=='Spec Ref'?ZH[r.cur.ID]?.[f]:'';
  const zh=z?`<div class="zh${(r.cur[f]??'')!==(r.orig[f]??'')?' stale':''}" data-stale="${esc(T('stale'))}">${esc(z)}</div>`:'';
  return `<td>${zh}<textarea data-id="${esc(r.cur.ID)}" data-f="${f}" rows="2">${esc(r.cur[f])}</textarea>${was}</td>`;
}
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${T(ch)??ch}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${T(st)??st}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:[PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(r.cur.ID)}" title="Coverage: where in the spec this case comes from and the controls it presses">Coverage →</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(r.cur.ID)}" title="Progress: the segment that runs this case and its latest result">Progress →</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(r.cur.ID)}" title="Results: what each run found, with screenshots">Results →</a>`].filter(Boolean);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  const why=(L==='zh'&&ZH[r.cur.ID]?.['Change Reason'])||r.cur['Change Reason'];
  return `${esc(r.cur.ID)}<div>${badges}</div>${spec}${why?`<div class="reason">${esc(why)}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(secZh(s))}${L==='zh'&&secZh(s)!==s?` <span class="note">${esc(s)}</span>`:''} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="${esc(T('addTitle')??'Describe new cases in your own words; they become rows in the next draft')}">${T('add')??'+ Add case'}</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>${T('noteHead')??'New case notes'}</b><span>${T('noteHelp')??'Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.'}</span><button class="add" data-del="${esc(n.id)}">${T('remove')??'Remove'}</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="${esc(T('notePh')??'e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat')}">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">${T('keep')??'Keep'}</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">${T('delete')??'Delete'}</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">${T('noMatch')??'No cases match these filters.'}</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm(T('removeConfirm')??'Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  if(L==='zh'){$('#counts').innerHTML=REVIEW?T('counts',fin,c('kept'),c('edited'),c('added'),c('deleted'),nn):T('countsView',rows.length);return}
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
applyLang();header();filters();body();counts();focusRow();
</script>
</body>
