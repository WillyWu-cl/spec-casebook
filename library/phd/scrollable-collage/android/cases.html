<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollable Collage Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

sign frame yet (Design 2026-10-29)"},{"ID":"TC-143","Section":"PRO content and IAP","Precondition":"Android phone, PhotoDirector signed in, Free tier; a free template with 2 pages opened, frames filled; no PRO content","Action":"1. Export and 「Save all 2 images」\n2. Repeat the export and save twice more","Expected Result":"The first two saves go through; the third save opens the IAP page (counted per export, not per image: 4 images saved before it)","Priority":"P1","Spec Ref":"R-158","Notes":"PM-only: no Design frame yet (Design 2026-10-29)"},{"ID":"TC-144","Section":"PRO content and IAP","Precondition":"Android phone, PhotoDirector signed in, Pro tier; a free template opened, frames filled","Action":"Export and save 3 times","Expected Result":"No IAP page on any save","Priority":"P2","Spec Ref":"R-158","Notes":"PM-only: no Design frame yet (Design 2026-10-29)"},{"ID":"TC-145","Section":"PRO content and IAP","Precondition":"Android phone, PhotoDirector signed in, Free tier; the IAP page opened by 「Export」 with PRO content","Action":"Tap the IAP page's ✕","Expected Result":"The IAP page closes (canvas or Save & Share, as PM answers Q-15); the edits are kept","Priority":"P2","Spec Ref":"R-160","Notes":"Q-15. PM-only: no Design frame yet (Design 2026-10-29)"},{"ID":"TC-146","Section":"Light and dark mode","Precondition":"Android phone, PhotoDirector signed in, Free tier; the phone in Light appearance (Settings › Display › Light mode)","Action":"1. Open the Collage room banner, Template Page, Template Preview and the canvas\n2. Open Background, Layers, Ratio, Pages and Add Layer","Expected Result":"Every screen shows the light design (light surfaces, dark icons), as the Design's light set","Priority":"P2","Spec Ref":"R-162","Notes":"Q-16: follows the system appearance?"},{"ID":"TC-147","Section":"Light and dark mode","Precondition":"Android phone, PhotoDirector signed in, Free tier; the phone in Dark appearance","Action":"1. Open the Collage room banner, Template Page, Template Preview and the canvas\n2. Open Background, Layers, Ratio, Pages and Add Layer","Expected Result":"Every screen shows the dark design (dark surfaces, light icons), as the Design's dark set","Priority":"P2","Spec Ref":"R-162","Notes":"Q-16"},{"ID":"TC-148","Section":"Tracking","Precondition":"Android phone, PhotoDirector signed in, Free tier; the app's analytics events visible (log pull or RD event viewer)","Action":"1. Open the canvas from the Collage banner\n2. Open the canvas from a deeplink with template_guid","Expected Result":"ScrollableCollage_Canvas_Appear is sent each time, with from = Collage_Banner, then from = Deeplink, and the template_guid","Priority":"P3","Spec Ref":"R-163","Notes":"Names tentative; parked until an event log is available"},{"ID":"TC-149","Section":"Tracking","Precondition":"Android phone, PhotoDirector signed in, Free tier; analytics events visible; a 3-page canvas at 4:5 with 4 photos","Action":"Export and save all","Expected Result":"ScrollableCollage_Export_Done is sent with template_guid, page_count = 3, photo_count = 4, ratio = 4:5","Priority":"P3","Spec Ref":"R-164","Notes":"Names tentative; parked until an event log is available"},{"ID":"TC-150","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Swipe Collage Template Page open","Action":"Press system Back","Expected Result":"The Collage room shows (as ‹)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-151","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Template Preview open","Action":"Press system Back","Expected Result":"The Template Page shows (as ‹)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-152","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; canvas open with one edit","Action":"Press system Back","Expected Result":"「Discard changes?」 appears (as ‹)","Priority":"P2","Spec Ref":"R-167, R-138","Notes":""},{"ID":"TC-153","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; 「Discard changes?」 shown over the canvas","Action":"Press system Back","Expected Result":"The dialog closes and the canvas keeps its edits (as 「Keep」)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-154","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; photo picker opened from a frame +","Action":"Press system Back","Expected Result":"The canvas shows with nothing imported (as ‹)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-155","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Add Layer open","Action":"Press system Back","Expected Result":"Add Layer closes; the canvas shows","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-156","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Add Layer › 「Text」 open with the keyboard up","Action":"Press system Back","Expected Result":"The keyboard closes first; a second Back leaves the text input","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-157","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; each of Background, Layers, Ratio and the Frame panel opened in turn","Action":"Press system Back","Expected Result":"Each sheet closes like its ✕ (Q-10)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-158","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Background custom colour picker open","Action":"Press system Back","Expected Result":"The picker closes without applying (as 「Cancel」)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-159","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Pages open with one page deleted","Action":"Press system Back","Expected Result":"「Discard changes?」 appears (as ✕)","Priority":"P2","Spec Ref":"R-167, R-136","Notes":""},{"ID":"TC-160","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Pages ••• menu open","Action":"Press system Back","Expected Result":"The menu closes; Pages stays","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-161","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Object Removal opened from image focus","Action":"Press system Back","Expected Result":"The canvas shows with nothing applied (as ✕)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-162","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; IAP page opened from Export","Action":"Press system Back","Expected Result":"The IAP page closes (as ✕)","Priority":"P2","Spec Ref":"R-167","Notes":""},{"ID":"TC-163","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in, Free tier; Save & Share open","Action":"Press system Back","Expected Result":"The canvas shows with the edits (as ‹)","Priority":"P2","Spec Ref":"R-167","Notes":""}],"previous":{},"requirements":"# Scrollable Collage — requirements (android)\nSpec: Scrollable Collage - PM and Design Figma.md (Figma-only spec set 2026-11-05: PM page 2171:2 「26 11E Scrollable Collage (year end)」, Design page 0:1 「20261029_Swipe Collage」)\n\nSource order: Design (2026-10-29) over PM, except the PM 「Save page」 11/3 update, which is newer (analysis.md pass 7). Decision ids in brackets in the PM ([D1-07], [F4]) are the PM's own. Feature name: the Design and the app say 「Swipe Collage」 (Q-1).\n\n## Entry\n- R-001 [PM:pm-header D0-03, D0-04; PM:pm-ui-1 D0-04, D1-16] Swipe Collage is a separate new room (not a new category inside Collage), entered from a banner at the top of the Collage room; the rest of the Collage room is unchanged\n- R-002 [DS:design-light-entry 「Collage Room · banner (NEW)」 1:238; PM:pm-ui-1 D1-07] Entering the Collage room shows the banner 「Try Swipe Collage!」 with the line 「Create the perfect year-end recap post.」 at the top (PM mockup: 「Try Scrollable Collage!」 / 「Swipe-able multi-page collage」, Q-1)\n- R-003 [PM:pm-ui-1 D1-07] The banner is shown every time the Collage room is entered; it is not removed after it was tapped\n- R-004 [PM:pm-flow D1-09; PM:pm-ui-1 D1-09] Deeplink scrollable_collage opens the Template Page\n- R-005 [PM:pm-flow D1-09; PM:pm-ui-1 D2-07] Deeplink scrollable_collage with category_guid opens the Template Page on that category\n- R-006 [PM:pm-flow D1-09; PM:pm-ui-1 D1-09] Deeplink scrollable_collage with template_guid opens that template's Template Preview directly\n- R-007 [DS:design-launcher 「entry」 199:3566 (2026-11-09); PM:pm-header D0-04, D0-06, D1-08] The Launcher's Features grid shows a 「Swipe Collage」 shortcut (Swipe Collage icon, no NEW / HOT badge) after 「AI Art」 on the first page. The PM header and the Design overview still say the Launcher shortcut is not in this build; the newer Design frame wins (Q-21)\n- R-168 [DS:design-launcher 「entry」 199:3566 (2026-11-09)] Tapping the Launcher's 「Swipe Collage」 shortcut opens Swipe Collage: the Template Page, as the Collage room banner does (no arrow drawn; Q-21)\n- R-008 [PM:pm-header D0-04; PM:pm-ui-4 D0-06] Swipe Collage projects and exports never appear in My AI Artwork\n- R-009 [PM:pm-header D4-01; PM:pm-save-iap D4-01] Swipe Collage is not generative: it charges no credits and opens no new purchase item (SKU)\n\n## Template Page\n- R-011 [DS:design-light-entry 「Template Page · default (NEW)」 3:336] The Template Page has the title 「Swipe Collage」, a ‹ back button and category tabs (Design: 「Year End」, 「Category1」, 「Category2」)\n- R-012 [PM:pm-ui-1 D2-03, D2-07] There are 3–4 categories in the order the CMS sets, 「Year End」 first\n- R-013 [PM:pm-button-next-step D2-07] Tapping a category tab switches the list to that category's templates\n- R-014 [PM:pm-ui-1 D1-01] Templates are shown as a waterfall (masonry) list\n- R-015 [PM:pm-ui-1 D1-01; DS 3:336] Each card shows only the default photo count and page count, 「N photos · M pages」 (e.g. 「9 photos · 5 pages」), and no portrait / landscape label\n- R-016 [PM:pm-ui-1 D2-08] Each card's thumbnail shows the template's first page\n- R-017 [PM:pm-ui-1 D2-08; PM:pm-button-next-step D2-08] Swiping a card to the right shows that template's next pages, as in SCRL (the list does not move)\n- R-018 [PM:pm-ui-1 F16; PM:pm-scrl] Templates have Eastern and Western thumbnails, one image per page, and every page is shown in the UI (which set a user sees: Q-3)\n- R-019 [PM:pm-ui-1 D2-03, D2-07] A template the CMS tags NEW shows a 「NEW」 tag\n- R-020 [PM:pm-ui-1 D3-02] A template the CMS sets to PRO (usageType purchase) shows a PRO icon at the top right of its card\n- R-021 [PM:pm-ui-1 F16; PM:pm-scrl] Day 1 has 20 templates in total across the categories\n\n## Template Preview\n- R-025 [DS:design-light-entry 「entry_launcher2」 18:386; PM:pm-ui-1 D1-02] Template Preview has the title 「Template」, the category name, the template's 「N photos · M pages」 and the button 「Use Template」\n- R-026 [PM:pm-ui-1 D2-09; PM:pm-button-next-step D2-09] Swiping left / right on the preview moves page by page through the template\n- R-027 [PM:pm-ui-1 D3-02] A PRO template shows the PRO icon on its Template Preview\n- R-028 [PM:pm-ui-1 D3-04; PM:pm-save-iap D3-04] A Free user can open a PRO template with 「Use Template」 and edit it; the IAP page comes only at Export\n- R-029 [PM:pm-ui-1 F1; PM:pm-scrl] The thumbnail and preview show the template's default layout, and 「Use Template」 opens the canvas in that same layout (background, frames, texts, photo slots)\n\n## Canvas\n- R-033 [PM:pm-ui-2 D1-03; PM:pm-header D0-03] The canvas is one multi-page canvas: the view can be zoomed freely (pinch) and scrolled left / right across the pages\n- R-034 [DS 「canvas_default」 69:6711; PM:pm-ui-2 D1-04, D1-13] The canvas has 「Background」, 「Layers」, +, 「Ratio」 and 「Pages」 at the bottom and under them ✕, ↶ undo, ↷ redo and ✓; there is no top bar (the PM mockups put ‹ and 「Export」 at the top: Q-20)\n- R-035 [PM:pm-ui-2 F2; PM:pm-scrl] Every empty-looking slot is an add-image frame showing +\n- R-036 [PM:pm-ui-2 D1-13; PM:pm-button-next-step D1-13] Undo / redo cover every operation on the canvas (import, move, resize, swap, delete, duplicate, lock, frame style, background, ratio, Pages changes once applied, Removal / Enhance results)\n- R-037 [PM:pm-ui-2 D1-04] Every element can be adjusted: a text's colour, content and font, and an image's position\n- R-038 [PM:pm-ui-2 F3; PM:pm-scrl] A frame can be resized on the canvas\n- R-039 [PM:pm-ui-2 F13; PM:pm-scrl] An element belongs to the page that holds its centre and moves with that page when pages are reordered; an element that spans two pages still spans pages after the move\n\n## Photo import\n- R-040 [PM:pm-flow F4; PM:pm-button-next-step F4] Tapping a frame's + opens the photo picker (the Collage photo picker)\n- R-041 [DS 「photo_picker」 23:531] The photo picker shows 「Please select 3 photos to continue.」 and a counter 「(3/3)」 for a template with 3 empty frames, with the tabs 「Photo」 and 「Stock」 and the albums (PM mockup: 「Select up to 3 photos」, 「Done (2)」; Q-4)\n- R-042 [PM:pm-ui-4 D2-06; PM:pm-scrl] One import takes at most as many photos as there are empty frames on the canvas right now, and never more than 20 on both platforms (Android is not held to its default 6)\n- R-043 [PM:pm-ui-2 F4; PM:pm-scrl] One photo or several can be imported in one go (fewer than the empty frames is allowed; Q-4)\n- R-044 [PM:pm-ui-4 F4; PM:pm-button-next-step F4] Confirming the picker (Design: the orange ✓ beside the counter; PM: 「Done」) fills the empty frames in order (left → right, top → bottom, page by page) and returns to the canvas; the picked photos show in a tray at the bottom\n\n## Frame focus\n- R-048 [PM:pm-ui-2 F6; PM:pm-scrl; DS note on 「canvas_img_focus」] Tapping a frame selects the frame (frame focus); tapping it again selects its image (image focus); tapping in image focus goes back to frame focus\n- R-049 [DS 「canvas_frame_focus」 33:2230; PM:pm-ui-2 F9] Frame focus shows the frame tools 「Opacity」, 「Shadow」, 「Flip H」, 「Flip V」, 「Duplicate」, 「Lock」 and Delete (the whole frame)\n- R-050 [PM:pm-ui-2 F7, D1-32; PM:pm-scrl] Frame focus shows floating buttons Delete, Duplicate and Lock (icons) at the frame\n- R-051 [PM:pm-button-next-step F9; PM:pm-ui-2 F9] Delete in frame focus removes the whole frame with its photo\n- R-052 [PM:pm-button-next-step F9] Duplicate in frame focus adds a copy of the frame (with its photo)\n- R-053 [PM:pm-button-next-step F9] Flip H / Flip V in frame focus flip the frame at once\n- R-054 [PM:pm-draft-tbd TBD-1; PM:pm-button-next-step F9] Opacity and Shadow open the Collage room's Opacity / Shadow sliders and change the frame (PM proposal, TBD-1: Q-6)\n- R-055 [PM:pm-ui-2 D1-05] A selected element can be deleted, duplicated or locked\n\n## Image focus and tools\n- R-056 [DS 「canvas_img_focus」 28:1621; PM:pm-ui-2 F8, D1-35] Image focus shows one horizontally scrolling feature bar: 「Replace」, 「Flip H」, 「Flip V」, 「Adjust」, 「Filter」, 「Removal」, 「Enhance」 (the Design spells 「Fliter」: Q-7), with 「Image selected」\n- R-057 [PM:pm-button-next-step F8] 「Replace」 opens the photo picker and the chosen photo replaces the frame's photo\n- R-058 [PM:pm-button-next-step F8] 「Flip H」 / 「Flip V」 in image focus flip the image inside its frame at once\n- R-059 [PM:pm-button-next-step F8; PM:pm-ui-2 F8, D1-35] 「Adjust」 and 「Filter」 work as in the Collage room and change only the focused image\n- R-060 [PM:pm-ui-2 F8; PM:pm-scrl] Delete in image focus removes the photo: the frame becomes empty and shows the + add-image icon again\n- R-061 [PM:pm-ui-2 D3-01; PM:pm-save-iap D3-01; PM:pm-flow D3-01] 「Removal」 and 「Enhance」 carry a premium (PRO) tag in the feature bar\n- R-062 [PM:pm-flow D1-11; PM:pm-ui-2 D1-11] A Pro user who applies (✓) Removal or Enhance gets the result in place of the frame's photo, back on the canvas in image focus; it can be undone and is not saved to the photo album\n- R-063 [PM:pm-flow D1-11] ✕ in Removal / Enhance applies nothing and returns to the canvas\n- R-064 [PM:pm-flow D3-01, D1-43; PM:pm-ui-2 D3-01] A Free user who applies (✓) Removal or Enhance gets the existing IAP page (「PhotoDirector Premium」); nothing is applied\n- R-065 [PM:pm-ui-4 D3-01; PM:pm-save-iap D3-01] Removal / Enhance are gated when applied in their room, never again at Export\n\n## Swap and frame styles\n- R-076 [PM:pm-ui-2 F5; PM:pm-scrl; PM:pm-button-next-step F5] Long-pressing an image and dropping it on another frame swaps the two photos (PM mockup hint 「Long press & drag to swap」)\n- R-077 [PM:pm-ui-2 D1-20] Inside a multi-photo frame, long-pressing an image and dropping it on another cell of the same frame swaps the two\n- R-078 [PM:pm-ui-2 D1-19; PM:pm-ui-3 D1-19] Frames are single-photo (e.g. polaroid) or multi-photo (e.g. film strip)\n- R-079 [PM:pm-ui-2 D1-21; PM:pm-draft-tbd TBD-2] The frame style is switched from the frame toolbar (a 「Frame」 tool, TBD-2: Q-8), not by dragging\n- R-080 [PM:pm-ui-2 D1-21] Switching a single-photo frame to a multi-photo one puts the photo in the first cell (left → right, top → bottom); the other cells show + add image\n- R-081 [PM:pm-ui-2 D1-22] Switching a multi-photo frame to a single-photo one keeps the first photo and deletes the rest\n- R-082 [PM:pm-ui-2 D1-22] Switching a multi-photo frame to one with fewer cells (N) keeps the first N photos in left → right, top → bottom order and deletes the rest\n- R-083 [PM:pm-ui-2 D1-22] Photos deleted by a frame switch do not come back when switching back to a multi-photo frame; only undo / redo bring them back\n\n## Lock\n- R-084 [PM:pm-ui-4 D1-33; PM:pm-scrl] A locked frame cannot be dragged, resized or rotated on the canvas; focus shows 「Frame locked」\n- R-085 [PM:pm-ui-4 D1-33; PM:pm-button-next-step D1-33] A locked frame in focus still shows its feature bar, with every tool disabled except 「Duplicate」, 「Unlock」 and 「Delete」\n- R-086 [PM:pm-ui-4 D1-33, D1-32] A locked frame shows the floating buttons Delete, Duplicate and Unlock\n- R-087 [PM:pm-ui-4 D1-34; PM:pm-scrl] A locked image cannot be dragged or zoomed inside its frame; focus shows 「Image locked」\n- R-088 [PM:pm-ui-4 D1-34, D1-35; PM:pm-button-next-step D1-34] A locked image in focus still shows the one feature bar, with every tool disabled except 「Unlock」 and 「Delete」; its floating buttons are Delete, Duplicate and Unlock\n- R-089 [PM:pm-ui-4 D1-32; PM:pm-button-next-step D1-32] Unlock (floating or toolbar) makes the frame / image editable again and returns to normal focus\n- R-090 [PM:pm-ui-4 D1-33; PM:pm-ui-3 D1-39, D1-33] Deleting a page or reducing pages in Pages deletes the locked frames on it too\n\n## Add Layer\n- R-091 [DS 「Add Layer」 frame 49:1511; PM:pm-ui-3 F11] + opens 「Add Layer」 with five functions 「Image」, 「Text」, 「Sticker」, 「Frame」, 「Text Bubble」, and nothing for video, files, grids, shapes or drawing\n- R-092 [PM:pm-button-next-step D1-42; PM:pm-draft-tbd TBD-5] 「Image」 opens the photo picker; the chosen photo is added to the canvas as a new single-photo frame holding it (TBD-5: Q-9)\n- R-093 [PM:pm-flow D1-14, D1-42; DS 「2_add_text」 54:1487] 「Text」 opens the Collage text input with the keyboard; finishing adds the text to the canvas\n- R-094 [PM:pm-flow D1-14, D1-42; DS 「3_Add_Sticker」 54:1835] 「Sticker」 opens the Edit Room sticker panel; tapping a sticker adds it to the canvas\n- R-095 [PM:pm-ui-3 D1-14, D1-42, D1-19, F2; DS 「4_frame」 54:2110] 「Frame」 opens the new Frame panel: square thumbnails, each labelled with how many photos it holds (「1 photo」, 「3 photos」); tapping one adds that frame to the canvas\n- R-096 [PM:pm-ui-3 D2-07, D3-02, F17] Frames are new CMS content (single- or multi-photo masks); NEW frames show a 「NEW」 tag and PRO frames     try{const res=await fetch('answers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({by:$('#qBy').value.trim(),items})});const j=await res.json();if(!res.ok)throw new Error(j.error||res.status);
      D.answers=j.answers;qEdits={};try{localStorage.removeItem(QKEY)}catch(e){}questions();body();toast('Answers saved. Tell the agent they are in; it updates the rows.')}
    catch(e){$('#qSt').textContent='Not saved: '+e.message}};
}
function openQuestion(id){const el=document.getElementById('q-'+id);if(!el)return;$('#qBox').open=true;
  document.querySelectorAll('.qitem.hit').forEach(x=>x.classList.remove('hit'));el.classList.add('hit');el.scrollIntoView({block:'center'});el.querySelector('textarea')?.focus({preventScroll:true})}
function header(){
  const plat=D.platform==='ios'?'iOS':'Android';
  $('#h').textContent=`${D.title} · ${plat} · ${REVIEW?T('cases')??'Cases':T('approvedCases')??'Approved test cases'}`;
  const f=[];
  if(REVIEW){f.push(D.based_on_version?T('updates',D.based_on_version)??`Approved table v${D.based_on_version}`:T('noApproved')??'No approved table yet');f.push(`${/^edit-/.test(D.draft)?T('workCopy')??'Working copy':T('draft')??'Draft'} <code>${esc(D.draft)}</code>`);}
  else f.push(T('version',D.version,esc((D.approved_at||'').slice(0,10)))??`Version ${D.version} · approved ${esc((D.approved_at||'').slice(0,10))}`);
  f.push(`${T('spec')??'Spec: '}${D.spec_files.map(s=>esc(s.name)).join(', ')}`);
  $('#facts').innerHTML=f.map(x=>`<span>${x}</span>`).join('');
  if(D.update_plan){$('#planBox').hidden=false;$('#planBox').open=true;$('#plan').innerHTML=md(D.update_plan)}
  if(D.requirements){$('#reqBox').hidden=false;$('#req').innerHTML=md(D.requirements)}
  if(!REVIEW){document.body.classList.add('view');$('#decHead').hidden=true;$('#copyDec').hidden=true;$('#save').hidden=true}
  if(REVIEW&&!D.save){$('#save').disabled=true;$('#save').title=T('noSave')??'Open this page through scripts/review.ts to save.'}
  $('#foot').textContent=(REVIEW?T('foot')??'Edits and new-case notes are kept in this browser until you save. Save writes the approved CSV, keeps the previous version in history/, regenerates the Excel and HTML views, and hands new-case notes to the agent for the next draft.':T('footView')??'Read-only view generated from cases.csv.')+(L==='zh'&&!Object.keys(ZH).length?' '+T('noZh'):'');
}
let wide=false;try{wide=!!localStorage.getItem('cases-wide')}catch(e){}
function filters(){
  $('#tbl').classList.toggle('slim',!wide);
  const cnt=(k,v)=>rows.filter(r=>k==='change'?(r.cur.Change||'')===v:state(r)===v).length;
  const changes=['new','modified','removed','unchanged'].filter(v=>cnt('change',v));
  const states=['kept','edited','added','deleted'];
  let h=`<input type="search" id="q" placeholder="${esc(T('search')??'Search ID or text')}" value="${esc(F.q)}"><select id="sec"><option value="">${T('allSections')??'All sections'} (${rows.length})</option>${sections().map(s=>`<option value="${esc(s)}"${F.section===s?' selected':''}>${esc(secZh(s))}</option>`).join('')}</select>`;
  if(changes.length){h+=`<span class="sep"></span>`+[['',T('allChanges')??'All changes'],...changes.map(c=>[c,T(c)??c])].map(([v,l])=>`<button class="chip" data-k="change" data-v="${v}" aria-pressed="${F.change===v}">${l}${v?` <b>${cnt('change',v)}</b>`:''}</button>`).join('')}
  if(REVIEW)h+=`<span class="sep"></span>`+[['',T('anyDecision')??'Any decision'],...states.map(s=>[s,T(s)??s])].map(([v,l])=>`<button class="chip" data-k="state" data-v="${v}" aria-pressed="${F.state===v}">${l}${v?` <b>${cnt('state',v)}</b>`:''}</button>`).join('');
  h+=`<label class="colsw"><input type="checkbox" id="cols"${wide?' checked':''}> ${T('cols')??'Priority, Spec Ref, Notes'}</label>`;
  $('#filters').innerHTML=h;
  $('#cols').onchange=e=>{wide=e.target.checked;try{localStorage.setItem('cases-wide',wide?'1':'')}catch(x){}$('#tbl').classList.toggle('slim',!wide)};
  $('#q').oninput=e=>{F.q=e.target.value;body()};
  $('#sec').onchange=e=>{F.section=e.target.value;body()};
  $('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;filters();body()});
}
function visible(r){
  const z=L==='zh'&&ZH[r.cur.ID]?' '+Object.values(ZH[r.cur.ID]).join(' '):'';
  const t=(r.cur.ID+' '+FIELDS.map(f=>r.cur[f]).join(' ')+z).toLowerCase();
  return (!F.q||t.includes(F.q.toLowerCase()))&&(!F.section||(r.cur.Section||'(no section)')===F.section)&&(!F.change||(r.cur.Change||'')===F.change)&&(!F.state||state(r)===F.state);
}
function cell(r,f){
  const prev=D.previous[r.cur.ID];
  const was=prev&&r.cur.Change==='modified'&&(prev[f]??'')!==(r.orig[f]??'')?`<div class="was">${esc(prev[f])}</div>`:'';
  const z=L==='zh'&&f!=='Spec Ref'?ZH[r.cur.ID]?.[f]:'';
  const zh=z?`<div class="zh${(r.cur[f]??'')!==(r.orig[f]??'')?' stale':''}" data-stale="${esc(T('stale'))}">${esc(z)}</div>`:'';
  // plain text until clicked (or Enter): one editor at a time, not 3,000 boxes on the page
  return `<td>${zh}<div class="cv"${REVIEW?` tabindex="0" data-id="${esc(r.cur.ID)}" data-f="${f}"`:''}>${esc(r.cur[f])}</div>${was}</td>`;
}
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${T(ch)??ch}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${T(st)??st}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:pageLinks(r.cur.ID);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  // the open questions this row's assumption depends on: a marker that opens the question above the table
  const qm=(D.questions||[]).filter(q=>q.rows.includes(r.cur.ID)).map(q=>{const st=qState(q.id);
    return `<a class="qmark ${st}" href="#q-${esc(q.id)}" data-q="${esc(q.id)}" title="${esc(st==='open'?'This row assumes an answer to an open question: read it or answer it':st==='done'?'Answered and applied':'Answered, waiting for the agent')}">${esc(q.id)}${st==='open'?' ?':' ✓'}</a>`}).join(' ');
  const why=(L==='zh'&&ZH[r.cur.ID]?.['Change Reason'])||r.cur['Change Reason'];
  return `${esc(r.cur.ID)}<div>${badges}</div>${qm?`<div>${qm}</div>`:''}${spec}${why?`<div class="reason">${esc(why)}</div>`:''}`;
}
// the Cov / Prog / Res links of a case, on its row and under each question that names it
function pageLinks(id){
  return [PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(id)}" aria-label="Coverage: where in the spec this case comes from and the controls it presses" data-tip="Coverage: where in the spec this case comes from and the controls it presses">Cov</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(id)}" aria-label="Progress: the segment that runs this case and its latest result" data-tip="Progress: the segment that runs this case and its latest result">Prog</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(id)}" aria-label="Results: what each run found, with screenshots" data-tip="Results: what each run found, with screenshots">Res</a>`].filter(Boolean);
}
const find=id=>rows.find(r=>r.cur.ID===id);
function bindField(el){el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()}
function editCell(d){
  const ta=document.createElement('textarea');ta.dataset.id=d.dataset.id;ta.dataset.f=d.dataset.f;ta.rows=2;ta.value=find(d.dataset.id).cur[d.dataset.f]??'';
  d.replaceWith(ta);bindField(ta);ta.focus();
  ta.onblur=()=>{filters();const v=document.createElement('div');v.className='cv';v.tabIndex=0;v.dataset.id=ta.dataset.id;v.dataset.f=ta.dataset.f;v.textContent=ta.value;ta.replaceWith(v)};
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(secZh(s))}${L==='zh'&&secZh(s)!==s?` <span class="note">${esc(s)}</span>`:''} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="${esc(T('addTitle')??'Describe new cases in your own words; they become rows in the next draft')}">${T('add')??'+ Add case'}</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>${T('noteHead')??'New case notes'}</b><span>${T('noteHelp')??'Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.'}</span><button class="add" data-del="${esc(n.id)}">${T('remove')??'Remove'}</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="${esc(T('notePh')??'e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat')}">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">${T('keep')??'Keep'}</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">${T('delete')??'Delete'}</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">${T('noMatch')??'No cases match these filters.'}</td></tr>`;
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm(T('removeConfirm')??'Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('select').forEach(el=>{if(REVIEW)bindField(el)});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function saveState(){
  if(!REVIEW||!D.save)return;
  // a working copy of the approved table: nothing to save until something changed (a real draft can be approved as it is)
  const none=/^edit-/.test(D.draft)&&rows.every(r=>state(r)==='kept')&&!liveNotes().length;
  $('#save').disabled=none;$('#save').title=none?'Nothing has changed yet':'';
}
function counts(){
  saveState();
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  if(L==='zh'){$('#counts').innerHTML=REVIEW?T('counts',fin,c('kept'),c('edited'),c('added'),c('deleted'),nn):T('countsView',rows.length);return}
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
