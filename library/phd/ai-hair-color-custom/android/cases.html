<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hair Color Custom Test Cases · Android</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

y at 50; note the credit chip","Action":"1. Tap 「Platinum」\n2. Tap 「Custom」 and collapse the panel with ⌄","Expected Result":"The Custom result and its Intensity 50 come back without a new generation; the chip is unchanged; the button reads 「Retry」","Priority":"P1","Spec Ref":"R-055","Notes":"PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-055","Section":"Result","Precondition":"A Custom result just shown, Intensity dragged to 30, ✓ not tapped","Action":"Tap the Artwork key at the top right","Expected Result":"My AI Artwork opens on the AI Hair tab, Color sub-tab, and the Custom result is listed at full intensity (100%)","Priority":"P1","Spec Ref":"R-057","Notes":"PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-056","Section":"Result","Precondition":"A Custom result with Intensity at 60","Action":"Tap ✓","Expected Result":"A new Edit Room opens with the result at Intensity 60","Priority":"P1","Spec Ref":"R-058","Notes":"10/E D1-07: Android saves silently and opens a new Edit Room. PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-057","Section":"Result","Precondition":"The Intensity notice never dismissed with 「Don't show again」; first result of this install","Action":"Generate a Custom result","Expected Result":"A one-time dialog says My AI Artwork keeps only the 100% version; after 「OK」 the Intensity bar can be used","Priority":"P3","Spec Ref":"R-059","Notes":"10/E dialog, behaviour inherited (D1-15). PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-058","Section":"Styles generated","Precondition":"In the AI Hair Color room with a portrait photo with one clear, front-facing face (passes every entry check); the Custom panel is open; Account with at least 30 credits","Action":"1. Tap the face_framing style (Face)\n2. Choose a dark Base Color and a vivid Highlight Color\n3. Tap Generate","Expected Result":"The result shows the face_framing pattern: the C-075","Section":"Credits and failures","Precondition":"In the AI Hair Color room with a portrait photo with one clear, front-facing face (passes every entry check); the Custom panel is open; Account with at least 30 credits; a server failure 4002 can be forced (RD fixture)","Action":"Tap Generate","Expected Result":"「Please Try Different Content」 shows and the 6 credits are refunded","Priority":"P2","Spec Ref":"R-065","Notes":"Park: needs a failure fixture. PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-076","Section":"Credits and failures","Precondition":"In the AI Hair Color room with a portrait photo with one clear, front-facing face (passes every entry check); the Custom panel is open; Account with at least 30 credits; another server failure can be forced (RD fixture)","Action":"Tap Generate","Expected Result":"「An Error Has Occurred」 shows and the 6 credits are refunded","Priority":"P2","Spec Ref":"R-065","Notes":"Park: needs a failure fixture. PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-050","Section":"Credits and failures","Precondition":"One Custom generation done (TC-045)","Action":"1. Tap the credit chip\n2. Open 「Detail」 at the top right of Buy Credit","Expected Result":"The newest entry is AI Hair Color with 6 credits deducted","Priority":"P2","Spec Ref":"R-066, R-040","Notes":"PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-077","Section":"Credits and failures","Precondition":"In the AI Hair Color room with a portrait photo with one clear, front-facing face (passes every entry check)","Action":"1. Compare the credit chip with the balance in Mine\n2. Tap the credit chip","Expected Result":"1. The chip shows the same balance\n2. Buy Credit opens","Priority":"P2","Spec Ref":"R-067","Notes":"PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-079","Section":"Leaving the room","Precondition":"A Custom result shown, panel closed; opened from Launcher","Action":"Tap ✕ at the bottom left","Expected Result":"The room closes with no confirmation and the screen before entry shows; the result is still in My AI Artwork","Priority":"P1","Spec Ref":"R-068","Notes":"PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-081","Section":"Deeplink","Precondition":"A Custom deeplink for the ombre style guid from RD; a portrait photo with one clear, front-facing face (passes every entry check) ready","Action":"1. Open the deeplink\n2. Pick the photo if asked","Expected Result":"AI Hair Color opens with the Custom panel open and 「Ombré」 selected; no colours are chosen and Generate is disabled","Priority":"P2","Spec Ref":"R-069, R-070","Notes":"Park until RD gives the link format (Q-11; fallback mode=custom&style_guid=\u003cguid>). PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-082","Section":"Deeplink","Precondition":"A Custom deeplink with an unknown or unpublished style guid","Action":"Open the deeplink","Expected Result":"The Custom panel opens with no style selected and no error is shown","Priority":"P2","Spec Ref":"R-071","Notes":"Park until RD gives the link format (Q-11). PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-084","Section":"CMS","Precondition":"The CMS list of PhDM_AIHairColor_CustomStyle (names, order, published state) from the CMS owner","Action":"Open the Custom panel and compare the Style row with the CMS list","Expected Result":"The names, thumbnails and order match CMS and only published styles show","Priority":"P3","Spec Ref":"R-024","Notes":"Park: needs CMS data (Q-13). PM-only: no Design frame yet (no Design file supplied 2026-11-12)"},{"ID":"TC-090","Section":"Android system Back","Precondition":"Intro Demo page shown","Action":"Press system Back","Expected Result":"Same as ‹: AI Hair Color closes to the screen it was opened from","Priority":"P2","Spec Ref":"R-072","Notes":"PM-only: no Design frame yet (no tom - PM Figma 3287-89.md (text snapshot of PM Figma page 3287:89 「26 11E AI Hair Color Custom」,\nhttps://www.figma.com/design/vhIp15PMJcwOcWJ6E9Q4JE/AI-Hair?node-id=3287-89). Figma-only, PM only: no Design file was\nsupplied, so every row is PM-only (pass 7). Rules the page cites from the 10/E Hair Color spec (D1-xx, D2-xx, D3-xx)\nwere read from page 3026:89 「26 10E AI Hair Color v2」 (`extracted/hair-color-10e-rules.json`) and are tagged\n`[PM:10/E …]`.\n\n## Overview and Intro Demo\n- R-001 [PM:pm-header] Custom lets the user choose the style (11 kinds) and give 1–2 colours themselves; it does not use a CMS colour swatch (D6-00).\n- R-002 [PM:pm-flow Intro Demo] The Intro Demo page shows 「AI Hair Color」, 「Go beyond traditional hair colors! Explore everything from subtle highlights to vibrant, bold shades.」, 「Try Now」, 「Don't show again」 and a ‹ back key at the top left.\n- R-003 [PM:pm-flow Intro Demo] 「Try Now」 closes the Intro Demo and continues into AI Hair Color.\n- R-004 [PM:pm-flow Intro Demo] ‹ on the Intro Demo leaves AI Hair Color to the screen it was opened from.\n- R-005 [PM:pm-flow Intro Demo] With 「Don't show again」 ticked, the Intro Demo is not shown on later entries.\n\n## Entry checks (11/25 new)\n- R-006 [PM:pm-face-check] The entry checks run in this order: ① no face (blocked) → ② ratio wider than 16:9 or taller than 9:16 (Cancel / Crop) → ③ face too big (blocked) → ④ face too small / slanted (warning, Continue Anyway) (D2-01e).\n- R-007 [PM:pm-face-check] A face with yaw or roll above 15° shows the warning 「Please choose another photo」 / 「The face in this photo is too slanted, which may result in poorly generated results.」 with 「OK」 and 「Continue Anyway」 (D2-01d, thresholds and strings as Hair Volume / AI Hairstyle).\n- R-008 [PM:pm-face-check] A face narrower than 128 px on the 1024 px thumbnail shows the face-too-small warning with 「OK」 and 「Continue Anyway」 (D2-01d; string as AI Hairstyle, Q-9).\n- R-009 [PM:pm-face-check] The slanted and too-small checks warn and do not block: 「Continue Anyway」 enters the room with the photo; 「OK」 does not enter and lets the user choose another photo.\n- R-010 [PM:pm-face-check] A photo with no face is blocked with 「No face detected. Face is required for this feature.」 (D2-01d).\n- R-011 [PM:pm-face-check] A photo whose face is too big is blocked with 「The face in this photo is too big.」 (D2-01d).\n- R-012 [PM:pm-face-check; PM:10/E entry_blocked_ratio] A photo whose long side / short side is above 16/9 (≈1.78) shows a two-button dialog: 「Cancel」 gives up entering, 「Crop」 opens the existing Crop room; there is no Continue Anyway (D2-01b).\n- R-013 [PM:pm-face-check; PM:10/E crop_room] After cropping (✓ in Crop) the face checks run on the cropped image, the one sent to the API (D2-01c, D2-01e).\n- R-014 [PM:pm-face-check] Entering from Edit Room or a deeplink (photo already chosen), the four checks run in order at once (D2-01e, D1-10).\n- R-015 [PM:pm-face-check] The 16:9 / 9:16 ratio check applies on both platforms; Android AI Hairstyle's old 5:1 limit does not apply to AI Hair Color (D2-01b).\n\n## Custom cell in the swatch row\n- R-016 [PM:pm-ui custom_in_row] 「Custom」 is always the first cell of the swatch row, before every CMS template (like AI Background) (D6-01).\n- R-017 [PM:pm-ui custom_in_row] Before Custom is set, its cell shows a gradient background with ＋ and the label 「Custom」, and it is not selected; the first template stays selected (D6-01; the mockups draw a pencil icon, Q-2).\n- R-018 [PM:pm-ui custom_in_row] Tapping 「Custom」 opens the Custom panel (D6-02).\n\n## Custom panel layout\n- R-019 [PM:pm-ui panel_open_no_style] The Custom panel is a half-screen sheet titled 「Custom」 with a ⌄ collapse key at the top right and three areas from top to bottom: ① Style ② Color ③ Generate (D6-02).\n- R-020 [PM:pm-ui panel_open_no_style] The panel has no undo / redo and no ✕ / ✓ (D6-16).\n- R-021 [PM:pm-ui UI source note] The panel is at most 0.65 of the screen height (548.6 of 844 pt) with top corners rounded 20 pt; the photo stays visible above it.\n- R-022 [PM:pm-ui panel_open_no_style] The Color area has two rows titled 「Base Color」 and 「Highlight Color」; each row starts with a rainbow colour-wheel key with a ＋ badge, followed by 7 recommended colours (40 pt circles) that scroll sideways (D6-21).\n- R-023 [PM:pm-ui panel_open_no_style] Before a style is chosen, both colour rows and Generate are disabled (D6-03).\n\n## Style\n- R-024 [PM:pm-cms] The Style area lists the Custom styles from CMS (type PhDM_AIHairColor_CustomStyle): each with its thumbnail and ui_name, in CMS order, only published ones; the legal styles are solid_color, ombre, colored_roots, dip_dye, balayage, highlights, face_framing, colored_bangs, earloop_highlights, split_dye_vertical and split_dye_horizontal (D6-10, D6-13).\n- R-025 [PM:pm-ui UI source note] The split_dye_vertical and split_dye_horizontal thumbnails are still plain colour; the other 9 are photos (D6-17).\n- R-026 [PM:pm-ui UI source note] The selected style shows the selected frame (#ffbe98, 4 pt inner frame).\n- R-027 [PM:pm-ui panel_solid_color] solid_color takes one colour: only the 「Base Color」 row shows; the 「Highlight Color」 row does not appear (D6-04).\n- R-028 [PM:pm-ui panel_solid_color] With solid_color, choosing a Base Color enables Generate (D6-04).\n- R-029 [PM:pm-ui panel_two_tone] Every other style needs both colours: with only one filled, Generate stays disabled and 「Both Base Color and Highlight Color are required.」 shows under the rows (D6-04).\n- R-030 [PM:pm-ui panel_two_tone] The chosen colour in each row has a 2 pt #FFBE98 ring (D6-21).\n- R-031 [PM:pm-ui panel_solid_color] solid_color sends only main_color_r/g/b to the API, no accent colour.\n- R-032 [PM:pm-cms; PM:10/E D2-04] Each style generates its own colour pattern in the chosen colours (Multicolor: highlights follow the hair flow, the ombré starts below the ears).\n\n## Colour picking (palette)\n- R-033 [PM:pm-ui panel_palette] The colour-wheel key opens the app's existing colour palette: 「Cancel」 / 「Done」 on one line, a saturation-brightness square with a round cursor, a rainbow hue slider with a round handle, an eyedropper key right of the slider and a bottom row ✕ ↩ ↪ ⊕ ✓ (the bottom row is described but not drawn) (D6-05).\n- R-034 [PM:pm-ui panel_palette] The palette edits one slot at a time: the row whose wheel opened it receives the colour (D6-05).\n- R-035 [PM:pm-ui panel_palette] 「Done」 fills the slot and closes the palette; 「Cancel」 closes it without filling.\n- R-036 [PM:pm-ui panel_palette] The colour is converted from HEX to RGB and sent to the API as r/g/b values 0–255.\n- R-037 [PM:pm-ui panel_palette] The eyedropper key next to the hue slider works as in the app's existing palette.\n\n## Ready and Generate in the panel\n- R-038 [PM:pm-ui panel_ready] With a style and its colours complete, the orange Generate in the panel is enabled and shows 「Generate」 with ⬤ 6, no minus sign (D6-07, D6-15).\n- R-039 [PM:pm-ui panel_ready] Generate is inside the panel, not in the bottom row (D6-16).\n- R-040 [PM:pm-header] One Custom image costs 6 credits, the same as a template (D6-07).\n- R-041 [PM:pm-flow callout in-panel generate] Generate in the panel without collapsing: the result fills the photo area above, a 44 pt Intensity row (default 100%) appears above the panel's Generate and the button becomes 「Retry」 (D6-22, D6-23; result_in_panel is not drawn, Q-4).\n\n## Collapse = apply\n- R-042 [PM:pm-ui collapsed_applied] Tapping outside the panel or its ⌄ key both apply the settings; neither cancels (D6-08).\n- R-043 [PM:pm-ui collapsed_applied] After collapsing, the template row is back, the Custom cell is selected and the outer Generate is enabled (D6-08).\n- R-044 [PM:pm-ui collapsed_applied] The Custom cell then shows the two colours the user chose (D6-08; the mockup draws a pencil icon, Q-2).\n- R-045 [PM:pm-ui collapsed_applied] The Custom settings disappear only when the user leaves the room or overwrites them; everything else keeps them (D6-09).\n- R-046 [PM:pm-ui collapsed_applied 點別的 template] Tapping another template moves the selection but does not discard the Custom settings: the Custom cell still shows its colours and tapping Custom again shows the same settings (D6-09).\n\n## Generating\n- R-047 [PM:pm-flow; PM:pm-header] A Custom generation waits in place (10/E lifecycle) for about 42–48 s with staged reassuring strings, the first 「Applying your new hair color...」 (D6-11).\n- R-048 [PM:pm-header] Template generations keep their short wait; Custom's long wait does not affect them (D6-11).\n- R-049 [PM:10/E D1-03] While generating, the swatch row and Generate are disabled and the screen does not change.\n- R-050 [PM:10/E D1-03] If the system kills the app during generation, the result is lost and the credits stay charged (no user-visible Cancel).\n- R-051 [KB: KP-019] A burst of Generate taps charges once and gives one result.\n\n## Result\n- R-052 [PM:pm-ui result_custom] The Custom result shows in place with the Intensity bar (0–100%, default 100%) (D6-12, D1-14).\n- R-053 [PM:pm-ui result_custom] The button becomes 「Retry」; generating again charges 6 again (D6-12, D1-18).\n- R-054 [PM:10/E D1-16] Every new generation sets Intensity back to 100%.\n- R-055 [PM:pm-ui result_custom] Switching away from Custom and back recalls the Custom result and its Intensity, with no new generation and no charge (D6-12, D1-19).\n- R-056 [PM:10/E D1-14, D1-12] Dragging the Intensity bar is free; releasing it is one undo step.\n- R-057 [PM:pm-ui result_custom; PM:10/E D1-15, D1-05] The result is saved to My AI Artwork at 100% the moment it succeeds; the top-bar Artwork key opens My AI Artwork on the AI Hair tab, Color sub-tab, where it is listed.\n- R-058 [PM:pm-ui result_custom; PM:10/E D1-13, D1-07] ✓ takes the result at its current Intensity into Edit Room; on Android Edit Room opens anew with it (the image is first saved silently).\n- R-059 [PM:10/E D1-15] When the first result appears, a one-time dialog says My AI Artwork keeps only the 100% version; 「Don't show again」 stops it.\n- R-060 [PM:10/E D2-04] The result keeps the hairstyle outline, hair length, face, background and clothes; only the hair colour changes.\n\n## Credits, premium and failures\n- R-061 [PM:pm-cms; PM:10/E D3-02a] Custom styles carry a CMS usageType free / purchase; a Free user who generates with a purchase style gets the paywall (D3-04).\n- R-062 [PM:10/E Credit not enough] A Free user without enough credits gets 「Upgrade to Premium」 → paywall.\n- R-063 [PM:10/E Credit not enough] A subscriber without enough credits gets 「More Credits Required!」 → 「Get Credit」 → Credit Shop.\n- R-064 [PM:10/E Credit not enough] On Android, the Quick Credit Refill (one-time 10-credit pack) is offered when credits run short (D4-04).\n- R-065 [PM:10/E Error Handle] A failed generation uses the existing dialogs and refunds the credits: 4002 → 「Please Try Different Content」, other errors → 「An Error Has Occurred」 (D3-06).\n- R-066 [KB: KP-017] Buy Credit › Detail lists each Custom generation under AI Hair Color with 6 credits deducted (and a refund when one happens).\n- R-067 [PM:pm-flow; KB: KP-020] The top-bar credit chip shows the current balance; tapping it opens Buy Credit.\n\n## Leaving the room\n- R-068 [PM:10/E D1-20b] ✕ in the bottom row gives up this edit and returns to the screen before entry with no confirmation.\n\n## Deeplink\n- R-069 [PM:pm-deeplink] A deeplink with a Custom style guid opens AI Hair Color with the Custom panel open and that style selected, waiting for the user's colours (D6-14).\n- R-070 [PM:pm-deeplink] The deeplink carries no colours.\n- R-071 [PM:pm-deeplink] A guid that CMS does not know or has unpublished opens the Custom panel with no style selected and shows no error.\n\n## Android system Back (pass 8)\n- R-072 [Rule pass 8: system Back] System Back on the Intro Demo does what ‹ does.\n- R-073 [Rule pass 8: system Back] System Back on the slanted / too-small face warning: the spec is silent (Q-14); the row records what happens.\n- R-074 [Rule pass 8: system Back] System Back with the Custom panel open: the spec is silent (Q-14); the row records whether it collapses (applies) or leaves.\n- R-075 [Rule pass 8: system Back] System Back in the colour palette does what 「Cancel」 does (the existing palette's own close).\n- R-076 [Rule pass 8: system Back] System Back in the room with the panel closed does what ✕ does (D1-20b).\n- R-077 [Rule pass 8: system Back] System Back while a Custom generation is running: the spec is silent (no Cancel, D1-03; Q-14); the row records what happens.\n\n## CMS and design tokens\n- R-078 [PM:pm-cms] Each Custom style's guid is Style_\u003cserial>_\u003cUIName>_\u003cmodel>, the value a deeplink carries (D6-14) — NOT TESTABLE: CMS-internal naming; the deeplink rows use the guid RD gives.\n- R-079 [PM:pm-ui UI source note] The room and panel use the Design System tokens and layout stack the note lists (Bottom_Sheet_bg #342f2e, Button_1_bg_n #ffbe98, thumbnail cells 64×82 at a 68 pitch, the empty 44 pt Intensity slot, 36 pt compare key) — NOT TESTABLE here: a design-check item (figma skill conformance), not a functional row.\n\n## Open questions\n- Q-1 Is 「Custom」 also the first cell of the Multicolor tab's row? The page says it is the first cell of the whole swatch row and draws only the Solid tab. Assumption: Custom is first in both tabs. R-016, TC-018.\n- Q-2 How does the Custom cell look? The notes say a gradient with ＋ before it is set and the user's two colours after Apply; every mockup (flow and UI) draws a pencil icon instead. Assumption: the notes. R-017, R-044, TC-017, TC-038.\n- Q-3 What happens to the colours when the style changes between solid_color and a two-colour style (is Highlight kept, is Base kept)? The page is silent. Assumption: only the Highlight row hides / shows; the rows record what stays. R-027, R-029, TC-0   tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function saveState(){
  if(!REVIEW||!D.save)return;
  // a working copy of the approved table: nothing to save until something changed (a real draft can be approved as it is)
  const none=/^edit-/.test(D.draft)&&rows.every(r=>state(r)==='kept')&&!liveNotes().length;
  $('#save').disabled=none;$('#save').title=none?'Nothing has changed yet':'';
}
function counts(){
  saveState();
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  if(L==='zh'){$('#counts').innerHTML=REVIEW?T('counts',fin,c('kept'),c('edited'),c('added'),c('deleted'),nn):T('countsView',rows.length);return}
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=()=>toast(T('copied',label)??label+' copied.');try{await navigator.clipboard.writeText(text);ok()}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast(T('copyFail')??'Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),T('csvLabel')??'Final CSV');if(liveNotes().length)setTimeout(()=>toast(T('csvNotes')??'Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),T('decLabel')??'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){const ids=empty.map(r=>r.ID).join(', ');toast(T('fillFirst',ids)??`Fill in Action and Expected Result for ${ids} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast((T('saved',j.version,j.cases,j.csv)??`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`)+(nn?T('savedNotes',nn,j.notes_file)??` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast((T('saveFail')??'Save failed: ')+e.message)}finally{$('#save').disabled=false;saveState()}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
// a row's question marker (and a #q-Q-3 link) opens that question above the table, also when clicked twice
addEventListener('hashchange',()=>{if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3))});
document.addEventListener('click',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&!String(getSelection()))editCell(d)});
// the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
